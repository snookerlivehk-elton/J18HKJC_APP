name: Meeting Tick (pre + post race)

# 阿里雲／Railway 雙邊並行：
#   Secrets: RAILWAY_DATABASE_URL（或沿用 DATABASE_URL）、ALIYUN_DATABASE_URL、JJJC_API_BASE
#   未設定該邊 DB secret → 該 job 自動 skip（exit 0）
#   Vars（可選）: ENABLE_MEETING_TICK_RAILWAY / ENABLE_MEETING_TICK_ALIYUN = false 可關閉
#   預設 mode=all（賽前＋賽後）；可用 workflow_dispatch mode 覆寫

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Tick mode (all|pre_race|post_race)"
        required: false
        default: "all"
      lookback_days:
        description: "Lookback days (post_race)"
        required: false
        default: "3"
      lookahead_days:
        description: "Lookahead days (pre_race)"
        required: false
        default: "3"
      dry_run:
        description: "Dry run (true/false)"
        required: false
        default: "false"

jobs:
  tick-railway:
    name: Tick → Railway DB
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_MEETING_TICK_RAILWAY != 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run meeting_tick (Railway)
        env:
          USE_SQLITE: "false"
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.RAILWAY_DATABASE_URL_SYNC }}
          DATABASE_URL_SYNC_FALLBACK: ${{ secrets.DATABASE_URL_SYNC }}
          JJJC_API_BASE: ${{ secrets.JJJC_API_BASE }}
          JJJC_RESULTS_API_BASE: ${{ secrets.JJJC_RESULTS_API_BASE }}
          MEETING_TICK_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MEETING_TICK_LOOKAHEAD_DAYS: ${{ github.event.inputs.lookahead_days || '3' }}
          MEETING_TICK_MODE: ${{ github.event.inputs.mode || 'all' }}
        run: |
          export DATABASE_URL="${DATABASE_URL:-$DATABASE_URL_FALLBACK}"
          export DATABASE_URL_SYNC="${DATABASE_URL_SYNC:-${DATABASE_URL_SYNC_FALLBACK:-$DATABASE_URL}}"
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${DATABASE_URL_SYNC:-}" ]; then
            echo "Skip: set RAILWAY_DATABASE_URL or DATABASE_URL secret"
            exit 0
          fi
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python meeting_tick.py --mode "${MEETING_TICK_MODE}" \
            --lookback-days "${MEETING_TICK_LOOKBACK_DAYS}" \
            --lookahead-days "${MEETING_TICK_LOOKAHEAD_DAYS}" \
            --json $EXTRA

  tick-aliyun:
    name: Tick → Aliyun DB
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_MEETING_TICK_ALIYUN != 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run meeting_tick (Aliyun)
        env:
          USE_SQLITE: "false"
          DATABASE_URL: ${{ secrets.ALIYUN_DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.ALIYUN_DATABASE_URL_SYNC }}
          JJJC_API_BASE: ${{ secrets.JJJC_API_BASE }}
          JJJC_RESULTS_API_BASE: ${{ secrets.JJJC_RESULTS_API_BASE }}
          MEETING_TICK_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MEETING_TICK_LOOKAHEAD_DAYS: ${{ github.event.inputs.lookahead_days || '3' }}
          MEETING_TICK_MODE: ${{ github.event.inputs.mode || 'all' }}
        run: |
          export DATABASE_URL_SYNC="${DATABASE_URL_SYNC:-$DATABASE_URL}"
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${DATABASE_URL_SYNC:-}" ]; then
            echo "Skip: set ALIYUN_DATABASE_URL secret"
            exit 0
          fi
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python meeting_tick.py --mode "${MEETING_TICK_MODE}" \
            --lookback-days "${MEETING_TICK_LOOKBACK_DAYS}" \
            --lookahead-days "${MEETING_TICK_LOOKAHEAD_DAYS}" \
            --json $EXTRA

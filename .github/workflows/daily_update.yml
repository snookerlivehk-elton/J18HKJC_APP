name: Daily J18 Data Update

on:
  schedule:
    # 每天香港時間凌晨 2:00 執行 (UTC 時間 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:
    # 允許手動在 GitHub 網頁上點擊執行

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Batch Crawler
      env:
        # 將 Railway 的資料庫連線網址設定在 GitHub Secrets 中
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        USE_SQLITE: "false"
        J18_API_BASE_URL: ${{ secrets.J18_API_BASE_URL }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      run: |
        # 計算昨天與今天的日期
        START_DATE=$(date -d "yesterday" +%Y-%m-%d)
        END_DATE=$(date +%Y-%m-%d)
        echo "開始抓取從 $START_DATE 到 $END_DATE 的賽事資料..."
        
        # 執行爬蟲
        python batch_crawler.py --start $START_DATE --end $END_DATE

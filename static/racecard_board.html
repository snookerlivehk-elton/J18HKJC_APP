<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("j18-racecard-theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="noindex" />
  <title>排位 · J18</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav: #3d5a80;
      --nav-2: #334b6b;
      --page: #eef1f5;
      --text: #2c3340;
      --muted: #8a93a3;
      --blue: #5ba3d9;
      --blue-2: #3b8fd4;
      --green: #5cb85c;
      --yellow: #d4a017;
      --orange: #e88b2a;
      --red: #e74c3c;
      --place: #27ae60;
      --line: #e4e7ec;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      /* 左鎖兩欄：馬號上馬名下；獨贏上位置下左、檔位豎排右 */
      --pin-id: 94px;
      --pin-odds: 58px;
      --pin-w: calc(var(--pin-id) + var(--pin-odds));
      --head-fs: 13px;
      /* 右滑列規則：最長數據到分隔線固定 2px（JS COL_FIT 同步） */
      --scroll-col-gap: 2px;
      --scroll-col-rule: 1px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      overflow: hidden;
      background: #d8dee6; color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex; flex-direction: column;
      max-width: 430px; margin: 0 auto;
      background: var(--page);
      min-height: 100%;
      box-shadow: 0 0 0 1px rgba(45,62,80,.12);
    }
    button { font-family: inherit; }

    .topbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 44px; padding: 0 10px;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff; z-index: 60;
      position: relative;
    }
    .topbar .side {
      min-width: 64px;
      font-size: 15px;
      font-weight: 700;
    }
    .topbar .side.l {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .topbar .side.r {
      position: relative;
      display: flex;
      justify-content: flex-end;
      text-align: right;
    }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .06em; }
    .topbar .nav-back,
    .topbar .nav-menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin: 0;
      padding: 6px 4px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar .nav-back:active,
    .topbar .nav-menu-btn:active,
    .topbar .nav-menu-btn[aria-expanded="true"] {
      background: rgba(255, 255, 255, .14);
    }
    .topbar .nav-back .chev {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      margin-top: -1px;
    }
    .topbar .nav-menu-btn .lab { letter-spacing: .04em; }
    .topbar .nav-menu-btn .caret {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      opacity: .95;
      transition: transform .18s ease;
    }
    .topbar .nav-menu-btn[aria-expanded="true"] .caret {
      transform: rotate(180deg);
    }
    .topbar-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 70;
      min-width: 168px;
      padding: 6px 0;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      box-shadow: 0 10px 28px rgba(45, 62, 80, .22), 0 0 0 1px rgba(45, 62, 80, .08);
      transform-origin: top right;
      animation: topbarMenuIn .16s ease-out;
    }
    .topbar-menu[hidden] { display: none; }
    @keyframes topbarMenuIn {
      from { opacity: 0; transform: translateY(-4px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .topbar-menu { animation: none; }
      .topbar .nav-menu-btn .caret { transition: none; }
    }
    .topbar-menu button {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 0;
      padding: 10px 10px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar-menu button:active {
      background: #eef3f8;
    }
    .topbar-menu button .menu-tag {
      margin-left: auto;
      padding-left: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }
    .topbar-menu .sep {
      height: 1px;
      margin: 6px 8px;
      background: var(--line);
    }
    .topbar-menu .menu-zoom {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 8px 10px;
    }
    .topbar-menu .menu-zoom .zoom-lab {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .04em;
      user-select: none;
    }
    .topbar-menu .menu-zoom .zoom-btn,
    .topbar-menu .menu-zoom .zoom-reset {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 32px;
      height: 32px;
      margin: 0;
      padding: 0 10px;
      border: 1px solid #c5ced9;
      border-radius: 8px;
      background: #f4f7fa;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar-menu .menu-zoom .zoom-reset {
      margin-left: 2px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .04em;
    }
    .topbar-menu .menu-zoom .zoom-btn:active,
    .topbar-menu .menu-zoom .zoom-reset:active {
      background: #e8eef4;
    }
    .topbar-menu .menu-zoom .zoom-btn:disabled,
    .topbar-menu .menu-zoom .zoom-reset:disabled {
      opacity: .38;
      cursor: default;
    }

    /* 顯示模式：字體調整上方的滑動開關（淺／深） */
    .topbar-menu .menu-theme {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 8px 6px;
      user-select: none;
    }
    .topbar-menu .menu-theme .theme-lab {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .04em;
    }
    .topbar-menu .menu-theme .theme-lab.is-on {
      color: #2f5649;
      font-weight: 700;
    }
    .topbar-menu .menu-theme .theme-switch {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 4px 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      min-width: 0;
      width: auto;
    }
    .topbar-menu .menu-theme .theme-track {
      position: relative;
      display: block;
      width: 46px;
      height: 26px;
      border-radius: 13px;
      background: #c5ced9;
      box-shadow: inset 0 1px 2px rgba(45, 62, 80, .18);
      transition: background .22s ease;
      overflow: hidden;
    }
    .topbar-menu .menu-theme .theme-track::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.28) 42%, transparent 70%);
      transform: translateX(-60%);
      transition: transform .35s ease;
      pointer-events: none;
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-track {
      background: linear-gradient(180deg, #3d6b5c 0%, #2f5649 100%);
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-track::before {
      transform: translateX(60%);
    }
    .topbar-menu .menu-theme .theme-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(45, 62, 80, .28);
      transition: transform .22s ease;
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-thumb {
      transform: translateX(20px);
    }
    @media (prefers-reduced-motion: reduce) {
      .topbar-menu .menu-theme .theme-track,
      .topbar-menu .menu-theme .theme-track::before,
      .topbar-menu .menu-theme .theme-thumb { transition: none; }
    }
    /* 馬匹列表／水位彈窗內容等比例縮放；水位殼本身不 zoom，避免 top 對齊被放大帶偏 */
    #boardMain,
    #waterSheetZoom {
      transform-origin: top left;
      zoom: var(--list-zoom, 1);
    }
    @supports not (zoom: 1) {
      #boardMain,
      #waterSheetZoom {
        transform: scale(var(--list-zoom, 1));
        width: calc(100% / var(--list-zoom, 1));
      }
    }

    /* 頁眉下公告跑馬燈（隨列表滾動，不鎖定） */
    .anno {
      display: flex;
      align-items: stretch;
      height: 28px;
      background: #fff6d6;
      border-bottom: 1px solid #edd9a0;
      overflow: hidden;
    }
    .anno-lab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      background: #f0dfa0;
      color: #3d5a80;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    .anno-track {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 8px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 8px), transparent);
    }
    .anno-run {
      display: inline-flex;
      align-items: center;
      gap: 56px;
      white-space: nowrap;
      will-change: transform;
      animation: annoMarquee 22s linear infinite;
      color: #d32f2f;
      font-size: 13px;
      font-weight: 400;
      line-height: 1;
      padding-left: 10px;
    }
    .anno-run span { flex: 0 0 auto; }
    @keyframes annoMarquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .anno-run { animation: none; transform: none; }
    }

    .subhead {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 8px 10px 5px;
    }

    /* 場次：單行不換行；寬度不夠時左右滑選 */
    .race-pills {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: flex-start;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      scrollbar-width: thin;
      padding: 1px 2px 4px;
    }
    .race-pills::-webkit-scrollbar {
      height: 3px;
    }
    .race-pills::-webkit-scrollbar-thumb {
      background: #c5ced9;
      border-radius: 2px;
    }
    .race-pills button {
      flex: 0 0 auto;
      width: 32px; height: 26px; border: 0; border-radius: 6px; cursor: pointer;
      font-weight: 800; font-size: 13px; color: #fff; background: var(--green);
      -webkit-tap-highlight-color: transparent;
    }
    .race-pills button.active { background: var(--blue); }
    .race-pills button.demo { background: var(--orange); }
    .race-pills button.demo.active { background: var(--blue); }

    .meta {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-top: 3px; font-size: 12px; line-height: 1.45; color: #5b6575;
    }
    .race-meta-line {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .race-status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 1px;
      max-width: 4.8em;
      padding: 0;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
      color: #5b6575;
      white-space: nowrap;
    }
    .race-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: #8a93a3;
      box-shadow: 0 0 0 1px rgba(45, 62, 80, .08);
    }
    /* 狀態燈色系對齊頁面：藍／綠／黃／紅／橙 */
    .race-status[data-status="wait"] .race-status-dot { background: var(--blue); }
    .race-status[data-status="parade"] .race-status-dot { background: var(--green); }
    .race-status[data-status="gate"] .race-status-dot { background: var(--yellow); }
    .race-status[data-status="running"] .race-status-dot {
      background: var(--red);
      box-shadow: 0 0 0 1px rgba(231, 76, 60, .18);
      animation: raceStatusPulse 1.2s ease-in-out infinite;
    }
    .race-status[data-status="paid"] .race-status-dot { background: var(--orange); }
    .race-status[data-status="wait"] { color: var(--blue-2); }
    .race-status[data-status="parade"] { color: #3d9a3d; }
    .race-status[data-status="gate"] { color: #a67f0f; }
    .race-status[data-status="running"] { color: #c0392b; }
    .race-status[data-status="paid"] { color: #c46e18; }
    @keyframes raceStatusPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .55; transform: scale(.92); }
    }
    @media (prefers-reduced-motion: reduce) {
      .race-status[data-status="running"] .race-status-dot { animation: none; }
    }
    .race-meta-text {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }
    .race-meta-viewport {
      display: block;
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
    }
    .race-meta-run {
      display: inline-block;
      max-width: none;
      white-space: nowrap;
      line-height: 1.45;
      will-change: transform;
      transform: translateX(0);
    }
    .race-meta-run.is-marquee {
      animation-name: raceMetaBounce;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-direction: alternate;
      animation-duration: var(--meta-dur, 10s);
    }
    @keyframes raceMetaBounce {
      from { transform: translateX(0); }
      to { transform: translateX(calc(-1 * var(--meta-overflow, 0px))); }
    }
    @media (prefers-reduced-motion: reduce) {
      .race-meta-run.is-marquee { animation: none; transform: none; }
    }

    /* 場次信息與馬匹列表之間：時間軸＋膠囊（對齊參考稿，吸頂鎖定） */
    .insight-pin {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 4px 4px 3px; /* 左右收窄，給展開膠囊更多號碼空間 */
      background: #f7f9fc;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(45, 62, 80, .04);
    }
    .time-scrub {
      display: block;
      min-width: 0;
      padding: 0 2px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .time-scrub-track-wrap {
      position: relative;
      width: 100%;
      padding-top: 14px;
      height: 36px;
      box-sizing: border-box;
      cursor: pointer;
    }
    .time-scrub-labels {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 14px;
      pointer-events: none;
    }
    .time-scrub-lab-item {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      color: #8a93a3;
      white-space: nowrap;
      letter-spacing: 0;
    }
    .time-scrub-lab-item.is-edge-start {
      transform: translateX(0);
    }
    .time-scrub-lab-item.is-edge-end {
      transform: translateX(-100%);
    }
    .time-scrub-lab-item.is-active {
      color: #c45f12;
      font-weight: 800;
    }
    .time-scrub-lab-item.is-open-lab {
      font-size: 8px;
      letter-spacing: -.02em;
    }
    /* 視覺細軌＋加大熱區 */
    .time-scrub-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 20px;
      height: 5px;
      border-radius: 999px;
      background: #e6ebf2;
      box-shadow: inset 0 0 0 1px rgba(45, 62, 80, .05);
    }
    .time-scrub-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f7c39a 0%, #f0a03a 42%, #e87a3a 78%, #e25a3c 100%);
      pointer-events: none;
    }
    .time-scrub-marks {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .time-scrub-mark {
      position: absolute;
      top: 50%;
      width: 5px;
      height: 5px;
      margin: -2.5px 0 0 -2.5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(232, 139, 42, .35);
    }
    .time-scrub-mark.is-active {
      background: #fff;
      box-shadow: 0 0 0 1.5px var(--orange);
    }
    .time-scrub-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #e87a3a;
      box-shadow: 0 1px 4px rgba(200, 90, 30, .28);
      pointer-events: none;
      z-index: 1;
    }
    .time-scrub.is-dragging .time-scrub-thumb {
      transform: scale(1.1);
      border-color: #d06028;
    }
    .capsule-rail {
      display: flex;
      align-items: stretch;
      gap: 6px;
      min-height: 40px;
      margin-top: -2px; /* 與時間條再貼近 2px */
    }
    .capsule {
      display: flex;
      align-items: center;
      min-width: 0;
      height: 40px;
      border-radius: 999px;
      border: 1px solid #cfd7e4;
      background: #e8eef5;
      color: var(--nav);
      overflow: hidden;
      transition: flex .28s ease, background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .capsule:not(.is-open) {
      flex: 0 0 auto;
      cursor: pointer;
    }
    .capsule:not(.is-open) .capsule-head-wrap,
    .capsule:not(.is-open) .capsule-head,
    .capsule:not(.is-open) .capsule-chev {
      pointer-events: none; /* 收起時整顆點開 */
    }
    .capsule.is-open {
      flex: 1 1 auto;
      border-color: transparent;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff;
      box-shadow: 0 1px 3px rgba(45, 62, 80, .18);
      overflow: visible; /* 角標可探出 */
    }
    /* 綜合指數：參考稿 — 奶油底＋橙粉頭＋白圈馬號＋右側狀態 */
    .capsule[data-capsule="index"] {
      border-color: #f0d2a0;
      background: #fff4df;
      color: #b55f0d;
      box-shadow: inset 0 0 0 1px rgba(240, 180, 80, .2);
      padding-right: 4px;
    }
    .capsule[data-capsule="index"].is-open {
      border-color: #f0d2a0;
      background: #fff4df;
      color: #2c3340;
      box-shadow: 0 1px 3px rgba(200, 130, 40, .14), inset 0 0 0 1px rgba(240, 180, 80, .22);
    }
    .capsule[data-capsule="index"] .capsule-head-wrap {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      height: 32px;
      margin: 4px 0 4px 4px;
      padding: 0 4px 0 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff9a4a 0%, #f07838 55%, #e85a6a 100%);
      color: #fff;
      box-shadow: 0 1px 2px rgba(200, 80, 40, .22);
    }
    .capsule[data-capsule="index"] .capsule-head {
      height: 32px;
      margin: 0;
      padding: 0 4px 0 8px;
      border-radius: 999px;
      background: transparent;
      color: #fff;
      gap: 4px;
      box-shadow: none;
    }
    .capsule[data-capsule="index"]:not(.is-open) .capsule-head-wrap {
      margin: 4px;
    }
    .capsule[data-capsule="index"] .capsule-ico {
      display: inline-flex;
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      opacity: .95;
    }

    /* 表格區殼：表體 + 馬匹詳情彈層同尺寸 */

      display: flex;
      align-items: stretch;
      min-height: 0;
      border-bottom: 1px solid var(--line);
    }
    .water-row.alt .water-lock,
    .water-row.alt .water-pin,
    .water-row.alt .wp-odds,
    .water-row.alt .whour { background: #f4f6f8; }
    .water-row.scratched { opacity: .45; }
    .water-row.head {
      position: sticky;
      top: 0;
      z-index: 5;
      min-height: 28px;
      border-bottom: 1px solid #c9d9d1;
    }
    .water-row.head .water-lock,
    .water-row.head .water-pin,
    .water-row.head .wp-odds,
    .water-row.head .whour {
      background: #e8f0ec;
      color: #355a4c;
      font-size: 11px;
      font-weight: 700;
    }
    /* 馬號名＋賠率一起 sticky，橫滑時段時數字列不丟 */
    .water-lock {
      position: sticky;
      left: 0;
      z-index: 3;
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      background: #fff;
      box-shadow: 2px 0 4px rgba(45, 62, 80, .06);
    }
    .water-row.head .water-lock { z-index: 6; }
    .water-pin {
      flex: 0 0 var(--wh-pin-w);
      width: var(--wh-pin-w);
      box-sizing: border-box;
      padding: var(--wh-pad-y) 4px var(--wh-pad-y) 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 0;
      background: #fff;
      overflow: hidden;
    }
    .water-row.head .water-pin {
      justify-content: center;
      align-items: center;
    }
    /* 馬號＋騎練＋馬名收成一塊垂直居中，避免名下大片留白 */
    .wp-stack {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      width: 100%;
    }
    .wp-id {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    /* 與外層馬匹列表 .hno 同尺（22×22／15px） */
    .water-pin .hno {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      place-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--nav);
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-pin .hno > span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 1em;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums lining-nums;
      transform: translateY(-0.08em);
    }
    /* 與外層列表 .hname 同尺 */
    .water-pin .nm {
      display: block;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.02;
      padding-left: 0;
      letter-spacing: -.02em;
      margin-top: 3px;
    }
    .wp-jt-col {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 1px;
    }
    .wp-jname,
    .wp-tname {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.05;
      color: var(--text);
    }
    .wp-tname { color: #5b6575; }
    /* 賠率獨立列：與時段水位同行高、同頂邊，橫向齊平 */
    .wp-odds {
      flex: 0 0 var(--wh-odds-w);
      width: var(--wh-odds-w);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      gap: var(--wh-line-gap);
      /* 右框較前版外拓 3px；數字／箭頭再左移 2px */
      padding: var(--wh-pad-y) 8px var(--wh-pad-y) 2px;
      background: #fff;
      border-right: 1px solid #d5e2db;
      overflow: visible;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-row.head .wp-odds {
      justify-content: center;
      align-items: center;
      padding-right: 6px;
    }
    .wp-odds .win,
    .wp-odds .pla,
    .wp-odds .wp {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      box-sizing: border-box;
      height: var(--wh-line-h);
      min-height: var(--wh-line-h);
      font-size: var(--wh-num-fs);
      font-weight: 400;
      line-height: var(--wh-num-lh);
      white-space: nowrap;
      text-align: right;
      transform: translateX(-5px);
    }
    .wp-odds .win { color: var(--text); }
    .wp-odds .pla { color: #7b8494; }
    .wp-odds .wp {
      color: #8a93a3;
      /* 較獨贏／位置再右移 10px（共用 translateX(-5px) + 10） */
      transform: translateX(5px);
    }
    .wp-odds .win.hot,
    .wp-odds .pla.hot,
    .wp-odds .wp.hot { color: var(--red); }
    .wp-odds .od-n {
      font: inherit;
      font-size: var(--wh-num-fs);
      line-height: var(--wh-num-lh);
      color: inherit;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-pin .pin-lab,
    .wp-odds .pin-lab {
      font-size: 11px;
      font-weight: 700;
      color: #355a4c;
      line-height: 1.2;
      text-align: center;
      width: 100%;
    }
    /* 時段列：等寬收緊、內容居中對齊 */
    .whour {
      flex: 0 0 var(--wh-col-w);
      width: var(--wh-col-w);
      box-sizing: border-box;
      padding: var(--wh-pad-y) 1px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: var(--wh-line-gap);
      background: #fff;
      border-right: 1px solid #eef1f4;
    }
    .water-row.head .whour {
      text-align: center;
      justify-content: center;
      align-items: center;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .wh-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 100%;
      height: var(--wh-line-h);
      min-height: var(--wh-line-h);
      line-height: var(--wh-num-lh);
      white-space: nowrap;
    }
    /* 水位＝箭頭＋數字同行；流量＝僅數字 */
    .wh-metric {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      gap: 0;
      min-width: 0;
      height: var(--wh-line-h);
    }
    .wh-metric:not(.no-arr) {
      flex: 0 0 auto;
      min-width: calc(var(--wh-arr-w) + 1.25em);
    }
    .wh-metric.no-arr {
      flex: 0 0 1.3em;
      width: 1.3em;
      justify-content: center;
    }
    .wh-line .wv,
    .wh-line .fv {
      display: block;
      font-size: var(--wh-num-fs);
      font-weight: 400;
      text-align: center;
      line-height: var(--wh-num-lh);
      height: var(--wh-line-h);
      font-variant-numeric: tabular-nums lining-nums;
    }
    .wh-line .wv {
      width: 1.25em;
      min-width: 1.25em;
      color: var(--text);
    }
    .wh-line .fv {
      width: 100%;
      color: #5b6575;
    }
    .wh-line.pla .wv,
    .wh-line.pla .fv { color: #7b8494; }
    /* 第三行 WP（獨贏+位置混合池）：再淡一級，與獨贏／位置分層 */
    .wh-line.wp .wv,
    .wh-line.wp .fv { color: #8a93a3; }
    .wh-line .muted { color: var(--muted); }
    /* 升＝綠↖，降＝紅↙；預設隱藏佔位，僅十字高亮行／列顯示，減少眼花 */
    .wh-arr {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 var(--wh-arr-w);
      width: var(--wh-arr-w);
      height: var(--wh-line-h);
      font-size: var(--wh-arr-fs);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      pointer-events: none;
      visibility: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Segoe UI Symbol", sans-serif;
    }
    .wh-arr.up { color: #1e8e3e; }
    .wh-arr.down { color: #c0392b; }
    .water-row.is-wh-cross-row .wh-arr:not(.none),
    .whour.is-wh-cross-col .wh-arr:not(.none) {
      visibility: visible;
    }
    /* 水位表十字定位：點選時段格 → 整行＋整列高亮，交叉為焦點 */
    .water-row:not(.head) .whour[data-wh-col] {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    /* 十字高亮：沿用水位頂欄綠系（#3d6b5c／#2f5649／#e8f0ec） */
    .water-row.is-wh-cross-row > .water-lock,
    .water-row.is-wh-cross-row .water-pin,
    .water-row.is-wh-cross-row .wp-odds,
    .water-row.is-wh-cross-row > .whour {
      background: #dce9e2;
    }
    .water-row.alt.is-wh-cross-row > .water-lock,
    .water-row.alt.is-wh-cross-row .water-pin,
    .water-row.alt.is-wh-cross-row .wp-odds,
    .water-row.alt.is-wh-cross-row > .whour {
      background: #d0e0d7;
    }
    .water-board .whour.is-wh-cross-col {
      background: #dce9e2;
    }
    .water-row.alt .whour.is-wh-cross-col {
      background: #d0e0d7;
    }
    .water-row.head .whour.is-wh-cross-col {
      background: #c2d6cb;
      box-shadow: inset 0 -2px 0 #2f5649;
      color: #234438;
    }
    .water-board .whour.is-wh-cross-cell {
      background: #a8c9b6;
      box-shadow: inset 0 0 0 1.5px #2f5649;
      z-index: 2;
    }
    .water-row.is-wh-cross-row > .water-lock {
      box-shadow: 2px 0 4px rgba(45, 62, 80, .06), inset 0 0 0 1px rgba(47, 86, 73, .4);
    }
    /* 點水位／流量數字打開詳情；表頭「水位」「流量」仍負責排序 */
    .hrow:not(.head) .cell.scroll-col[data-open="water"] {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hrow:not(.head) .cell.scroll-col[data-open="water"]:active {
      background: rgba(47, 86, 73, .08);
    }
    .horse-sheet-bar {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 44px 12px 12px;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff;
    }
    .horse-sheet-silk {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      background-color: transparent;
      background-size: contain;
      background-position: left top;
      background-repeat: no-repeat;
    }
    .horse-sheet-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      font-size: 14px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .horse-sheet-title {
      min-width: 0;
      flex: 1 1 auto;
    }
    .horse-sheet-title .nm {
      display: block;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: .02em;
      line-height: 1.15;
    }
    .horse-sheet-title .sub {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      opacity: .88;
      line-height: 1.25;
    }
    .horse-sheet-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 6px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .horse-sheet-close:active { background: rgba(255,255,255,.28); }
    .horse-sheet-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 10px 10px 16px;
      background: #f4f6f8;
    }
    .horse-sheet-odds {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .horse-sheet-odds .box {
      background: #fff;
      border: 1px solid var(--line);
      padding: 10px 8px;
      text-align: center;
    }
    .horse-sheet-odds .k {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .horse-sheet-odds .v {
      display: block;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }
    .horse-sheet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }
    .horse-sheet-grid .item {
      background: #fff;
      padding: 9px 10px;
      min-width: 0;
    }
    .horse-sheet-grid .item.wide { grid-column: 1 / -1; }
    .horse-sheet-grid .k {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
      line-height: 1.2;
    }
    .horse-sheet-grid .v {
      display: block;
      font-size: 14px;
      color: var(--text);
      font-weight: 400;
      line-height: 1.3;
      word-break: break-word;
    }
    .horse-sheet-grid .v.muted { color: var(--muted); }

    .hrow {
      display: flex;
      align-items: stretch;
      height: 47px;
      min-width: max-content;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    /* 資料列加高 2px，多出的距離放在彩衣與馬名之間 */
    .hrow:not(.head) {
      height: 49px;
    }
    .hrow.alt { background: #f4f6f8; }
    .hrow.scratched .hname { text-decoration: line-through; }
    .hrow.scratched .cell { opacity: .45; }
    /* 小旗標記整行：一按黃、再按綠、三按復原 */
    .hrow.mark-1 { background: #fde8cc; }
    .hrow.mark-1 .lock-cluster { background: #fde8cc; }
    .hrow.mark-2 { background: #d4efdf; }
    .hrow.mark-2 .lock-cluster { background: #d4efdf; }
    .hrow.alt.mark-1 { background: #f7dcb8; }
    .hrow.alt.mark-1 .lock-cluster { background: #f7dcb8; }
    .hrow.alt.mark-2 { background: #c5e8d3; }
    .hrow.alt.mark-2 .lock-cluster { background: #c5e8d3; }

    .lock-cluster {
      position: sticky;
      left: 0;
      top: auto;
      z-index: 4;
      display: grid;
      grid-template-columns: var(--pin-id) var(--pin-odds);
      flex: 0 0 var(--pin-w);
      width: var(--pin-w);
      min-width: var(--pin-w);
      align-self: stretch;
      background: #fff;
      box-shadow: 6px 0 8px rgba(45, 62, 80, .10);
      isolation: isolate;
    }
    .hrow.alt .lock-cluster { background: #f4f6f8; }
    .hrow.head {
      position: relative;
      z-index: 6;
      height: 47px;
      background: #eef3f8;
      color: #111;
      font-size: var(--head-fs); font-weight: 400;
      text-align: center;
    }
    .hrow.head .lock-cluster {
      z-index: 8;
      background: #eef3f8;
    }

    .cell {
      display: flex; align-items: center; justify-content: center;
      padding: 0 2px;
      font-size: var(--head-fs);
      font-weight: 400;
      overflow: hidden;
    }
    .lock-cluster .cell.pin-id {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1px;
      padding: 1px 2px;
    }
    /* 資料列：彩衣｜馬號｜騎／練姓氏首字（上騎下練）；馬名跨底 */
    .hrow:not(.head) .cell.pin-id {
      display: grid;
      grid-template-columns: 33px 22px 15px;
      grid-template-rows: 31px minmax(0, 1fr);
      column-gap: 2px;
      align-items: stretch;
      justify-items: stretch;
      padding: 0 2px 0 0;
      overflow: visible;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hrow:not(.head) .cell.pin-id:active {
      background: rgba(91, 163, 217, .16);
    }
    .hno {
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      justify-self: center;
      z-index: 2;
      display: grid;
      place-items: center;
      place-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--nav);
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      margin-top: -1px;
    }
    /* 列表第一列：馬號加大 2px、下移 2px；橫向仍左移 3px（騎／練首字不動） */
    .hrow:not(.head) .cell.pin-id .hno {
      width: 24px;
      height: 24px;
      font-size: 17px;
      transform: translate(-3px, 2px);
    }
    .hno > span,
    .draw-no > span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 1em;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums lining-nums;
      transform: translateY(-0.08em);
    }
    /* 馬號右側：上＝騎師姓氏首字，下＝練馬師姓氏首字 */
    .hrow:not(.head) .cell.pin-id .jt-ini {
      grid-column: 3;
      grid-row: 1;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      align-self: center;
      justify-self: center;
      line-height: 1;
      min-width: 0;
      pointer-events: none;
    }
    .jt-ini .j-ini,
    .jt-ini .t-ini {
      display: block;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.05;
      text-align: center;
    }
    .jt-ini .j-ini,
    .jt-ini .t-ini { color: var(--text); }
    .jt-ini .j-ini { transform: translateY(-1px); }
    .jt-ini .t-ini { transform: translateY(1px); }
    /* 馬名橫跨首列；右側留空給兩字跑法角標；僅馬名左移 5px
       width 補回 5px，避免 transform 左移後右側留白、文字卻被 ellipsis 截斷 */
    .hrow:not(.head) .cell.pin-id .hname {
      grid-column: 1 / -1;
      grid-row: 2;
      z-index: 2;
      align-self: center;
      justify-self: stretch;
      max-width: none;
      width: calc(100% + 5px);
      padding: 0 26px 0 1px;
      margin-top: -1px;
      text-align: left;
      transform: translateX(-5px);
    }
    /* 預計跑法兩字全稱角標：前領／跟前／中置／後上 —— 貼首列右下 */
    .hrow:not(.head) .cell.pin-id .rs-chip {
      position: absolute;
      right: 1px;
      bottom: 3px;
      z-index: 3;
      box-sizing: border-box;
      min-width: 24px;
      height: 14px;
      padding: 0 3px;
      margin: 0;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      line-height: 14px;
      text-align: center;
      color: #fff;
      letter-spacing: -.04em;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
    .rs-chip.lead { background: #3d5a80; }   /* 前領 */
    .rs-chip.press { background: #2f8f78; }  /* 跟前 */
    .rs-chip.mid { background: #6a7382; }    /* 中置 */
    .rs-chip.late { background: #c47a3a; }   /* 後上 */
    .hrow.scratched .rs-chip { opacity: .55; }
    .hrow.head .lock-cluster .cell { padding: 0 2px; }
    .hrow.head .cell.head-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: center;
      align-content: center;
      justify-items: center;
      column-gap: 1px;
      row-gap: 0;
    }
    .hrow.head .cell.head-split .odds-sort { grid-column: 1; grid-row: 1; }
    .hrow.head .cell.head-split .head-static { grid-column: 1; grid-row: 2; }
    .hrow.head .cell.head-split .sort-hit {
      grid-column: 2; grid-row: 1 / span 2;
      align-self: center;
    }
    /* 獨贏／位置左、檔位豎排右，同一格 */
    .hrow.head .cell.pin-odds {
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 1px;
      padding: 0 2px;
    }
    .odds-labs {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 0;
      line-height: 1.02;
      text-align: right;
    }
    .draw-sort {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: var(--head-fs);
      font-weight: 400;
      padding: 0;
      line-height: 1.02;
      cursor: pointer;
    }
    .draw-lab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.02;
      font-size: inherit;
      font-weight: 400;
    }
    .sortable { cursor: pointer; user-select: none; }
    .head-static {
      display: block;
      font-size: var(--head-fs); font-weight: 400; line-height: 1.02;
      /* 隨表頭主題色（淺／深），與可排序欄文字一致 */
      color: inherit; cursor: default; user-select: none;
    }
    .odds-sort {
      display: inline-flex; flex-direction: row;
      align-items: center; justify-content: center; gap: 1px;
      width: auto; max-width: 100%; border: 0; background: transparent;
      color: inherit; font: inherit; font-size: var(--head-fs); font-weight: 400;
      padding: 0; line-height: 1.02; cursor: pointer; text-align: center;
      white-space: nowrap; border-radius: 3px;
    }
    .hrow.head .lock-cluster .odds-sort { font-size: var(--head-fs); line-height: 1.02; }
    .hrow.head .scroll-col .odds-sort {
      flex-direction: row; align-items: center; justify-content: center;
      gap: 1px; width: auto; font-size: var(--head-fs); white-space: nowrap;
      line-height: 1.02;
    }
    .odds-sort .lab { display: block; line-height: 1.02; font-size: inherit; }
    .sort-hit {
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; background: transparent; padding: 0; margin: 0;
      cursor: pointer; color: inherit; line-height: 1;
    }
    .sort-ico {
      display: inline-flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1px; flex: 0 0 auto;
      line-height: 1;
    }
    .sort-ico .u, .sort-ico .d {
      display: block; font-size: 10px; font-weight: 900;
      color: #c5cad3; line-height: 1;
    }
    .sortable.on { color: #2c5f8a; }
    .sort-ico .u.on, .sort-ico .d.on { color: var(--orange); }
    .hrow.head .cell.sort-on {
      background: #e4eef8;
      box-shadow: inset 0 -2px 0 #3b8fd4;
    }
    .cell.sort-col { background: rgba(91, 163, 217, .12); }
    .hrow.alt .cell.sort-col { background: rgba(91, 163, 217, .18); }

    .silk {
      display: block;
      width: 17px; height: 17px;
      border-radius: 0;
      background-color: transparent;
    }
    .hrow:not(.head) .cell.pin-id .silk {
      grid-column: 1;
      grid-row: 1;
      width: auto;
      min-width: 0;
      min-height: 0;
      align-self: stretch;
      justify-self: stretch;
      /* 相對原位：上移 2px、左移 3px（騎／練首字不動） */
      margin: 2px 0 0 1px;
      height: calc(100% + 1px);
      overflow: hidden;
      z-index: 1;
    }
    .silk.has-img {
      background-color: transparent !important;
      box-shadow: none !important;
      background-size: contain;
      background-position: left top;
      background-repeat: no-repeat;
    }
    .hname {
      display: block;
      font-size: 13px; font-weight: 400; line-height: 1.02;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text);
      max-width: none; /* 舊 52px 會讓四字馬名被截斷，右側卻看似仍有空位 */
      text-align: left;
      letter-spacing: -.02em;
    }

    .hrow:not(.head) .cell.pin-odds {
      flex-direction: row;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      padding: 2px 3px 2px 8px;
      overflow: hidden;
    }
    /* 右欄：上旗下檔位；檔位底邊與位置賠率齊平 */
    .draw-flag-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      flex: 0 0 auto;
      gap: 2px;
      min-width: 22px;
      padding: 0;
      transform: translateX(3px);
    }
    .row-flag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: #b0b8c4;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      line-height: 0;
      transform: translateY(6px);
    }
    .row-flag svg {
      width: 25px;
      height: 28px;
      display: block;
    }
    .row-flag:active {
      background: rgba(45, 62, 80, .08);
    }
    .row-flag[data-mark="1"] {
      color: var(--orange);
    }
    .row-flag[data-mark="2"] {
      color: var(--green);
    }
    .draw-no {
      display: grid;
      place-items: center;
      place-content: center;
      flex: 0 0 auto;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 1px solid #cfd6de;
      background: #fff;
      font-size: 13px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: 0;
      color: var(--text);
      text-align: center;
    }

    .odds {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 2px;
      line-height: 1.02;
      padding: 0;
      transform: translateX(2px);
      font-variant-numeric: tabular-nums lining-nums;
    }
    /* 內層賠率棧：與外層 cell.odds 分開，避免整格被當 .odds 撐變形 */
    .cell.pin-odds > .odds {
      flex: 0 0 auto;
      max-width: calc(100% - 36px);
      overflow: visible;
    }
    .odds .win,
    .odds .pla {
      position: relative;
      display: block;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.02;
      white-space: nowrap;
      text-align: right;
    }
    .odds .win { color: var(--text); transform: translateY(-7px); }
    .odds .pla { color: #7b8494; transform: translateY(-4px); }
    .odds .win.hot, .odds .pla.hot { color: var(--red); }
    .odds .od-n {
      font: inherit;
      color: inherit;
      font-variant-numeric: tabular-nums lining-nums;
      line-height: 1;
    }
    /* 字符箭頭絕對貼數字右側，不佔版面寬度（外層賠率／水位流量／彈窗賠率共用） */
    .odds .od-tick,
    .scroll-col .wp .od-tick,
    .wp-odds .od-tick {
      position: absolute;
      left: 100%;
      top: 50%;
      margin-top: -0.45em;
      margin-left: 1px;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
      font-family: "Noto Sans TC", "PingFang TC", "Segoe UI Symbol", sans-serif;
    }
    /* 彈窗賠率行高含水位箭頭位，升降箭改對齊數字中線 */
    .wp-odds .od-tick {
      top: calc(var(--wh-num-fs) * var(--wh-num-lh) / 2);
      margin-top: 0;
      transform: translateY(-50%);
    }
    .odds .od-tick.up,
    .scroll-col .wp .od-tick.up,
    .wp-odds .od-tick.up { color: #1e8e3e; }
    .odds .od-tick.down,
    .scroll-col .wp .od-tick.down,
    .wp-odds .od-tick.down { color: #c0392b; }
    /* 賠率刷新後：箭頭呼吸 3 次提示升降更新 */
    .odds .od-tick.fresh,
    .scroll-col .wp .od-tick.fresh,
    .wp-odds .od-tick.fresh {
      animation: odTickBreath .65s ease-in-out 3;
      transform-origin: center center;
    }
    .wp-odds .od-tick.fresh {
      animation-name: odTickBreathWp;
    }
    @keyframes odTickBreath {
      0%, 100% { opacity: 1; transform: scale(1); }
      40% { opacity: .22; transform: scale(1.45); }
      75% { opacity: 1; transform: scale(1); }
    }
    @keyframes odTickBreathWp {
      0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
      40% { opacity: .22; transform: translateY(-50%) scale(1.45); }
      75% { opacity: 1; transform: translateY(-50%) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .odds .od-tick.fresh,
      .scroll-col .wp .od-tick.fresh,
      .wp-odds .od-tick.fresh { animation: none; opacity: 1; }
    }
    .odds .na { color: var(--muted); font-size: 14px; }

    .muted { color: var(--muted); font-weight: 400; }
    .form { letter-spacing: .02em; font-weight: 400; font-variant-numeric: tabular-nums; }
    .comment { font-size: var(--head-fs); font-weight: 400; color: #4a5563; }
    /* 右滑列：列寬隨最長內容；數據到分隔線 = --scroll-col-gap */
    .scroll-col {
      position: relative;
      flex: 0 0 auto;
      width: max-content;
      min-width: 0;
      justify-content: center;
      padding: 0 calc(var(--scroll-col-gap) + var(--scroll-col-rule)) 0 var(--scroll-col-gap);
      overflow: hidden;
    }
    .scroll-col::after {
      content: "";
      position: absolute;
      top: var(--scroll-col-gap); bottom: var(--scroll-col-gap); right: 0;
      width: var(--scroll-col-rule);
      background: #e4e7ec;
      pointer-events: none;
    }
    .scroll-col.num {
      font-variant-numeric: tabular-nums;
      font-weight: 400;
    }
    /* 入圍數｜% 等：數據靠右 */
    .scroll-col.end {
      justify-content: flex-end;
      text-align: right;
    }
    .scroll-col.end .v {
      display: block;
      width: 100%;
      text-align: right;
    }
    .scroll-col .v {
      display: block;
      min-width: 0;
      max-width: none;
      overflow: visible;
      text-align: center;
      font-size: var(--head-fs);
      line-height: 1.05;
      white-space: nowrap;
    }
    .scroll-col .v.stacked {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      white-space: nowrap;
    }
    .scroll-col .v.stacked .nm,
    .scroll-col .v.stacked .sub {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      font: inherit;
      color: inherit;
      line-height: inherit;
    }
    .scroll-col .v.stacked .sub.delta {
      font-size: 12px;
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: .01em;
    }
    .scroll-col .v.stacked .sub.delta-pos { color: #c0392b; }
    .scroll-col .v.stacked .sub.delta-neg { color: #1e8e3e; }
    /* 預計跑法：文字 + 四枚向左三角（實心位＝跑法） */
    .scroll-col .v.run-style {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
      line-height: 1.05;
    }
    .scroll-col .v.run-style .nm {
      display: block;
      font: inherit;
      color: inherit;
      line-height: inherit;
    }
    .scroll-col .rs-marks {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 9px;
      line-height: 0;
    }
    .scroll-col .rs-tri {
      display: block;
      width: 7px;
      height: 8px;
      flex: 0 0 auto;
      overflow: visible;
    }
    .scroll-col .rs-tri polygon {
      stroke: #2a5f8f;
      stroke-width: 1.1;
      stroke-linejoin: round;
    }
    .scroll-col .rs-tri.on polygon {
      fill: #2a5f8f;
    }
    .scroll-col .rs-tri:not(.on) polygon {
      fill: #fff;
    }
    /* 近六賽績＋班次升降：每個近績數字正下方緊跟對應升／平／降圖例 */
    .scroll-col .v.form-class {
      display: inline-flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 0;
      white-space: nowrap;
      line-height: 1.05;
    }
    .scroll-col .fc-seg {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      min-width: 1.05em;
    }
    .scroll-col .fc-seg .fc-num {
      display: block;
      font: inherit;
      color: inherit;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .scroll-col .fc-sep {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 1px;
      font: inherit;
      color: inherit;
      line-height: 1.05;
      user-select: none;
    }
    .scroll-col .fc-m {
      display: block;
      width: 7px;
      height: 8px;
      flex: 0 0 auto;
      overflow: visible;
    }
    .scroll-col .fc-m.up polygon {
      fill: #1e8e3e;
      stroke: #1e8e3e;
      stroke-width: 0.6;
      stroke-linejoin: round;
    }
    .scroll-col .fc-m.down polygon {
      fill: #c0392b;
      stroke: #c0392b;
      stroke-width: 0.6;
      stroke-linejoin: round;
    }
    .scroll-col .fc-m.flat rect {
      fill: #8a93a0;
    }
    /* 水位／流量：獨贏上、位置下；右對齊＋▲▼（與賠率欄同款，零占位） */
    .scroll-col .wp {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 2px;
      line-height: 1.02;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      white-space: nowrap;
      overflow: visible;
    }
    .scroll-col .wp .w,
    .scroll-col .wp .p {
      position: relative;
      display: block;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.02;
      text-align: right;
    }
    .scroll-col .wp .w {
      color: var(--text);
      transform: translateY(-8px);
    }
    .scroll-col .wp .p {
      color: #7b8494;
      transform: translateY(-5px);
    }
    .scroll-col .wp .od-n {
      font: inherit;
      color: inherit;
      line-height: 1;
    }
    .scroll-col:has(.wp) {
      overflow: visible;
      align-items: flex-end;
    }

    /* 歷史場次前四名：負磅與騎師之間 — 絲帶徽章名次水印（無拖影） */
    .hrow:not(.head):has(.finish-wm-host) {
      overflow: visible;
      z-index: 2;
    }
    .hrow:not(.head) .cell.finish-wm-host,
    .hrow:not(.head) .cell.finish-wm-pair {
      position: relative;
      overflow: visible !important;
    }
    .hrow:not(.head) .cell.finish-wm-host {
      z-index: 0;
    }
    .hrow:not(.head) .cell.finish-wm-pair {
      z-index: 1;
    }
    .finish-wm {
      --wm-r: 224;
      --wm-g: 58;
      --wm-b: 58;
      --wm-fill: rgba(var(--wm-r), var(--wm-g), var(--wm-b), .58);
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translate(calc(-50% - 9px), -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 46px;
      pointer-events: none;
      z-index: 0;
      /* 不用整層 opacity：白描邊必須實心 */
      opacity: 1;
      user-select: none;
      color: rgb(var(--wm-r), var(--wm-g), var(--wm-b));
      overflow: visible;
    }
    /* 名次數字：塊面字形 + 實心白描邊 */
    .finish-wm-num {
      position: relative;
      z-index: 1;
      font-family: "Arial Black", Impact, "Helvetica Neue Condensed Bold", "Arial Narrow", sans-serif;
      font-size: 40px;
      font-weight: 900;
      font-style: italic;
      font-stretch: condensed;
      line-height: .78;
      letter-spacing: -0.06em;
      color: var(--wm-fill);
      -webkit-text-stroke: 5px #fff;
      paint-order: stroke fill;
      text-shadow:
        0 0 0 #fff,
        -3px 0 0 #fff,
        3px 0 0 #fff,
        0 -3px 0 #fff,
        0 3px 0 #fff,
        -3px -3px 0 #fff,
        3px -3px 0 #fff,
        -3px 3px 0 #fff,
        3px 3px 0 #fff,
        -1.5px -3px 0 #fff,
        1.5px -3px 0 #fff,
        -1.5px 3px 0 #fff,
        1.5px 3px 0 #fff,
        -3px -1.5px 0 #fff,
        3px -1.5px 0 #fff,
        -3px 1.5px 0 #fff,
        3px 1.5px 0 #fff;
    }
    .finish-wm-host > .v,
    .finish-wm-pair > .v {
      position: relative;
      z-index: 1;
    }
    .finish-wm.is-1 { --wm-r: 224; --wm-g: 58; --wm-b: 58; }
    .finish-wm.is-2 { --wm-r: 47; --wm-g: 112; --wm-b: 202; }
    .finish-wm.is-3 { --wm-r: 63; --wm-g: 143; --wm-b: 74; }
    .finish-wm.is-4 { --wm-r: 224; --wm-g: 177; --wm-b: 42; }

    .silk-1 { background:#e10600; } .silk-2 { background:#111; }
    .silk-3 { background:#0057b8; } .silk-4 { background:#ffd100; color:#222; }
    .silk-5 { background:#00a651; } .silk-6 { background:#e4007c; }
    .silk-7 { background:#00b5e2; color:#083044; } .silk-8 { background:#8a8d8f; }
    .silk-9 { background:#ff6a00; } .silk-10 { background:#6f2c91; }
    .silk-11 { background:#a8d08d; color:#1a3318; } .silk-12 { background:#7a1f2b; }
    .silk-13 { background:#fff; color:#111; box-shadow: inset 0 0 0 1px #999; }
    .silk-14 { background:#c5a028; color:#1a1408; }

    /* 連贏區：表內橫豎滾動；首行／首列 CSS sticky（20 匹可鎖定標號） */
    .qin-panel {
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      width: 100%;
      background: #eef1f5;
      border-top: 8px solid #eef1f5;
      padding: 0 0 10px;
      --qin-cell: 24px;
      --qin-title-w: 24px;
    }
    .qin-block {
      background: #fff;
      position: relative;
      /* 裁切邊緣回彈時 sticky 標號「漂浮」溢出 */
      overflow: hidden;
    }
    .qin-x {
      overflow: auto;
      /* 禁邊緣回彈漂浮；表內仍用 touch 慣性跟手 */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    .qin-tbl {
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
      font-variant-numeric: tabular-nums lining-nums;
      line-height: 1;
    }
    /* 明確列寬，避免角標 colspan=2 把首兩列均分導致右側留白 */
    .qin-tbl col.qin-col-rh {
      width: var(--qin-title-w);
    }
    .qin-tbl col.qin-col-c {
      width: var(--qin-cell);
    }
    .qin-tbl th,
    .qin-tbl td {
      border: 1px solid #cfd6e0;
      text-align: center;
      vertical-align: middle;
      padding: 0;
      height: var(--qin-cell);
      min-width: var(--qin-cell);
      width: var(--qin-cell);
      font-weight: 400;
      color: var(--text);
      background: #fff;
      box-sizing: border-box;
    }
    /* 角標：位置Q／正Q 左右波動開關（橫跨首列＋原「1」位） */
    .qin-tbl .qin-switch-cell {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 4;
      padding: 0;
      vertical-align: middle;
      background: #cfd5de;
      min-width: calc(var(--qin-title-w) + var(--qin-cell));
      width: calc(var(--qin-title-w) + var(--qin-cell));
      box-shadow: 0 2px 4px rgba(45, 62, 80, .10), 3px 0 6px rgba(45, 62, 80, .12);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .qin-mode-switch {
      display: block;
      width: 100%;
      height: 100%;
      min-height: var(--qin-cell);
      margin: 0;
      padding: 2px;
      border: 0;
      background: transparent;
      cursor: pointer;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .qin-sw-track {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: calc(var(--qin-cell) - 4px);
      border-radius: 3px;
      background: #b8c0cb;
      overflow: hidden;
    }

    /* 演示：第 1 場已完賽並已派彩（歷史場次），按名次排序＋冠亞季殿水印 */
    function ensureRace1HistoryPaidDemo() {
      if (!MEETING || !Array.isArray(MEETING.races)) return;
      const race = MEETING.races.find(function (r) { return Number(r.num) === 1; });
      if (!race || !Array.isArray(race.runners)) return;
      race.paid = true;
      race.history = true;
      const active = race.runners.filter(function (r) { return r && !r.scratched; });
      const already = active.length && active.every(function (r) {
        return numOrNull(r.finish) != null || numOrNull(r.position) != null || numOrNull(r.rank) != null;
      });
      if (already) return;
      active.slice().sort(function (a, b) {
        const aw = numOrNull(a.win);
        const bw = numOrNull(b.win);
        if (aw == null && bw == null) return Number(a.no) - Number(b.no);
        if (aw == null) return 1;
        if (bw == null) return -1;
        if (aw !== bw) return aw - bw;
        return Number(a.no) - Number(b.no);
      }).forEach(function (r, i) {
        r.finish = i + 1;
      });
    }

            let third = (seed * 5) % (Math.floor(runs / 4) + 1);
            if (first + second + third > runs) {
              third = Math.max(0, runs - first - second);
            }
            r[key] = { runs: runs, first: first, second: second, third: third };
          });
        });

    /* 賽果名次：有 finish/position/rank 則按名次；否則演示用獨贏由低到高作名次 */
    function payoutFinishNosForRace(race) {
      const runners = ((race && race.runners) || []).filter(function (r) { return r && !r.scratched; });
      if (!runners.length) return [];
      const hasFinish = runners.every(function (r) { return finishOfRunner(r) != null; });
      const sorted = runners.slice().sort(function (a, b) {
        if (hasFinish) {
          const fa = finishOfRunner(a);
          const fb = finishOfRunner(b);
          if (fa !== fb) return fa - fb;
          return Number(a.no) - Number(b.no);
        }
        const aw = numOrNull(a.win);
        const bw = numOrNull(b.win);
        if (aw == null && bw == null) return Number(a.no) - Number(b.no);
        if (aw == null) return 1;
        if (bw == null) return -1;
        if (aw !== bw) return aw - bw;
        return Number(a.no) - Number(b.no);
      });
      return sorted.map(function (r) { return r.no; });
    }

      return payoutFinishNosForRace(currentMeet());

          if (fa == null && fb == null) return Number(a.no) - Number(b.no);
          if (fa == null) return 1;
          if (fb == null) return -1;
          if (fa !== fb) return (fa - fb) * sortDir;
          return Number(a.no) - Number(b.no);
        }
        const av = sortVal(a, sortKey), bv = sortVal(b, sortKey);
        const an = numOrNull(av), bn = numOrNull(bv);
        let cmp;
        if (an != null && bn != null) cmp = an - bn;
        else cmp = String(av == null ? "" : av).localeCompare(String(bv == null ? "" : bv), "zh-Hant");
        if (cmp === 0) cmp = a.no - b.no;
        return cmp * sortDir;
      });

    function fitScrollColWidths() {

        for (let i = 0; i < cells.length && i < n; i++) all.push(cells[i]);

      rows.forEach((row) => {

        for (let i = 0; i < cells.length && i < n; i++) {
          widths[i] = Math.max(widths[i], Math.ceil(cells[i].getBoundingClientRect().width));
        }
      });
      rows.forEach((row) => {

        for (let i = 0; i < cells.length && i < n; i++) {

    function syncWaterSheetTop() {
      if (!el.waterSheet || !el.boardMain || !el.boardShell) return;
      if (el.board) el.board.scrollTop = 0;
      /* 殼不 zoom，按 boardMain 視覺頂對齊即可（boardMain zoom 原點為左上，頂邊不變） */
      const shellRect = el.boardShell.getBoundingClientRect();

    /* 水位彈窗時段：近→遠（左新右舊），箭頭相對右側更早時段比較 */
    const WATER_HOUR_COLS = 8;
    function parseMeetHour(meet) {
      const t = meet && (meet.time || meet.meta);
      const m = String(t || "").match(/(\d{1,2})\s*:\s*(\d{2})/);
      if (!m) return 14;
      return Math.max(0, Math.min(23, Number(m[1])));
    }
    function waterHourLabels(count) {
      const n = Math.max(1, Number(count) || WATER_HOUR_COLS);
      const base = parseMeetHour(currentMeet());
      const out = [];
      /* i=0 最左＝最近整點；往右每列更早一小時 */
      for (let i = 0; i < n; i++) {
        const h = (base - i + 24) % 24;
        out.push((h < 10 ? "0" : "") + h + ":00");
      }
      return out;
    }
    function clampInt(v, lo, hi) {
      const n = Math.round(Number(v));
      if (!Number.isFinite(n)) return lo;
      return Math.max(lo, Math.min(hi, n));
    }
    /* hourAgo：距開跑整點幾小時前；0＝最近。演示：越早水位略高、流量略低 */
    function waterHourSample(r, hourAgo) {
      if (!r || r.scratched) {
        return { winW: null, winF: null, plaW: null, plaF: null, wpW: null, wpF: null };
      }
      const no = Number(r.no) || 0;
      const raceNum = Number(currentRace) || 1;
      const hourIdx = Math.max(0, Number(hourAgo) || 0);
      const jitter = ((no * 3 + raceNum * 5 + hourIdx * 7) % 5) - 2;
      const winW0 = numOrNull(r.winWater);
      const plaW0 = numOrNull(r.placeWater);
      const wpW0 = numOrNull(r.wpWater);
      const winF0 = numOrNull(r.winFlow);
      const plaF0 = numOrNull(r.placeFlow);
      const wpF0 = numOrNull(r.wpFlow);
      const winW = winW0 == null ? null : clampInt(winW0 + hourIdx * 1.2 + jitter, 40, 99);
      const plaW = plaW0 == null ? null : clampInt(plaW0 + hourIdx * 1.0 + (jitter % 3), 35, 99);
      /* WP 時序抖動僅作占位；真實值日後由 API 提供 */
      const wpW = wpW0 == null ? null : clampInt(wpW0 + hourIdx * 1.1 + ((jitter + 1) % 3), 30, 99);
      const winF = winF0 == null ? null : clampInt(winF0 - hourIdx + ((no + hourIdx) % 3), 0, 40);
      const plaF = plaF0 == null ? null : clampInt(plaF0 - Math.max(0, hourIdx - 1) + ((no * 2 + hourIdx) % 3), 0, 40);
      const wpF = wpF0 == null ? null : clampInt(wpF0 - Math.max(0, hourIdx - 1) + ((no + hourIdx * 2) % 3), 0, 40);
      return { winW: winW, winF: winF, plaW: plaW, plaF: plaF, wpW: wpW, wpF: wpF };
    }

    /* 水位表十字焦點：{ no, col }；滑動不清除，點其他格切換 */

    /* 連贏示意：由獨贏／位置合成三角矩陣；日後可換成真實 QIN／QPL 盤 */
    let qinMode = "qin"; /* qin=正Q；qpl=連贏位置 */
    function qinPairKey(a, b) {
      return a < b ? a + "-" + b : b + "-" + a;
    }
    function synthQinOdds(wa, wb) {
      const a = numOrNull(wa), b = numOrNull(wb);
      if (a == null || b == null) return null;
      let v = a * b * 0.26;
      if (v >= 999) return 999;
      if (v >= 100) return Math.round(v);
      if (v >= 20) return Math.round(v * 2) / 2;
      return Math.round(v * 10) / 10;
    }
    function synthQplOdds(pa, pb) {
      const a = numOrNull(pa), b = numOrNull(pb);
      if (a == null || b == null) return null;
      let v = a * b * 0.62;
      if (v >= 999) return 999;
      if (v >= 100) return Math.round(v);
      if (v >= 20) return Math.round(v * 2) / 2;
      return Math.round(v * 10) / 10;
    }
    function fmtQinOdds(v) {
      const n = numOrNull(v);
      if (n == null) return "—";
      if (n >= 100) return String(Math.round(n));
      if (Number.isInteger(n)) return String(n);
      return n.toFixed(1);
    }
    function synthQinIndex(odds) {
      const n = numOrNull(odds);
      if (n == null) return null;
      const raw = 98 - Math.log10(Math.max(n, 1.05)) * 14;
      return Math.max(70, Math.min(92, Math.round(raw)));
    }
    function qinDropClass(a, b, raceNum) {
      const seed = qinMode === "qpl" ? 7 : 0;
      const s = (a * 17 + b * 31 + (raceNum + seed) * 13) % 23;
      if (s === 0) return "drop50";
      if (s === 1 || s === 2) return "drop20";
      return "";
    }
    function qinIndexClass(idx) {
      const n = numOrNull(idx);
      if (n == null) return "";
      if (n >= 89) return "idx-b";
      if (n >= 87) return "idx-g";
      if (n >= 85) return "idx-r";
      return "";
    }
    function buildQinPairs() {
      let runners = currentRunners()
        .filter(function (r) { return numOrNull(r.no) != null; })
        .slice()
        .sort(function (a, b) { return a.no - b.no; });
      if (runners.length > QIN_MAX_N) runners = runners.slice(0, QIN_MAX_N);
      const nos = runners.map(function (r) { return r.no; });
      const byNo = {};
      const scratch = {};
      runners.forEach(function (r) {
        byNo[r.no] = r;
        if (r.scratched) scratch[r.no] = true;
      });
      const oddsMap = {};
      let hotKey = null;
      let hotOdds = Infinity;
      const useQpl = qinMode === "qpl";
      for (let i = 0; i < nos.length; i++) {
        for (let j = i + 1; j < nos.length; j++) {
          const a = nos[i], b = nos[j];
          const key = qinPairKey(a, b);
          if (scratch[a] || scratch[b]) {
            oddsMap[key] = null;
            continue;
          }
          const od = useQpl
            ? synthQplOdds(byNo[a].place, byNo[b].place)
            : synthQinOdds(byNo[a].win, byNo[b].win);
          oddsMap[key] = od;
          if (od != null && od < hotOdds) {
            hotOdds = od;
            hotKey = key;
          }
        }
      }
      return { nos: nos, oddsMap: oddsMap, hotKey: hotKey, mode: qinMode, scratch: scratch };
    }
    function qinHorseScratched(qin, no) {
      return !!(qin && qin.scratch && qin.scratch[no]);
    }
    function qinPairInvolvesScratch(qin, a, b) {
      return qinHorseScratched(qin, a) || qinHorseScratched(qin, b);
    }
    function renderQinModeSwitchBtn(extraClass) {
      const side = qinMode === "qpl" ? "qpl" : "qin";
      const cls = "qin-mode-switch" + (extraClass ? " " + extraClass : "");
      return (
        '<button type="button" class="' + cls + '" data-qin-side="' + side +
          '" role="switch" aria-checked="' + (side === "qin" ? "true" : "false") +
          '" aria-label="連贏盤種：位置Q或正Q">' +
          '<span class="qin-sw-track" aria-hidden="true">' +
            '<span class="qin-sw-thumb"></span>' +
            '<span class="qin-sw-lab" data-qin-mode="qpl">位置Q</span>' +
            '<span class="qin-sw-lab" data-qin-mode="qin">正Q</span>' +
          "</span>" +
        "</button>"
      );
    }
    function renderQinModeSwitch() {
      return (
        '<th class="qin-switch-cell" colspan="2">' +

    }
    /* 單一矩陣：上三角＝賠率，下三角＝指數；角標開關切正Q／位置Q；首列「1」位為靜態指數 */
    function renderQinTable(qin) {
      const nos = qin.nos;
      const n = nos.length;
      const useQpl = qin.mode === "qpl";
      const oddsLab = useQpl ? "連贏位置" : "連贏";
      const idxLab = useQpl ? "位置指數" : "連贏指數";
      if (n < 2) {
        return '<div class="qin-block"><div class="qin-legend" style="padding:12px 10px">暫無連贏組合</div></div>';
      }
      let html =
        '<div class="qin-block">' +
          '<div class="qin-x" id="qinX">' +
            '<table class="qin-tbl" data-n="' + n + '" data-qin-mode="' + esc(qin.mode || "qin") +
            '" aria-label="' + oddsLab + '賠率（上三角）與' + idxLab + '（下三角）">' +
            '<colgroup><col class="qin-col-rh" />';
      for (let c = 0; c < n; c++) html += '<col class="qin-col-c" />';
      html +=
            "</colgroup>" +
            '<thead><tr role="group" aria-label="連贏盤種切換">' +
            renderQinModeSwitch();
      for (let j = 1; j < n; j++) {
        const sc = qinHorseScratched(qin, nos[j]) ? " scratch" : "";
        html += '<th class="qin-ch' + sc + '">' + esc(nos[j]) + "</th>";
      }
      html += "</tr></thead><tbody>";
      for (let i = 0; i < n; i++) {
        const rowHorse = nos[i];
        html += "<tr>";
        if (i === 0) {
          const sc = qinHorseScratched(qin, rowHorse) ? " scratch" : "";
          html += '<th class="qin-rh qin-idx-lab' + sc + '" scope="row">' +
            '<span class="qin-idx-inner">' +
              '<span class="qin-idx-txt">指數</span>' +
              '<span class="qin-idx-no">' + esc(rowHorse) + "</span>" +
            "</span></th>";
        } else {
          const sc = qinHorseScratched(qin, rowHorse) ? " scratch" : "";
          html += '<th class="qin-rh' + sc + '" scope="row">' + esc(rowHorse) + "</th>";
        }
        for (let j = 0; j < n; j++) {
          const colHorse = nos[j];
          if (i === j) {
            const sc = qinHorseScratched(qin, rowHorse) ? " scratch" : "";
            html += '<th class="qin-h' + sc + '">' + esc(rowHorse) + "</th>";
            continue;
          }
          const key = qinPairKey(rowHorse, colHorse);
          const scratched = qinPairInvolvesScratch(qin, rowHorse, colHorse);
          const od = scratched ? null : qin.oddsMap[key];
          if (j > i) {
            let cls = "qin-c";
            let text = "—";
            let attrs = ' data-qin-key="' + esc(key) + '" data-qin-kind="odds"';
            if (scratched) {
              cls += " scratch";
              attrs += ' data-qin-scratch="1" aria-disabled="true" aria-label="退出 ' + esc(key) + '"';
            } else {
              text = fmtQinOdds(od);
              if (key === qin.hotKey) cls += " hot";
              else {
                const drop = qinDropClass(rowHorse, colHorse, currentRace);
                if (drop) cls += " " + drop;
              }
              attrs += ' role="button" tabindex="0" aria-label="' + oddsLab + " " + esc(key) + '"';
            }
            html += '<td class="' + cls + '"' + attrs + ">" + esc(text) + "</td>";
          } else {
            let cls = "qin-c idx-cell";
            let text = "—";
            let attrs = ' data-qin-key="' + esc(key) + '" data-qin-kind="idx"';
            if (scratched) {
              cls += " scratch";
              attrs += ' data-qin-scratch="1" aria-disabled="true" aria-label="退出 ' + esc(key) + '"';
            } else {
              const idx = synthQinIndex(od);
              text = idx == null ? "—" : String(idx);
              const ic = qinIndexClass(idx);

    function refreshQinPanel() {
      const panel = document.getElementById("qinPanel");

      tbl.querySelectorAll("th.qin-h").forEach(function (th, idx) {

      const legend = panel.querySelector(".qin-legend");

    function setQinMode(mode) {

    function bindQinModeSwitch() {
      const panel = document.getElementById("qinPanel");
      if (!panel || panel.dataset.modeBound === "1") return;
      panel.dataset.modeBound = "1";
      /* 整塊角標或圖例右側大號開關，任意點擊均切換（與角標聯動） */
      function toggleQinMode(ev) {
        const hit = ev.target && ev.target.closest
          ? (ev.target.closest(".qin-switch-cell") ||
             ev.target.closest("button.qin-mode-switch") ||
             ev.target.closest(".qin-legend-actions"))
          : null;
        if (!hit || !panel.contains(hit)) return;

      }
      panel.addEventListener("click", toggleQinMode);

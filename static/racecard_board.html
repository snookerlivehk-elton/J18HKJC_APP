<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("j18-racecard-theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="noindex" />
  <title>排位 · J18</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav: #3d5a80;
      --nav-2: #334b6b;
      --page: #eef1f5;
      --text: #2c3340;
      --muted: #8a93a3;
      --blue: #5ba3d9;
      --blue-2: #3b8fd4;
      --green: #5cb85c;
      --orange: #e88b2a;
      --red: #e74c3c;
      --place: #27ae60;
      --line: #e4e7ec;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      /* 左鎖兩欄：馬號上馬名下；獨贏上位置下左、檔位豎排右 */
      --pin-id: 90px;
      --pin-odds: 58px;
      --pin-w: calc(var(--pin-id) + var(--pin-odds));
      --head-fs: 13px;
      /* 右滑列規則：最長數據到分隔線固定 2px（JS COL_FIT 同步） */
      --scroll-col-gap: 2px;
      --scroll-col-rule: 1px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      overflow: hidden;
      background: #d8dee6; color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex; flex-direction: column;
      max-width: 430px; margin: 0 auto;
      background: var(--page);
      min-height: 100%;
      box-shadow: 0 0 0 1px rgba(45,62,80,.12);
    }
    button { font-family: inherit; }

    .topbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 44px; padding: 0 10px;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff; z-index: 60;
      position: relative;
    }
    .topbar .side {
      min-width: 64px;
      font-size: 15px;
      font-weight: 700;
    }
    .topbar .side.l {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .topbar .side.r {
      position: relative;
      display: flex;
      justify-content: flex-end;
      text-align: right;
    }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .06em; }
    .topbar .nav-back,
    .topbar .nav-menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin: 0;
      padding: 6px 4px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar .nav-back:active,
    .topbar .nav-menu-btn:active,
    .topbar .nav-menu-btn[aria-expanded="true"] {
      background: rgba(255, 255, 255, .14);
    }
    .topbar .nav-back .chev {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      margin-top: -1px;
    }
    .topbar .nav-menu-btn .lab { letter-spacing: .04em; }
    .topbar .nav-menu-btn .caret {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      opacity: .95;
      transition: transform .18s ease;
    }
    .topbar .nav-menu-btn[aria-expanded="true"] .caret {
      transform: rotate(180deg);
    }
    .topbar-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 70;
      min-width: 168px;
      padding: 6px 0;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      box-shadow: 0 10px 28px rgba(45, 62, 80, .22), 0 0 0 1px rgba(45, 62, 80, .08);
      transform-origin: top right;
      animation: topbarMenuIn .16s ease-out;
    }
    .topbar-menu[hidden] { display: none; }
    @keyframes topbarMenuIn {
      from { opacity: 0; transform: translateY(-4px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .topbar-menu { animation: none; }
      .topbar .nav-menu-btn .caret { transition: none; }
    }
    .topbar-menu button {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 0;
      padding: 11px 14px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar-menu button:active {
      background: #eef3f8;
    }
    .topbar-menu button .menu-tag {
      margin-left: auto;
      padding-left: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }
    .topbar-menu .sep {
      height: 1px;
      margin: 6px 10px;
      background: var(--line);
    }
    .topbar-menu .menu-zoom {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px 10px;
    }
    .topbar-menu .menu-zoom .zoom-lab {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .04em;
      user-select: none;
    }
    .topbar-menu .menu-zoom .zoom-btn,
    .topbar-menu .menu-zoom .zoom-reset {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 32px;
      height: 32px;
      margin: 0;
      padding: 0 10px;
      border: 1px solid #c5ced9;
      border-radius: 8px;
      background: #f4f7fa;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar-menu .menu-zoom .zoom-reset {
      margin-left: 2px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .04em;
    }
    .topbar-menu .menu-zoom .zoom-btn:active,
    .topbar-menu .menu-zoom .zoom-reset:active {
      background: #e8eef4;
    }
    .topbar-menu .menu-zoom .zoom-btn:disabled,
    .topbar-menu .menu-zoom .zoom-reset:disabled {
      opacity: .38;
      cursor: default;
    }

    /* 顯示模式：字體調整上方的滑動開關（淺／深） */
    .topbar-menu .menu-theme {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 6px;
      user-select: none;
    }
    .topbar-menu .menu-theme .theme-lab {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .04em;
    }
    .topbar-menu .menu-theme .theme-lab.is-on {
      color: #2f5649;
      font-weight: 700;
    }
    .topbar-menu .menu-theme .theme-switch {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 4px 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      min-width: 0;
      width: auto;
    }
    .topbar-menu .menu-theme .theme-track {
      position: relative;
      display: block;
      width: 46px;
      height: 26px;
      border-radius: 13px;
      background: #c5ced9;
      box-shadow: inset 0 1px 2px rgba(45, 62, 80, .18);
      transition: background .22s ease;
      overflow: hidden;
    }
    .topbar-menu .menu-theme .theme-track::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.28) 42%, transparent 70%);
      transform: translateX(-60%);
      transition: transform .35s ease;
      pointer-events: none;
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-track {
      background: linear-gradient(180deg, #3d6b5c 0%, #2f5649 100%);
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-track::before {
      transform: translateX(60%);
    }
    .topbar-menu .menu-theme .theme-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(45, 62, 80, .28);
      transition: transform .22s ease;
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-thumb {
      transform: translateX(20px);
    }
    @media (prefers-reduced-motion: reduce) {
      .topbar-menu .menu-theme .theme-track,
      .topbar-menu .menu-theme .theme-track::before,
      .topbar-menu .menu-theme .theme-thumb { transition: none; }
    }
    /* 馬匹列表／水位彈窗內容等比例縮放；水位殼本身不 zoom，避免 top 對齊被放大帶偏 */
    #boardMain,
    #waterSheetZoom {
      transform-origin: top left;
      zoom: var(--list-zoom, 1);
    }
    @supports not (zoom: 1) {
      #boardMain,
      #waterSheetZoom {
        transform: scale(var(--list-zoom, 1));
        width: calc(100% / var(--list-zoom, 1));
      }
    }

    /* 頁眉下公告跑馬燈（隨列表滾動，不鎖定） */
    .anno {
      display: flex;
      align-items: stretch;
      height: 28px;
      background: #fff6d6;
      border-bottom: 1px solid #edd9a0;
      overflow: hidden;
    }
    .anno-lab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      background: #f0dfa0;
      color: #3d5a80;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    .anno-track {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 8px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 8px), transparent);
    }
    .anno-run {
      display: inline-flex;
      align-items: center;
      gap: 56px;
      white-space: nowrap;
      will-change: transform;
      animation: annoMarquee 22s linear infinite;
      color: #d32f2f;
      font-size: 13px;
      font-weight: 400;
      line-height: 1;
      padding-left: 10px;
    }
    .anno-run span { flex: 0 0 auto; }
    @keyframes annoMarquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .anno-run { animation: none; transform: none; }
    }

    .subhead {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 8px 10px 10px;
    }

    /* 場次：單行不換行；寬度不夠時左右滑選 */
    .race-pills {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: flex-start;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      scrollbar-width: thin;
      padding: 1px 2px 4px;
    }
    .race-pills::-webkit-scrollbar {
      height: 3px;
    }
    .race-pills::-webkit-scrollbar-thumb {
      background: #c5ced9;
      border-radius: 2px;
    }
    .race-pills button {
      flex: 0 0 auto;
      width: 32px; height: 26px; border: 0; border-radius: 6px; cursor: pointer;
      font-weight: 800; font-size: 13px; color: #fff; background: var(--green);
      -webkit-tap-highlight-color: transparent;
    }
    .race-pills button.active { background: var(--blue); }
    .race-pills button.demo { background: var(--orange); }
    .race-pills button.demo.active { background: var(--blue); }

    .meta {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-top: 8px; font-size: 12px; line-height: 1.45; color: #5b6575;
    }

    /* 表格區殼：表體 + 馬匹詳情彈層同尺寸 */
    .board-shell {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    /* 縱向：board-wrap；橫向馬匹：board-x；連贏在 board-x 外，左右滑互不干擾 */
    .board-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: clip;
      overflow-y: auto;
      overscroll-behavior: none;
      overflow-anchor: none;
      -webkit-overflow-scrolling: touch;
      background: #fff;
    }
    @supports not (overflow-x: clip) {
      .board-wrap { overflow-x: hidden; }
    }
    .board-x {
      overflow-x: auto;
      overflow-y: clip;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
      background: #fff;
    }
    @supports not (overflow-y: clip) {
      .board-x { overflow-y: hidden; }
    }
    /* 馬匹區塊：表頭在 board-x 外 CSS sticky（豎鎖原生）；
       右表頭用獨立 overflow-x + scrollLeft 跟隨 body（非 transform，減少果凍） */
    .board-horses {
      position: relative;
      background: #fff;
    }
    .board-head-pin {
      position: sticky;
      top: 0;
      z-index: 7;
      background: #eef3f8;
      overflow: hidden;
    }
    .board-head-pin .hrow.head {
      position: relative;
      top: auto;
      z-index: 7;
      width: 100%;
      min-width: 0;
    }
    .board-head-pin .lock-cluster {
      position: relative;
      left: auto;
      z-index: 8;
      background: #eef3f8;
    }
    .board-head-x {
      flex: 1 1 auto;
      min-width: 0;
      height: 47px;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      pointer-events: none;
    }
    .board-head-x::-webkit-scrollbar { display: none; }
    .board-head-x .head-scroll-inner {
      display: flex;
      align-items: stretch;
      height: 100%;
      min-width: max-content;
    }
    .board-head-pin button,
    .board-head-pin .sort-hit {
      pointer-events: auto;
    }

    .horse-sheet {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: inset 0 1px 0 rgba(45, 62, 80, .08);
      animation: horseSheetIn .22s ease-out;
    }
    .horse-sheet[hidden] { display: none !important; }
    @keyframes horseSheetIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    /* 水位頁：只蓋住馬匹列表（board-main 起），不遮場次／賽道信息 */
    .board-shell.is-water-open #board {
      overflow: hidden;
    }
    .water-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0; /* JS 對齊 board-main 頂（不受內部 zoom 影響） */
      z-index: 35;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: inset 0 1px 0 rgba(45, 62, 80, .08);
      animation: horseSheetIn .22s ease-out;
      overflow: hidden;
    }
    .water-sheet[hidden] { display: none !important; }
    #waterSheetZoom {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .water-sheet-bar {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 44px 10px 12px;
      background: linear-gradient(180deg, #3d6b5c 0%, #2f5649 100%);
      color: #fff;
    }
    .water-sheet-title {
      min-width: 0;
      flex: 1 1 auto;
    }
    .water-sheet-title .nm {
      display: block;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .06em;
      line-height: 1.15;
    }
    .water-sheet-title .sub {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      opacity: .9;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .water-sheet-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 6px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .water-sheet-close:active { background: rgba(255,255,255,.28); }
    .water-sheet-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 0;
      background: #f4f6f8;
    }
    .water-hint {
      flex: 0 0 auto;
      padding: 5px 12px;
      font-size: 11px;
      color: #5b6b64;
      background: #eef4f1;
      border-bottom: 1px solid #d5e2db;
      letter-spacing: .02em;
    }
    .water-hint b { color: #2f5649; font-weight: 700; }
    /* 左鎖：馬號名｜賠率；右滑時段等寬；水位箭頭在數字前同行，行高壓到數字本身 */
    .water-board {
      --wh-num-fs: 14px;
      --wh-num-lh: 1.05;
      --wh-arr-fs: 10px;
      --wh-arr-w: 0.78em;
      --wh-line-gap: 2px;
      --wh-pad-y: 4px;
      --wh-line-h: calc(var(--wh-num-fs) * var(--wh-num-lh));
      --wh-col-w: 54px;
      --wh-odds-w: 37px;
      --wh-pin-w: 73px;
      min-width: max-content;
      background: #fff;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-row {
      display: flex;
      align-items: stretch;
      min-height: 0;
      border-bottom: 1px solid var(--line);
    }
    .water-row.alt .water-lock,
    .water-row.alt .water-pin,
    .water-row.alt .wp-odds,
    .water-row.alt .whour { background: #f4f6f8; }
    .water-row.scratched { opacity: .45; }
    .water-row.head {
      position: sticky;
      top: 0;
      z-index: 5;
      min-height: 28px;
      border-bottom: 1px solid #c9d9d1;
    }
    .water-row.head .water-lock,
    .water-row.head .water-pin,
    .water-row.head .wp-odds,
    .water-row.head .whour {
      background: #e8f0ec;
      color: #355a4c;
      font-size: 11px;
      font-weight: 700;
    }
    /* 馬號名＋賠率一起 sticky，橫滑時段時數字列不丟 */
    .water-lock {
      position: sticky;
      left: 0;
      z-index: 3;
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      background: #fff;
      box-shadow: 2px 0 4px rgba(45, 62, 80, .06);
    }
    .water-row.head .water-lock { z-index: 6; }
    .water-pin {
      flex: 0 0 var(--wh-pin-w);
      width: var(--wh-pin-w);
      box-sizing: border-box;
      padding: var(--wh-pad-y) 4px var(--wh-pad-y) 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 0;
      background: #fff;
      overflow: hidden;
    }
    .water-row.head .water-pin {
      justify-content: center;
      align-items: center;
    }
    /* 馬號＋騎練＋馬名收成一塊垂直居中，避免名下大片留白 */
    .wp-stack {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      width: 100%;
    }
    .wp-id {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    /* 與外層馬匹列表 .hno 同尺（22×22／15px） */
    .water-pin .hno {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      place-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--nav);
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-pin .hno > span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 1em;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums lining-nums;
      transform: translateY(-0.08em);
    }
    /* 與外層列表 .hname 同尺 */
    .water-pin .nm {
      display: block;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.02;
      padding-left: 0;
      letter-spacing: -.02em;
      margin-top: 3px;
    }
    .wp-jt-col {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 1px;
    }
    .wp-jname,
    .wp-tname {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.05;
      color: var(--text);
    }
    .wp-tname { color: #5b6575; }
    /* 賠率獨立列：與時段水位同行高、同頂邊，橫向齊平 */
    .wp-odds {
      flex: 0 0 var(--wh-odds-w);
      width: var(--wh-odds-w);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      gap: var(--wh-line-gap);
      /* 右框較前版外拓 3px；數字／箭頭再左移 2px */
      padding: var(--wh-pad-y) 8px var(--wh-pad-y) 2px;
      background: #fff;
      border-right: 1px solid #d5e2db;
      overflow: visible;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-row.head .wp-odds {
      justify-content: center;
      align-items: center;
      padding-right: 6px;
    }
    .wp-odds .win,
    .wp-odds .pla,
    .wp-odds .wp {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      box-sizing: border-box;
      height: var(--wh-line-h);
      min-height: var(--wh-line-h);
      font-size: var(--wh-num-fs);
      font-weight: 400;
      line-height: var(--wh-num-lh);
      white-space: nowrap;
      text-align: right;
      transform: translateX(-5px);
    }
    .wp-odds .win { color: var(--text); }
    .wp-odds .pla { color: #7b8494; }
    .wp-odds .wp { color: #8a93a3; }
    .wp-odds .win.hot,
    .wp-odds .pla.hot,
    .wp-odds .wp.hot { color: var(--red); }
    .wp-odds .od-n {
      font: inherit;
      font-size: var(--wh-num-fs);
      line-height: var(--wh-num-lh);
      color: inherit;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-pin .pin-lab,
    .wp-odds .pin-lab {
      font-size: 11px;
      font-weight: 700;
      color: #355a4c;
      line-height: 1.2;
      text-align: center;
      width: 100%;
    }
    /* 時段列：等寬收緊、內容居中對齊 */
    .whour {
      flex: 0 0 var(--wh-col-w);
      width: var(--wh-col-w);
      box-sizing: border-box;
      padding: var(--wh-pad-y) 1px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: var(--wh-line-gap);
      background: #fff;
      border-right: 1px solid #eef1f4;
    }
    .water-row.head .whour {
      text-align: center;
      justify-content: center;
      align-items: center;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .wh-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 100%;
      height: var(--wh-line-h);
      min-height: var(--wh-line-h);
      line-height: var(--wh-num-lh);
      white-space: nowrap;
    }
    /* 水位＝箭頭＋數字同行；流量＝僅數字 */
    .wh-metric {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      gap: 0;
      min-width: 0;
      height: var(--wh-line-h);
    }
    .wh-metric:not(.no-arr) {
      flex: 0 0 auto;
      min-width: calc(var(--wh-arr-w) + 1.25em);
    }
    .wh-metric.no-arr {
      flex: 0 0 1.3em;
      width: 1.3em;
      justify-content: center;
    }
    .wh-line .wv,
    .wh-line .fv {
      display: block;
      font-size: var(--wh-num-fs);
      font-weight: 400;
      text-align: center;
      line-height: var(--wh-num-lh);
      height: var(--wh-line-h);
      font-variant-numeric: tabular-nums lining-nums;
    }
    .wh-line .wv {
      width: 1.25em;
      min-width: 1.25em;
      color: var(--text);
    }
    .wh-line .fv {
      width: 100%;
      color: #5b6575;
    }
    .wh-line.pla .wv,
    .wh-line.pla .fv { color: #7b8494; }
    /* 第三行 WP（獨贏+位置混合池）：再淡一級，與獨贏／位置分層 */
    .wh-line.wp .wv,
    .wh-line.wp .fv { color: #8a93a3; }
    .wh-line .muted { color: var(--muted); }
    /* 升＝綠↖，降＝紅↙；預設隱藏佔位，僅十字高亮行／列顯示，減少眼花 */
    .wh-arr {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 var(--wh-arr-w);
      width: var(--wh-arr-w);
      height: var(--wh-line-h);
      font-size: var(--wh-arr-fs);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      pointer-events: none;
      visibility: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Segoe UI Symbol", sans-serif;
    }
    .wh-arr.up { color: #1e8e3e; }
    .wh-arr.down { color: #c0392b; }
    .water-row.is-wh-cross-row .wh-arr:not(.none),
    .whour.is-wh-cross-col .wh-arr:not(.none) {
      visibility: visible;
    }
    /* 水位表十字定位：點選時段格 → 整行＋整列高亮，交叉為焦點 */
    .water-row:not(.head) .whour[data-wh-col] {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    /* 十字高亮：沿用水位頂欄綠系（#3d6b5c／#2f5649／#e8f0ec） */
    .water-row.is-wh-cross-row > .water-lock,
    .water-row.is-wh-cross-row .water-pin,
    .water-row.is-wh-cross-row .wp-odds,
    .water-row.is-wh-cross-row > .whour {
      background: #dce9e2;
    }
    .water-row.alt.is-wh-cross-row > .water-lock,
    .water-row.alt.is-wh-cross-row .water-pin,
    .water-row.alt.is-wh-cross-row .wp-odds,
    .water-row.alt.is-wh-cross-row > .whour {
      background: #d0e0d7;
    }
    .water-board .whour.is-wh-cross-col {
      background: #dce9e2;
    }
    .water-row.alt .whour.is-wh-cross-col {
      background: #d0e0d7;
    }
    .water-row.head .whour.is-wh-cross-col {
      background: #c2d6cb;
      box-shadow: inset 0 -2px 0 #2f5649;
      color: #234438;
    }
    .water-board .whour.is-wh-cross-cell {
      background: #a8c9b6;
      box-shadow: inset 0 0 0 1.5px #2f5649;
      z-index: 2;
    }
    .water-row.is-wh-cross-row > .water-lock {
      box-shadow: 2px 0 4px rgba(45, 62, 80, .06), inset 0 0 0 1px rgba(47, 86, 73, .4);
    }
    /* 點水位／流量數字打開詳情；表頭「水位」「流量」仍負責排序 */
    .hrow:not(.head) .cell.scroll-col[data-open="water"] {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hrow:not(.head) .cell.scroll-col[data-open="water"]:active {
      background: rgba(47, 86, 73, .08);
    }
    .horse-sheet-bar {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 44px 12px 12px;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff;
    }
    .horse-sheet-silk {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      background-color: transparent;
      background-size: contain;
      background-position: left top;
      background-repeat: no-repeat;
    }
    .horse-sheet-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      font-size: 14px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .horse-sheet-title {
      min-width: 0;
      flex: 1 1 auto;
    }
    .horse-sheet-title .nm {
      display: block;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: .02em;
      line-height: 1.15;
    }
    .horse-sheet-title .sub {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      opacity: .88;
      line-height: 1.25;
    }
    .horse-sheet-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 6px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .horse-sheet-close:active { background: rgba(255,255,255,.28); }
    .horse-sheet-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 10px 10px 16px;
      background: #f4f6f8;
    }
    .horse-sheet-odds {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .horse-sheet-odds .box {
      background: #fff;
      border: 1px solid var(--line);
      padding: 10px 8px;
      text-align: center;
    }
    .horse-sheet-odds .k {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .horse-sheet-odds .v {
      display: block;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }
    .horse-sheet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }
    .horse-sheet-grid .item {
      background: #fff;
      padding: 9px 10px;
      min-width: 0;
    }
    .horse-sheet-grid .item.wide { grid-column: 1 / -1; }
    .horse-sheet-grid .k {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
      line-height: 1.2;
    }
    .horse-sheet-grid .v {
      display: block;
      font-size: 14px;
      color: var(--text);
      font-weight: 400;
      line-height: 1.3;
      word-break: break-word;
    }
    .horse-sheet-grid .v.muted { color: var(--muted); }

    .hrow {
      display: flex;
      align-items: stretch;
      height: 47px;
      min-width: max-content;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    /* 資料列加高 2px，多出的距離放在彩衣與馬名之間 */
    .hrow:not(.head) {
      height: 49px;
    }
    .hrow.alt { background: #f4f6f8; }
    .hrow.scratched .hname { text-decoration: line-through; }
    .hrow.scratched .cell { opacity: .45; }
    /* 小旗標記整行：一按黃、再按綠、三按復原 */
    .hrow.mark-1 { background: #fde8cc; }
    .hrow.mark-1 .lock-cluster { background: #fde8cc; }
    .hrow.mark-2 { background: #d4efdf; }
    .hrow.mark-2 .lock-cluster { background: #d4efdf; }
    .hrow.alt.mark-1 { background: #f7dcb8; }
    .hrow.alt.mark-1 .lock-cluster { background: #f7dcb8; }
    .hrow.alt.mark-2 { background: #c5e8d3; }
    .hrow.alt.mark-2 .lock-cluster { background: #c5e8d3; }

    .lock-cluster {
      position: sticky;
      left: 0;
      top: auto;
      z-index: 4;
      display: grid;
      grid-template-columns: var(--pin-id) var(--pin-odds);
      flex: 0 0 var(--pin-w);
      width: var(--pin-w);
      min-width: var(--pin-w);
      align-self: stretch;
      background: #fff;
      box-shadow: 6px 0 8px rgba(45, 62, 80, .10);
      isolation: isolate;
    }
    .hrow.alt .lock-cluster { background: #f4f6f8; }
    .hrow.head {
      position: relative;
      z-index: 6;
      height: 47px;
      background: #eef3f8;
      color: #111;
      font-size: var(--head-fs); font-weight: 400;
      text-align: center;
    }
    .hrow.head .lock-cluster {
      z-index: 8;
      background: #eef3f8;
    }

    .cell {
      display: flex; align-items: center; justify-content: center;
      padding: 0 2px;
      font-size: var(--head-fs);
      font-weight: 400;
      overflow: hidden;
    }
    .lock-cluster .cell.pin-id {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1px;
      padding: 1px 2px;
    }
    /* 資料列：彩衣｜馬號｜騎／練姓氏首字（上騎下練）；馬名跨底 */
    .hrow:not(.head) .cell.pin-id {
      display: grid;
      grid-template-columns: 33px 22px 15px;
      grid-template-rows: 31px minmax(0, 1fr);
      column-gap: 2px;
      align-items: stretch;
      justify-items: stretch;
      padding: 0 2px 0 0;
      overflow: visible;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hrow:not(.head) .cell.pin-id:active {
      background: rgba(91, 163, 217, .16);
    }
    .hno {
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      justify-self: center;
      z-index: 2;
      display: grid;
      place-items: center;
      place-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--nav);
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      margin-top: -1px;
    }
    /* 列表第一列：馬號加大 2px、下移 2px；橫向仍左移 3px（騎／練首字不動） */
    .hrow:not(.head) .cell.pin-id .hno {
      width: 24px;
      height: 24px;
      font-size: 17px;
      transform: translate(-3px, 2px);
    }
    .hno > span,
    .draw-no > span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 1em;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums lining-nums;
      transform: translateY(-0.08em);
    }
    /* 馬號右側：上＝騎師姓氏首字，下＝練馬師姓氏首字 */
    .hrow:not(.head) .cell.pin-id .jt-ini {
      grid-column: 3;
      grid-row: 1;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      align-self: center;
      justify-self: center;
      line-height: 1;
      min-width: 0;
      pointer-events: none;
    }
    .jt-ini .j-ini,
    .jt-ini .t-ini {
      display: block;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.05;
      text-align: center;
    }
    .jt-ini .j-ini,
    .jt-ini .t-ini { color: var(--text); }
    .jt-ini .j-ini { transform: translateY(-1px); }
    .jt-ini .t-ini { transform: translateY(2px); }
    /* 馬名橫跨首列；右側留空給兩字跑法角標 */
    .hrow:not(.head) .cell.pin-id .hname {
      grid-column: 1 / -1;
      grid-row: 2;
      z-index: 2;
      align-self: center;
      justify-self: stretch;
      max-width: none;
      width: 100%;
      padding: 0 26px 0 1px;
      margin-top: -1px;
      text-align: left;
    }
    /* 預計跑法兩字全稱角標：前領／跟前／中置／後上 —— 貼首列右下 */
    .hrow:not(.head) .cell.pin-id .rs-chip {
      position: absolute;
      right: 1px;
      bottom: 3px;
      z-index: 3;
      box-sizing: border-box;
      min-width: 24px;
      height: 14px;
      padding: 0 3px;
      margin: 0;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      line-height: 14px;
      text-align: center;
      color: #fff;
      letter-spacing: -.04em;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
    .rs-chip.lead { background: #3d5a80; }   /* 前領 */
    .rs-chip.press { background: #2f8f78; }  /* 跟前 */
    .rs-chip.mid { background: #6a7382; }    /* 中置 */
    .rs-chip.late { background: #c47a3a; }   /* 後上 */
    .hrow.scratched .rs-chip { opacity: .55; }
    .hrow.head .lock-cluster .cell { padding: 0 2px; }
    .hrow.head .cell.head-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: center;
      align-content: center;
      justify-items: center;
      column-gap: 1px;
      row-gap: 0;
    }
    .hrow.head .cell.head-split .odds-sort { grid-column: 1; grid-row: 1; }
    .hrow.head .cell.head-split .head-static { grid-column: 1; grid-row: 2; }
    .hrow.head .cell.head-split .sort-hit {
      grid-column: 2; grid-row: 1 / span 2;
      align-self: center;
    }
    /* 獨贏／位置左、檔位豎排右，同一格 */
    .hrow.head .cell.pin-odds {
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 1px;
      padding: 0 2px;
    }
    .odds-labs {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 0;
      line-height: 1.02;
      text-align: right;
    }
    .draw-sort {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: var(--head-fs);
      font-weight: 400;
      padding: 0;
      line-height: 1.02;
      cursor: pointer;
    }
    .draw-lab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.02;
      font-size: inherit;
      font-weight: 400;
    }
    .sortable { cursor: pointer; user-select: none; }
    .head-static {
      display: block;
      font-size: var(--head-fs); font-weight: 400; line-height: 1.02;
      /* 隨表頭主題色（淺／深），與可排序欄文字一致 */
      color: inherit; cursor: default; user-select: none;
    }
    .odds-sort {
      display: inline-flex; flex-direction: row;
      align-items: center; justify-content: center; gap: 1px;
      width: auto; max-width: 100%; border: 0; background: transparent;
      color: inherit; font: inherit; font-size: var(--head-fs); font-weight: 400;
      padding: 0; line-height: 1.02; cursor: pointer; text-align: center;
      white-space: nowrap; border-radius: 3px;
    }
    .hrow.head .lock-cluster .odds-sort { font-size: var(--head-fs); line-height: 1.02; }
    .hrow.head .scroll-col .odds-sort {
      flex-direction: row; align-items: center; justify-content: center;
      gap: 1px; width: auto; font-size: var(--head-fs); white-space: nowrap;
      line-height: 1.02;
    }
    .odds-sort .lab { display: block; line-height: 1.02; font-size: inherit; }
    .sort-hit {
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; background: transparent; padding: 0; margin: 0;
      cursor: pointer; color: inherit; line-height: 1;
    }
    .sort-ico {
      display: inline-flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1px; flex: 0 0 auto;
      line-height: 1;
    }
    .sort-ico .u, .sort-ico .d {
      display: block; font-size: 10px; font-weight: 900;
      color: #c5cad3; line-height: 1;
    }
    .sortable.on { color: #2c5f8a; }
    .sort-ico .u.on, .sort-ico .d.on { color: var(--orange); }
    .hrow.head .cell.sort-on {
      background: #e4eef8;
      box-shadow: inset 0 -2px 0 #3b8fd4;
    }
    .cell.sort-col { background: rgba(91, 163, 217, .12); }
    .hrow.alt .cell.sort-col { background: rgba(91, 163, 217, .18); }

    .silk {
      display: block;
      width: 17px; height: 17px;
      border-radius: 0;
      background-color: transparent;
    }
    .hrow:not(.head) .cell.pin-id .silk {
      grid-column: 1;
      grid-row: 1;
      width: auto;
      min-width: 0;
      min-height: 0;
      align-self: stretch;
      justify-self: stretch;
      /* 相對原位：上移 2px、左移 3px（騎／練首字不動） */
      margin: 2px 0 0 1px;
      height: calc(100% + 1px);
      overflow: hidden;
      z-index: 1;
    }
    .silk.has-img {
      background-color: transparent;
      background-size: contain;
      background-position: left top;
      background-repeat: no-repeat;
    }
    .hname {
      display: block;
      font-size: 13px; font-weight: 400; line-height: 1.02;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text); max-width: 52px;
      text-align: left;
      letter-spacing: -.02em;
    }

    .hrow:not(.head) .cell.pin-odds {
      flex-direction: row;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      padding: 2px 3px 2px 8px;
      overflow: hidden;
    }
    /* 右欄：上旗下檔位；檔位底邊與位置賠率齊平 */
    .draw-flag-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      flex: 0 0 auto;
      gap: 2px;
      min-width: 22px;
      padding: 0;
      transform: translateX(3px);
    }
    .row-flag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: #b0b8c4;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      line-height: 0;
      transform: translateY(6px);
    }
    .row-flag svg {
      width: 25px;
      height: 28px;
      display: block;
    }
    .row-flag:active {
      background: rgba(45, 62, 80, .08);
    }
    .row-flag[data-mark="1"] {
      color: var(--orange);
    }
    .row-flag[data-mark="2"] {
      color: var(--green);
    }
    .draw-no {
      display: grid;
      place-items: center;
      place-content: center;
      flex: 0 0 auto;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 1px solid #cfd6de;
      background: #fff;
      font-size: 13px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: 0;
      color: var(--text);
      text-align: center;
    }

    .odds {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 2px;
      line-height: 1.02;
      padding: 0;
      transform: translateX(2px);
      font-variant-numeric: tabular-nums lining-nums;
    }
    /* 內層賠率棧：與外層 cell.odds 分開，避免整格被當 .odds 撐變形 */
    .cell.pin-odds > .odds {
      flex: 0 0 auto;
      max-width: calc(100% - 36px);
      overflow: visible;
    }
    .odds .win,
    .odds .pla {
      position: relative;
      display: block;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.02;
      white-space: nowrap;
      text-align: right;
    }
    .odds .win { color: var(--text); transform: translateY(-7px); }
    .odds .pla { color: #7b8494; transform: translateY(-4px); }
    .odds .win.hot, .odds .pla.hot { color: var(--red); }
    .odds .od-n {
      font: inherit;
      color: inherit;
      font-variant-numeric: tabular-nums lining-nums;
      line-height: 1;
    }
    /* 字符箭頭絕對貼數字右側，不佔版面寬度（外層賠率／水位流量／彈窗賠率共用） */
    .odds .od-tick,
    .scroll-col .wp .od-tick,
    .wp-odds .od-tick {
      position: absolute;
      left: 100%;
      top: 50%;
      margin-top: -0.45em;
      margin-left: 1px;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
      font-family: "Noto Sans TC", "PingFang TC", "Segoe UI Symbol", sans-serif;
    }
    /* 彈窗賠率行高含水位箭頭位，升降箭改對齊數字中線 */
    .wp-odds .od-tick {
      top: calc(var(--wh-num-fs) * var(--wh-num-lh) / 2);
      margin-top: 0;
      transform: translateY(-50%);
    }
    .odds .od-tick.up,
    .scroll-col .wp .od-tick.up,
    .wp-odds .od-tick.up { color: #1e8e3e; }
    .odds .od-tick.down,
    .scroll-col .wp .od-tick.down,
    .wp-odds .od-tick.down { color: #c0392b; }
    /* 賠率刷新後：箭頭呼吸 3 次提示升降更新 */
    .odds .od-tick.fresh,
    .scroll-col .wp .od-tick.fresh,
    .wp-odds .od-tick.fresh {
      animation: odTickBreath .65s ease-in-out 3;
      transform-origin: center center;
    }
    .wp-odds .od-tick.fresh {
      animation-name: odTickBreathWp;
    }
    @keyframes odTickBreath {
      0%, 100% { opacity: 1; transform: scale(1); }
      40% { opacity: .22; transform: scale(1.45); }
      75% { opacity: 1; transform: scale(1); }
    }
    @keyframes odTickBreathWp {
      0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
      40% { opacity: .22; transform: translateY(-50%) scale(1.45); }
      75% { opacity: 1; transform: translateY(-50%) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .odds .od-tick.fresh,
      .scroll-col .wp .od-tick.fresh,
      .wp-odds .od-tick.fresh { animation: none; opacity: 1; }
    }
    .odds .na { color: var(--muted); font-size: 14px; }

    .muted { color: var(--muted); font-weight: 400; }
    .form { letter-spacing: .02em; font-weight: 400; font-variant-numeric: tabular-nums; }
    .comment { font-size: var(--head-fs); font-weight: 400; color: #4a5563; }
    /* 右滑列：列寬隨最長內容；數據到分隔線 = --scroll-col-gap */
    .scroll-col {
      position: relative;
      flex: 0 0 auto;
      width: max-content;
      min-width: 0;
      justify-content: center;
      padding: 0 calc(var(--scroll-col-gap) + var(--scroll-col-rule)) 0 var(--scroll-col-gap);
      overflow: hidden;
    }
    .scroll-col::after {
      content: "";
      position: absolute;
      top: var(--scroll-col-gap); bottom: var(--scroll-col-gap); right: 0;
      width: var(--scroll-col-rule);
      background: #e4e7ec;
      pointer-events: none;
    }
    .scroll-col.num {
      font-variant-numeric: tabular-nums;
      font-weight: 400;
    }
    /* 入圍數｜% 等：數據靠右 */
    .scroll-col.end {
      justify-content: flex-end;
      text-align: right;
    }
    .scroll-col.end .v {
      display: block;
      width: 100%;
      text-align: right;
    }
    .scroll-col .v {
      display: block;
      min-width: 0;
      max-width: none;
      overflow: visible;
      text-align: center;
      font-size: var(--head-fs);
      line-height: 1.05;
      white-space: nowrap;
    }
    .scroll-col .v.stacked {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      white-space: nowrap;
    }
    .scroll-col .v.stacked .nm,
    .scroll-col .v.stacked .sub {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      font: inherit;
      color: inherit;
      line-height: inherit;
    }
    .scroll-col .v.stacked .sub.delta {
      font-size: 12px;
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: .01em;
    }
    .scroll-col .v.stacked .sub.delta-pos { color: #c0392b; }
    .scroll-col .v.stacked .sub.delta-neg { color: #1e8e3e; }
    /* 預計跑法：文字 + 四枚向左三角（實心位＝跑法） */
    .scroll-col .v.run-style {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
      line-height: 1.05;
    }
    .scroll-col .v.run-style .nm {
      display: block;
      font: inherit;
      color: inherit;
      line-height: inherit;
    }
    .scroll-col .rs-marks {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 9px;
      line-height: 0;
    }
    .scroll-col .rs-tri {
      display: block;
      width: 7px;
      height: 8px;
      flex: 0 0 auto;
      overflow: visible;
    }
    .scroll-col .rs-tri polygon {
      stroke: #2a5f8f;
      stroke-width: 1.1;
      stroke-linejoin: round;
    }
    .scroll-col .rs-tri.on polygon {
      fill: #2a5f8f;
    }
    .scroll-col .rs-tri:not(.on) polygon {
      fill: #fff;
    }
    /* 近六賽績＋班次升降：每個近績數字正下方緊跟對應升／平／降圖例 */
    .scroll-col .v.form-class {
      display: inline-flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 0;
      white-space: nowrap;
      line-height: 1.05;
    }
    .scroll-col .fc-seg {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      min-width: 1.05em;
    }
    .scroll-col .fc-seg .fc-num {
      display: block;
      font: inherit;
      color: inherit;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .scroll-col .fc-sep {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 1px;
      font: inherit;
      color: inherit;
      line-height: 1.05;
      user-select: none;
    }
    .scroll-col .fc-m {
      display: block;
      width: 7px;
      height: 8px;
      flex: 0 0 auto;
      overflow: visible;
    }
    .scroll-col .fc-m.up polygon {
      fill: #1e8e3e;
      stroke: #1e8e3e;
      stroke-width: 0.6;
      stroke-linejoin: round;
    }
    .scroll-col .fc-m.down polygon {
      fill: #c0392b;
      stroke: #c0392b;
      stroke-width: 0.6;
      stroke-linejoin: round;
    }
    .scroll-col .fc-m.flat rect {
      fill: #8a93a0;
    }
    /* 水位／流量：獨贏上、位置下；右對齊＋▲▼（與賠率欄同款，零占位） */
    .scroll-col .wp {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 2px;
      line-height: 1.02;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      white-space: nowrap;
      overflow: visible;
    }
    .scroll-col .wp .w,
    .scroll-col .wp .p {
      position: relative;
      display: block;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.02;
      text-align: right;
    }
    .scroll-col .wp .w {
      color: var(--text);
      transform: translateY(-8px);
    }
    .scroll-col .wp .p {
      color: #7b8494;
      transform: translateY(-5px);
    }
    .scroll-col .wp .od-n {
      font: inherit;
      color: inherit;
      line-height: 1;
    }
    .scroll-col:has(.wp) {
      overflow: visible;
      align-items: flex-end;
    }

    .silk-1 { background:#e10600; } .silk-2 { background:#111; }
    .silk-3 { background:#0057b8; } .silk-4 { background:#ffd100; color:#222; }
    .silk-5 { background:#00a651; } .silk-6 { background:#e4007c; }
    .silk-7 { background:#00b5e2; color:#083044; } .silk-8 { background:#8a8d8f; }
    .silk-9 { background:#ff6a00; } .silk-10 { background:#6f2c91; }
    .silk-11 { background:#a8d08d; color:#1a3318; } .silk-12 { background:#7a1f2b; }
    .silk-13 { background:#fff; color:#111; box-shadow: inset 0 0 0 1px #999; }
    .silk-14 { background:#c5a028; color:#1a1408; }

    /* 連贏區：表內橫豎滾動；首行／首列 CSS sticky（20 匹可鎖定標號） */
    .qin-panel {
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      width: 100%;
      background: #eef1f5;
      border-top: 8px solid #eef1f5;
      padding: 0 0 10px;
      --qin-cell: 24px;
      --qin-title-w: 24px;
    }
    .qin-block {
      background: #fff;
      position: relative;
      /* 裁切邊緣回彈時 sticky 標號「漂浮」溢出 */
      overflow: hidden;
    }
    .qin-x {
      overflow: auto;
      /* 禁邊緣回彈漂浮；表內仍用 touch 慣性跟手 */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    .qin-tbl {
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
      font-variant-numeric: tabular-nums lining-nums;
      line-height: 1;
    }
    /* 明確列寬，避免角標 colspan=2 把首兩列均分導致右側留白 */
    .qin-tbl col.qin-col-rh {
      width: var(--qin-title-w);
    }
    .qin-tbl col.qin-col-c {
      width: var(--qin-cell);
    }
    .qin-tbl th,
    .qin-tbl td {
      border: 1px solid #cfd6e0;
      text-align: center;
      vertical-align: middle;
      padding: 0;
      height: var(--qin-cell);
      min-width: var(--qin-cell);
      width: var(--qin-cell);
      font-weight: 400;
      color: var(--text);
      background: #fff;
      box-sizing: border-box;
    }
    /* 角標：位置Q／正Q 左右波動開關（橫跨首列＋原「1」位） */
    .qin-tbl .qin-switch-cell {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 4;
      padding: 0;
      vertical-align: middle;
      background: #cfd5de;
      min-width: calc(var(--qin-title-w) + var(--qin-cell));
      width: calc(var(--qin-title-w) + var(--qin-cell));
      box-shadow: 0 2px 4px rgba(45, 62, 80, .10), 3px 0 6px rgba(45, 62, 80, .12);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .qin-mode-switch {
      display: block;
      width: 100%;
      height: 100%;
      min-height: var(--qin-cell);
      margin: 0;
      padding: 2px;
      border: 0;
      background: transparent;
      cursor: pointer;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .qin-sw-track {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: calc(var(--qin-cell) - 4px);
      border-radius: 3px;
      background: #b8c0cb;
      overflow: hidden;
    }
    .qin-sw-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: var(--orange);
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(45, 62, 80, .18);
      transform: translateX(0);
      transition: transform .22s cubic-bezier(.4, .0, .2, 1);
      pointer-events: none;
      z-index: 0;
    }
    .qin-tbl[data-qin-mode="qin"] .qin-sw-thumb,
    .qin-mode-switch[data-qin-side="qin"] .qin-sw-thumb {
      transform: translateX(100%);
    }
    .qin-sw-lab {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1px;
      font: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .01em;
      line-height: 1.05;
      color: #5b6575;
      white-space: nowrap;
      transition: color .18s ease;
      user-select: none;
    }
    .qin-tbl[data-qin-mode="qpl"] .qin-sw-lab[data-qin-mode="qpl"],
    .qin-tbl[data-qin-mode="qin"] .qin-sw-lab[data-qin-mode="qin"],
    .qin-mode-switch[data-qin-side="qpl"] .qin-sw-lab[data-qin-mode="qpl"],
    .qin-mode-switch[data-qin-side="qin"] .qin-sw-lab[data-qin-mode="qin"] {
      color: #fff;
      font-weight: 800;
    }
    .qin-mode-switch:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -3px;
    }
    .qin-mode-switch:active .qin-sw-thumb {
      filter: brightness(.96);
    }
    /* 首列「1」位：豎排「指數」灰底＋右側 1/3 藍底馬號，非按鈕 */
    .qin-tbl .qin-rh.qin-idx-lab {
      padding: 0;
      background: #cfd5de;
      color: #5b6575;
      cursor: default;
      user-select: none;
      overflow: hidden;
    }
    .qin-idx-inner {
      display: flex;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: var(--qin-cell);
    }
    .qin-idx-txt {
      flex: 2 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 1px 0;
      background: #cfd5de;
      color: #5b6575;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.05;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }
    .qin-idx-no {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-width: 0;
      background: #5b8fc7;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }
    .qin-tbl .qin-rh.qin-idx-lab.scratch .qin-idx-no {
      background: #9aa3af;
      color: #e8eaed;
    }
    .qin-tbl .qin-h {
      background: #5b8fc7;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
    }
    /* 首行馬號：豎滑鎖定 */
    .qin-tbl .qin-ch {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #5b8fc7;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      box-shadow: 0 2px 4px rgba(45, 62, 80, .10);
    }
    /* 首列馬號：橫滑鎖定 */
    .qin-tbl .qin-rh {
      position: sticky;
      left: 0;
      z-index: 3;
      background: #5b8fc7;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      min-width: var(--qin-title-w);
      width: var(--qin-title-w);
      box-shadow: 3px 0 6px rgba(45, 62, 80, .12);
    }
    .qin-tbl .qin-empty {
      border-color: transparent;
      background: transparent;
    }
    .qin-tbl .qin-c.hot,
    .qin-tbl .qin-c.idx-r { background: #e74c3c; color: #fff; }
    .qin-tbl .qin-c.drop20,
    .qin-tbl .qin-c.idx-g { background: #2ecc71; color: #fff; }
    .qin-tbl .qin-c.drop50,
    .qin-tbl .qin-c.idx-b { background: #c4a035; color: #fff; }
    /* 下三角指數格：未上色時用淡底；上色規則須壓過淡底（同特異度時後寫生效） */
    .qin-tbl .qin-c.idx-cell {
      background: #eef4fa;
      color: #3d5a80;
    }
    .qin-tbl .qin-c.idx-cell.idx-r {
      background: #e74c3c;
      color: #fff;
    }
    .qin-tbl .qin-c.idx-cell.idx-g {
      background: #2ecc71;
      color: #fff;
    }
    .qin-tbl .qin-c.idx-cell.idx-b {
      background: #c4a035;
      color: #fff;
    }
    .qin-tbl .qin-c[data-qin-key] {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    /* 退出駒：保留馬號座標，賠率／指數灰顯「—」（對齊列表退出態） */
    .qin-tbl .qin-ch.scratch,
    .qin-tbl .qin-rh.scratch,
    .qin-tbl .qin-h.scratch {
      opacity: .45;
      text-decoration: line-through;
    }
    .qin-tbl .qin-c.scratch,
    .qin-tbl .qin-c.idx-cell.scratch {
      background: #f0f2f5;
      color: #9aa3b0;
      cursor: default;
      font-weight: 400;
    }
    .qin-tbl .qin-c.scratch[data-qin-key] {
      cursor: default;
    }
    /* 輕點座標：框外 outline 呼吸，不佔格內空間（密格如 20 匹仍可讀數字） */
    .qin-tbl .qin-c.is-qin-focus {
      position: relative;
      z-index: 5;
      box-shadow: none;
      outline: 2px solid #ff9a1a;
      outline-offset: 0;
      animation: qinFocusPulse 1.05s ease-in-out infinite;
    }
    @keyframes qinFocusPulse {
      0%, 100% {
        outline-color: #d97808;
        outline-offset: 0;

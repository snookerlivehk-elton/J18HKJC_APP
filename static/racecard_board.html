<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

  <title>排位 · J18</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav: #3d5a80;
      --nav-2: #334b6b;
      --page: #eef1f5;
      --text: #2c3340;
      --muted: #8a93a3;
      --blue: #5ba3d9;
      --blue-2: #3b8fd4;
      --green: #5cb85c;
      --orange: #e88b2a;
      --red: #e74c3c;
      --place: #27ae60;
      --line: #e4e7ec;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      /* 左鎖三欄：馬號上馬名下、檔位横排、獨贏上位置下 */
      --pin-id: 52px;
      --pin-draw: 38px;
      --pin-odds: 44px;
      --pin-w: calc(var(--pin-id) + var(--pin-draw) + var(--pin-odds));
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #d8dee6; color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex; flex-direction: column;
      max-width: 430px; margin: 0 auto;
      background: var(--page);
      min-height: 100%;
      box-shadow: 0 0 0 1px rgba(45,62,80,.12);
    }
    button { font-family: inherit; }

    .topbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 44px; padding: 0 10px;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff; z-index: 30;
    }
    .topbar .side { width: 64px; font-size: 15px; font-weight: 700; }
    .topbar .side.r { text-align: right; opacity: .9; }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .06em; }

    .subhead {
      flex: 0 0 auto;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 8px 10px 10px;
    }
    .date-row {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 15px; font-weight: 800; color: var(--blue-2); margin-bottom: 8px;
    }
    .date-row .u { color: #9aa3b0; font-size: 12px; font-weight: 700; }

    .race-pills { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .race-pills button {
      width: 32px; height: 26px; border: 0; border-radius: 6px; cursor: pointer;
      font-weight: 800; font-size: 13px; color: #fff; background: var(--green);
    }
    .race-pills button.active { background: var(--blue); }

    .meta {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-top: 8px; font-size: 12px; line-height: 1.45; color: #5b6575;
    }
    .hint {
      margin-top: 6px; font-size: 11px; color: var(--muted); font-weight: 600;
    }

    .board-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      overflow-y: auto;
      background: #fff;
    }
    .lock {
      flex: 0 0 var(--pin-w);
      width: var(--pin-w);
      min-width: var(--pin-w);
      z-index: 2;
      background: #fff;
      box-shadow: 6px 0 8px rgba(45, 62, 80, .10);
    }
    .scroll {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .scroll-inner { min-width: max-content; }

    .hrow {
      display: flex;
      align-items: stretch;
      height: 44px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .hrow.alt { background: #f4f6f8; }
    .hrow.scratched { opacity: .45; }
    .hrow.scratched .hname { text-decoration: line-through; }
    .lock .hrow {
      display: grid;
      grid-template-columns: var(--pin-id) var(--pin-draw) var(--pin-odds);
    }
    .hrow.head {
      position: sticky; top: 0; z-index: 5;
      height: 44px;
      background: #eef3f8;
      color: #6b7380;
      font-size: 11px; font-weight: 800;
      text-align: center;
    }
    .scroll .hrow.head { background: #f7f8fa; }

    .cell {
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
      font-size: 12px;
      overflow: hidden;
    }
    .lock .cell.pin-id {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0;
      padding: 1px 2px;
    }
    .lock .hrow.head .cell { padding: 0 2px; }
    .lock .hrow.head .cell.pin-odds {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0;
    }
    .lock .hrow.head .cell.head-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: center;
      align-content: center;
      justify-items: center;
      column-gap: 1px;
      row-gap: 0;
    }
    .lock .hrow.head .cell.head-split .odds-sort { grid-column: 1; grid-row: 1; }
    .lock .hrow.head .cell.head-split .head-static { grid-column: 1; grid-row: 2; }
    .lock .hrow.head .cell.head-split .sort-hit {
      grid-column: 2; grid-row: 1 / span 2;
      align-self: center;
    }
    .lock .cell.odds { justify-content: center; padding: 0 3px; }
    .sortable { cursor: pointer; user-select: none; }
    .head-static {
      display: block;
      font-size: 11px; font-weight: 800; line-height: 1.05;
      color: #6b7380; cursor: default; user-select: none;
    }
    .odds-sort {
      display: inline-flex; flex-direction: row;
      align-items: center; justify-content: center; gap: 2px;
      width: auto; max-width: 100%; border: 0; background: transparent;
      color: inherit; font: inherit; font-size: 10px; font-weight: 800;
      padding: 0; line-height: 1.15; cursor: pointer; text-align: center;
      white-space: nowrap; border-radius: 3px;
    }
    .lock .hrow.head .odds-sort { font-size: 11px; line-height: 1.05; }
    .scroll .hrow.head .odds-sort {
      flex-direction: row; align-items: center; justify-content: center;
      gap: 2px; width: 100%; font-size: 11px; white-space: normal;
    }
    .odds-sort .lab { display: block; line-height: 1.05; }
    .sort-hit {
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; background: transparent; padding: 0; margin: 0;
      cursor: pointer; color: inherit; line-height: 1;
    }
    .sort-ico {
      display: inline-flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1px; flex: 0 0 auto;
      line-height: 1;
    }
    .sort-ico .u, .sort-ico .d {
      display: block; font-size: 8px; font-weight: 900;
      color: #c5cad3; line-height: 1;
    }
    .sortable.on { color: #2c5f8a; }
    .sort-ico .u.on, .sort-ico .d.on { color: var(--orange); }
    .hrow.head .cell.sort-on {
      background: #e4eef8;
      box-shadow: inset 0 -2px 0 #3b8fd4;
      color: #2c5f8a;
    }
    .cell.sort-col { background: rgba(91, 163, 217, .12); }
    .hrow.alt .cell.sort-col { background: rgba(91, 163, 217, .18); }

    .silk {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      font-size: 10px; font-weight: 800; color: #fff;
      flex: 0 0 18px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
    }
    .hname {
      display: block;
      font-size: 11px; font-weight: 800; line-height: 1.1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text); max-width: 50px;
      text-align: center;
      letter-spacing: -.02em;
    }

    .draw-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      border: 1px solid #cfd6de; font-size: 10px; font-weight: 800;
      background: #fff; color: #334;
    }

    .odds { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
    .odds .win { font-size: 13px; font-weight: 800; color: var(--text); }
    .odds .pla { font-size: 11px; font-weight: 700; color: #7b8494; }
    .odds .win.hot, .odds .pla.hot { color: var(--red); }
    .odds .na { color: var(--muted); font-size: 11px; }

    .muted { color: var(--muted); font-weight: 600; }
    .form { letter-spacing: .02em; font-weight: 700; font-variant-numeric: tabular-nums; }
    .comment { font-size: 11px; font-weight: 600; color: #4a5563; }
    /* 右滑列：內容一律居中；分隔線用內縮豎線，避免壓到數字 */
    .scroll-col {
      position: relative;
      min-width: 54px; flex: 0 0 54px;
      justify-content: center;
      padding: 0 5px;
      overflow: hidden;
    }
    .scroll-col::after {
      content: "";
      position: absolute;
      top: 6px; bottom: 6px; right: 0;
      width: 1px;
      background: #e4e7ec;
      pointer-events: none;
    }
    .scroll-col.sm { min-width: 48px; flex: 0 0 48px; padding: 0 4px; }
    .scroll-col.md { min-width: 56px; flex: 0 0 56px; }
    .scroll-col.form { min-width: 88px; flex: 0 0 88px; }
    .scroll-col.wide { min-width: 72px; flex: 0 0 72px; }
    .scroll-col.xl { min-width: 112px; flex: 0 0 112px; }
    .scroll-col.num {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .scroll-col .v {
      display: block;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }
    .scroll .hrow.head .odds-sort { font-size: 9px; text-align: center; }

    .tabbar {
      flex: 0 0 52px;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: var(--nav); color: rgba(255,255,255,.7);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar .tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 10px; font-weight: 700; text-decoration: none; color: inherit;
    }
    .tabbar .tab.on { color: #fff; }
    .tabbar .ico { font-size: 16px; line-height: 1; }

    .silk-3 { background:#0057b8; } .silk-4 { background:#ffd100; color:#222; }
    .silk-5 { background:#00a651; } .silk-6 { background:#e4007c; }

    .silk-11 { background:#a8d08d; color:#1a3318; } .silk-12 { background:#7a1f2b; }
    .silk-13 { background:#fff; color:#111; box-shadow: inset 0 0 0 1px #999; }
    .silk-14 { background:#c5a028; color:#1a1408; }
  </style>
</head>

      pills: document.getElementById("racePills"),
      lock: document.getElementById("lockPane"),
      scroll: document.getElementById("scrollPane"),
    };
    let currentRace = 1;
    let sortKey = "no";
    let sortDir = 1;

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function silkClass(n) { return "silk silk-" + (((Number(n) - 1 + SILK_N) % SILK_N) + 1); }
    function fmt(v) {
      if (v == null || v === "") return "—";
      return v;
    }
    function numOrNull(v) {
      if (v == null || v === "" || v === "—") return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function bestOdds() {
      let minW = Infinity, minP = Infinity;
      RUNNERS.forEach((r) => {
        if (r.scratched) return;
        if (numOrNull(r.win) != null) minW = Math.min(minW, r.win);
        if (numOrNull(r.place) != null) minP = Math.min(minP, r.place);
      });
      return { minW, minP };
    }

    function sortIco(key) {
      const on = sortKey === key;
      const up = on && sortDir > 0 ? " on" : "";
      const dn = on && sortDir < 0 ? " on" : "";
      return '<span class="sort-ico" aria-hidden="true"><span class="u' + up + '">▲</span><span class="d' + dn + '">▼</span></span>';
    }
    function headOn(key) { return sortKey === key ? " sort-on" : ""; }
    function colOn(key) {
      if (key === "odds") return sortKey === "win" ? " sort-col" : "";
      return sortKey === key ? " sort-col" : "";
    }

    function sortedRows() {
      const arr = RUNNERS.slice();
      arr.sort((a, b) => {
        const av = a[sortKey], bv = b[sortKey];
        const an = numOrNull(av), bn = numOrNull(bv);
        let cmp;
        if (an != null && bn != null) cmp = an - bn;
        else cmp = String(av == null ? "" : av).localeCompare(String(bv == null ? "" : bv), "zh-Hant");
        if (cmp === 0) cmp = a.no - b.no;
        return cmp * sortDir;
      });
      return arr;
    }

    function renderPills() {
      el.pills.innerHTML = [1,2,3,4,5,6,7,8].map((n) => {
        const on = n === currentRace ? " active" : "";
        return '<button type="button" class="' + on.trim() + '" data-n="' + n + '">' + n + "</button>";
      }).join("");
      el.pills.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentRace = Number(btn.getAttribute("data-n"));
          renderPills();
        });
      });
    }

    function headBtn(key, label, withIco) {
      const on = sortKey === key;
      const htmlLabel = esc(label).replace(/\n/g, "<br>");
      const aria = on ? (sortDir > 0 ? "ascending" : "descending") : "none";
      return '<button type="button" class="odds-sort sortable' + (on ? " on" : "") +
        '" data-sort="' + key + '" aria-sort="' + aria + '">' +
        '<span class="lab">' + htmlLabel + "</span>" +
        (withIco === false ? "" : sortIco(key)) + "</button>";
    }
    function sortHit(key) {
      const on = sortKey === key ? " on" : "";
      return '<button type="button" class="sort-hit sortable' + on + '" data-sort="' + key +
        '" tabindex="-1" aria-hidden="true">' + sortIco(key) + "</button>";
    }
    function headStatic(label) {
      return '<span class="head-static">' + esc(label) + "</span>";
    }

    function renderBoard() {
      const hot = bestOdds();
      const rows = sortedRows();
      const lockHead =
        '<div class="hrow head">' +
          '<div class="cell pin-id head-split' + headOn("no") + '">' +
            headBtn("no", "馬號", false) + headStatic("馬名") + sortHit("no") +
          "</div>" +
          '<div class="cell pin-draw' + headOn("draw") + '">' + headBtn("draw", "檔位") + "</div>" +
          '<div class="cell pin-odds head-split' + headOn("win") + '">' +
            headBtn("win", "獨贏", false) + headStatic("位置") + sortHit("win") +
          "</div></div>";
      const scrollHead =
        '<div class="hrow head">' +
          SCROLL_COLS.map((c) =>
            '<div class="cell ' + c.cls + headOn(c.key) + '">' + headBtn(c.key, c.label) + "</div>"
          ).join("") +
        "</div>";

      el.lock.innerHTML = lockHead + rows.map((r, i) => {
        const alt = i % 2 ? " alt" : "";
        const scratch = r.scratched ? " scratched" : "";
        const winHot = !r.scratched && r.win === hot.minW ? " hot" : "";
        const plaHot = !r.scratched && r.place === hot.minP ? " hot" : "";
        const odds = r.scratched || r.win == null
          ? '<div class="odds"><span class="na">—</span></div>'
          : '<div class="odds"><span class="win' + winHot + '">' + esc(r.win) +
            '</span><span class="pla' + plaHot + '">' + esc(r.place) + "</span></div>";
        const name = '<span class="hname">' + esc(r.name) + "</span>";
        return '<div class="hrow' + alt + scratch + '">' +
          '<div class="cell pin-id' + colOn("no") + '"><span class="' + silkClass(r.no) + '">' + esc(r.no) + "</span>" + name + "</div>" +
          '<div class="cell pin-draw' + colOn("draw") + '"><span class="draw-dot">' + esc(r.draw) + "</span></div>" +
          '<div class="cell odds pin-odds' + colOn("odds") + '">' + odds + "</div>" +
        "</div>";
      }).join("");

      el.scroll.innerHTML = scrollHead + rows.map((r, i) => {
        const alt = i % 2 ? " alt" : "";
        const scratch = r.scratched ? " scratched" : "";
        const cells = SCROLL_COLS.map((c) =>
          '<div class="cell ' + c.cls + colOn(c.key) + '"><span class="v">' + esc(fmt(r[c.key])) + "</span></div>"
        ).join("");
        return '<div class="hrow' + alt + scratch + '">' + cells + "</div>";
      }).join("");

      document.querySelectorAll("#board [data-sort]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-sort");
          if (!key || key === "name" || key === "place") return;
          if (sortKey === key) sortDir = -sortDir;
          else { sortKey = key; sortDir = 1; }
          renderBoard();
        });
      });
    }

    renderPills();
    renderBoard();

    const scroller = document.getElementById("scroller");
    let drag = null;
    scroller.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse" || e.button !== 0) return;
      if (e.target.closest("button, [data-sort]")) return;
      drag = { x: e.clientX, sl: scroller.scrollLeft };
    });
    window.addEventListener("pointermove", (e) => {
      if (!drag) return;
      scroller.scrollLeft = drag.sl - (e.clientX - drag.x);
    });
    window.addEventListener("pointerup", () => { drag = null; });
    window.addEventListener("pointercancel", () => { drag = null; });
  })();
  </script>
</body>
</html>

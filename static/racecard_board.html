<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="noindex" />
  <title>排位 · J18</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav: #3d5a80;
      --nav-2: #334b6b;
      --page: #eef1f5;
      --text: #2c3340;
      --muted: #8a93a3;
      --blue: #5ba3d9;
      --blue-2: #3b8fd4;
      --green: #5cb85c;
      --orange: #e88b2a;
      --red: #e74c3c;
      --place: #27ae60;
      --line: #e4e7ec;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      /* 左鎖三欄：馬號上馬名下、檔位横排、獨贏上位置下 */
      --pin-id: 52px;
      --pin-draw: 40px;
      --pin-odds: 44px;
      --pin-w: calc(var(--pin-id) + var(--pin-draw) + var(--pin-odds));
      --head-fs: 11px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      overflow: hidden;
      background: #d8dee6; color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex; flex-direction: column;
      max-width: 430px; margin: 0 auto;
      background: var(--page);
      min-height: 100%;
      box-shadow: 0 0 0 1px rgba(45,62,80,.12);
    }
    button { font-family: inherit; }

    .topbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 44px; padding: 0 10px;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff; z-index: 30;
    }
    .topbar .side { width: 64px; font-size: 15px; font-weight: 700; }
    .topbar .side.r { text-align: right; opacity: .9; }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .06em; }

    .subhead {
      flex: 0 0 auto;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 8px 10px 10px;
    }
    .date-row {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 15px; font-weight: 800; color: var(--blue-2); margin-bottom: 8px;
    }
    .date-row .u { color: #9aa3b0; font-size: 12px; font-weight: 700; }

    .race-pills { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .race-pills button {
      width: 32px; height: 26px; border: 0; border-radius: 6px; cursor: pointer;
      font-weight: 800; font-size: 13px; color: #fff; background: var(--green);
    }
    .race-pills button.active { background: var(--blue); }

    .meta {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-top: 8px; font-size: 12px; line-height: 1.45; color: #5b6575;
    }
    .hint {
      margin-top: 6px; font-size: 11px; color: var(--muted); font-weight: 600;
    }

    /* 單一原生滾動：表頭 sticky top、左鎖 sticky left，左右滑同層不會卡頓 */
    .board-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      background: #fff;
    }

    .hrow {
      display: flex;
      align-items: stretch;
      height: 44px;
      min-width: max-content;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .hrow.alt { background: #f4f6f8; }
    .hrow.scratched .hname { text-decoration: line-through; }
    .hrow.scratched .cell { opacity: .45; }

    .lock-cluster {
      position: sticky;
      left: 0;
      top: auto;
      z-index: 4;
      display: grid;
      grid-template-columns: var(--pin-id) var(--pin-draw) var(--pin-odds);
      flex: 0 0 var(--pin-w);
      width: var(--pin-w);
      min-width: var(--pin-w);
      align-self: stretch;
      background: #fff;
      box-shadow: 6px 0 8px rgba(45, 62, 80, .10);
      isolation: isolate;
    }
    .hrow.alt .lock-cluster { background: #f4f6f8; }
    .hrow.head {
      position: sticky; top: 0; z-index: 6;
      height: 44px;
      background: #eef3f8;
      color: #6b7380;
      font-size: var(--head-fs); font-weight: 800;
      text-align: center;
    }
    .hrow.head .lock-cluster {
      z-index: 8;
      background: #eef3f8;
    }

    .cell {
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
      font-size: var(--head-fs);
      overflow: hidden;
    }
    .lock-cluster .cell.pin-id {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1px;
      padding: 1px 2px;
    }
    /* 資料列：彩衣左上出血，不蓋馬號／馬名 */
    .hrow:not(.head) .cell.pin-id {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      grid-template-rows: 28px minmax(0, 1fr);
      align-items: stretch;
      justify-items: stretch;
      padding: 0;
      overflow: visible;
      position: relative;
    }
    .hno {
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      justify-self: center;
      z-index: 2;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .hrow:not(.head) .cell.pin-id .hname {
      grid-column: 1 / -1;
      grid-row: 2;
      z-index: 2;
      align-self: center;
      max-width: none;
      width: 100%;
      padding: 0 2px 2px;
    }
    .hrow.head .lock-cluster .cell { padding: 0 2px; }
    .hrow.head .cell.pin-odds {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0;
    }
    .hrow.head .cell.head-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: center;
      align-content: center;
      justify-items: center;
      column-gap: 1px;
      row-gap: 0;
    }
    .hrow.head .cell.head-split .odds-sort { grid-column: 1; grid-row: 1; }
    .hrow.head .cell.head-split .head-static { grid-column: 1; grid-row: 2; }
    .hrow.head .cell.head-split .sort-hit {
      grid-column: 2; grid-row: 1 / span 2;
      align-self: center;
    }
    .lock-cluster .cell.odds { justify-content: center; padding: 0 3px; }
    .sortable { cursor: pointer; user-select: none; }
    .head-static {
      display: block;
      font-size: var(--head-fs); font-weight: 800; line-height: 1.05;
      color: #6b7380; cursor: default; user-select: none;
    }
    .odds-sort {
      display: inline-flex; flex-direction: row;
      align-items: center; justify-content: center; gap: 2px;
      width: auto; max-width: 100%; border: 0; background: transparent;
      color: inherit; font: inherit; font-size: var(--head-fs); font-weight: 800;
      padding: 0; line-height: 1.15; cursor: pointer; text-align: center;
      white-space: nowrap; border-radius: 3px;
    }
    .hrow.head .lock-cluster .odds-sort { font-size: var(--head-fs); line-height: 1.05; }
    .hrow.head .scroll-col .odds-sort {
      flex-direction: row; align-items: center; justify-content: center;
      gap: 2px; width: 100%; font-size: var(--head-fs); white-space: normal;
    }
    .odds-sort .lab { display: block; line-height: 1.05; font-size: inherit; }
    .sort-hit {
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; background: transparent; padding: 0; margin: 0;
      cursor: pointer; color: inherit; line-height: 1;
    }
    .sort-ico {
      display: inline-flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1px; flex: 0 0 auto;
      line-height: 1;
    }
    .sort-ico .u, .sort-ico .d {
      display: block; font-size: 8px; font-weight: 900;
      color: #c5cad3; line-height: 1;
    }
    .sortable.on { color: #2c5f8a; }
    .sort-ico .u.on, .sort-ico .d.on { color: var(--orange); }
    .hrow.head .cell.sort-on {
      background: #e4eef8;
      box-shadow: inset 0 -2px 0 #3b8fd4;
      color: #2c5f8a;
    }
    .cell.sort-col { background: rgba(91, 163, 217, .12); }
    .hrow.alt .cell.sort-col { background: rgba(91, 163, 217, .18); }

    .silk {
      display: block;
      width: 16px; height: 16px;
      border-radius: 0;
      background-color: transparent;
    }
    .hrow:not(.head) .cell.pin-id .silk {
      grid-column: 1;
      grid-row: 1;
      width: auto;
      min-width: 0;
      min-height: 0;
      align-self: stretch;
      justify-self: stretch;
      /* 貼到列頂／左鎖邊框交接，左上出血 */
      margin: -1px 0 0 0;
      height: calc(100% + 1px);
      overflow: hidden;
      z-index: 1;
    }
    .silk.has-img {
      background-color: transparent;
      /* 放大裁掉帽子與灰邊，只留彩衣身 */
      background-size: 200% auto;
      background-position: 50% 70%;
      background-repeat: no-repeat;
    }
    .hname {
      display: block;
      font-size: 11px; font-weight: 800; line-height: 1.1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text); max-width: 50px;
      text-align: center;
      letter-spacing: -.02em;
    }

    .draw-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      border: 1px solid #cfd6de; font-size: 10px; font-weight: 800;
      background: #fff; color: #334;
    }

    .odds { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
    .odds .win { font-size: 13px; font-weight: 800; color: var(--text); }
    .odds .pla { font-size: 11px; font-weight: 700; color: #7b8494; }
    .odds .win.hot, .odds .pla.hot { color: var(--red); }
    .odds .na { color: var(--muted); font-size: 11px; }

    .muted { color: var(--muted); font-weight: 600; }
    .form { letter-spacing: .02em; font-weight: 700; font-variant-numeric: tabular-nums; }
    .comment { font-size: var(--head-fs); font-weight: 600; color: #4a5563; }
    /* 右滑列：內容一律居中；分隔線用內縮豎線，避免壓到數字 */
    .scroll-col {
      position: relative;
      min-width: 54px; flex: 0 0 54px;
      justify-content: center;
      padding: 0 5px;
      overflow: hidden;
    }
    .scroll-col::after {
      content: "";
      position: absolute;
      top: 6px; bottom: 6px; right: 0;
      width: 1px;
      background: #e4e7ec;
      pointer-events: none;
    }
    .scroll-col.sm { min-width: 48px; flex: 0 0 48px; padding: 0 4px; }
    .scroll-col.md { min-width: 56px; flex: 0 0 56px; }
    .scroll-col.form { min-width: 108px; flex: 0 0 108px; }
    .scroll-col.wide { min-width: 72px; flex: 0 0 72px; }
    .scroll-col.xl { min-width: 112px; flex: 0 0 112px; }
    .scroll-col.num {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .scroll-col .v {
      display: block;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      font-size: var(--head-fs);
    }

    .tabbar {
      flex: 0 0 52px;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: var(--nav); color: rgba(255,255,255,.7);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar .tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 10px; font-weight: 700; text-decoration: none; color: inherit;
    }
    .tabbar .tab.on { color: #fff; }
    .tabbar .ico { font-size: 16px; line-height: 1; }

    .silk-1 { background:#e10600; } .silk-2 { background:#111; }
    .silk-3 { background:#0057b8; } .silk-4 { background:#ffd100; color:#222; }
    .silk-5 { background:#00a651; } .silk-6 { background:#e4007c; }
    .silk-7 { background:#00b5e2; color:#083044; } .silk-8 { background:#8a8d8f; }
    .silk-9 { background:#ff6a00; } .silk-10 { background:#6f2c91; }
    .silk-11 { background:#a8d08d; color:#1a3318; } .silk-12 { background:#7a1f2b; }
    .silk-13 { background:#fff; color:#111; box-shadow: inset 0 0 0 1px #999; }
    .silk-14 { background:#c5a028; color:#1a1408; }
  </style>
</head>

rtgDelta":"0","hw":126,"bodyWt":1129,"gear":"H","career":"5-2-6-28","recent":"4/2/1/6/9/5","rail":"C","dam":"Holly Holy","sire":"Almanzor","damsire":"Dylan Thomas","owner":"無極限團體","prize":"0","silk":"https://racing.hkjc.com/racing/content/Images/RaceColor/K004.gif","scratched":false},{"no":9,"name":"中國心","draw":11,"form6":"3/5/3/2/1/1","jockey":"楊明綸","trainer":"大衛希斯","age":5,"rating":70,"rtgDelta":"0","hw":125,"bodyWt":1109,"gear":"TT1","career":"2-3-2-12","recent":"3/5/3/2/1/1","rail":"C","dam":"Miracle Miss","sire":"Super Seth","damsire":"O'Reilly","owner":"24/25 大衛希斯練馬師賽馬團體","prize":"235,750","silk":"https://racing.hkjc.com/racing/content/Images/RaceColor/K395.gif","scratched":false},{"no":10,"name":"風將","draw":10,"form6":"2/9/13/7/10/7","jockey":"蔡明紹","trainer":"告東尼","age":4,"rating":67,"rtgDelta":"1","hw":122,"bodyWt":1104,"gear":"CP/TT","career":"0-1-0-10","recent":"2/9/13/7/10/7","rail":"C","dam":"Goldika","sire":"Dubawi","damsire":"Intello","owner":"陳綺蓮","prize":"430,500","silk":"https://racing.hkjc.com/racing/content/Images/RaceColor/L184.gif","scratched":false},{"no":11,"name":"瑪瑙","draw":4,"form6":"8/8/11/8/5/4","jockey":"潘明輝","trainer":"羅富全","age":8,"rating":64,"rtgDelta":"-2","hw":119,"bodyWt":1149,"gear":"B","career":"5-4-3-51","recent":"8/8/11/8/5/4","rail":"C","dam":"Urban Rocker","sire":"All Too Hard","damsire":"Fastnet Rock","owner":"Chong Min Onn","prize":"0","silk":"https://racing.hkjc.com/racing/content/Images/RaceColor/G306.gif","scratched":false},{"no":12,"name":"財富非凡","draw":6,"form6":"1/4/3/12/6/10","jockey":"班德禮","trainer":"巫偉傑","age":5,"rating":62,"rtgDelta":"6","hw":117,"bodyWt":1107,"gear":"TT","career":"1-0-1-8","recent":"1/4/3/12/6/10","rail":"C","dam":"Perfect Beat","sire":"Sweynesse","damsire":"Magnus","owner":"袁志堅與陳玉英","prize":"0","silk":"https://racing.hkjc.com/racing/content/Images/RaceColor/L057.gif","scratched":false}]}]};

    const el = {
      pills: document.getElementById("racePills"),
      board: document.getElementById("board"),
    };
    let currentRace = 1;
    let sortKey = "no";
    let sortDir = 1;

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function silkClass(n) { return "silk silk-" + (((Number(n) - 1 + SILK_N) % SILK_N) + 1); }
    function fmt(v) {
      if (v == null || v === "") return "—";
      return v;
    }
    function numOrNull(v) {
      if (v == null || v === "" || v === "—") return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }
    function silkTag(r) {
      if (r.silk) {
        return '<span class="silk has-img" style="background-image:url(\'' + esc(r.silk) + '\')" aria-hidden="true"></span>';
      }
      return '<span class="' + silkClass(r.no) + '" aria-hidden="true"></span>';
    }
    function currentMeet() {
      return MEETING.races.find((r) => r.num === currentRace) || MEETING.races[0];
    }
    function currentRunners() {
      return (currentMeet().runners || []).slice();
    }
    function renderMeta() {
      const box = document.getElementById("raceMeta");
      if (box) box.textContent = currentMeet().meta || "";
    }

    function bestOdds() {
      let minW = Infinity, minP = Infinity;
      currentRunners().forEach((r) => {
        if (r.scratched) return;
        if (numOrNull(r.win) != null) minW = Math.min(minW, r.win);
        if (numOrNull(r.place) != null) minP = Math.min(minP, r.place);
      });
      return { minW, minP };
    }

    function sortIco(key) {
      const on = sortKey === key;
      const up = on && sortDir > 0 ? " on" : "";
      const dn = on && sortDir < 0 ? " on" : "";
      return '<span class="sort-ico" aria-hidden="true"><span class="u' + up + '">▲</span><span class="d' + dn + '">▼</span></span>';
    }
    function headOn(key) { return sortKey === key ? " sort-on" : ""; }
    function colOn(key) {
      if (key === "odds") return sortKey === "win" ? " sort-col" : "";
      return sortKey === key ? " sort-col" : "";
    }

    function sortedRows() {
      const arr = currentRunners();
      arr.sort((a, b) => {
        const av = a[sortKey], bv = b[sortKey];
        const an = numOrNull(av), bn = numOrNull(bv);
        let cmp;
        if (an != null && bn != null) cmp = an - bn;
        else cmp = String(av == null ? "" : av).localeCompare(String(bv == null ? "" : bv), "zh-Hant");
        if (cmp === 0) cmp = a.no - b.no;
        return cmp * sortDir;
      });
      return arr;
    }

    function renderPills() {
      el.pills.innerHTML = MEETING.races.map((r) => {
        const on = r.num === currentRace ? " active" : "";
        return '<button type="button" class="' + on.trim() + '" data-n="' + r.num + '">' + r.num + "</button>";
      }).join("");
      el.pills.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentRace = Number(btn.getAttribute("data-n"));
          sortKey = "no";
          sortDir = 1;
          renderPills();
          renderMeta();
          renderBoard();
        });
      });
    }

    function headBtn(key, label, withIco) {
      const on = sortKey === key;
      const htmlLabel = esc(label).replace(/\n/g, "<br>");
      const aria = on ? (sortDir > 0 ? "ascending" : "descending") : "none";
      return '<button type="button" class="odds-sort sortable' + (on ? " on" : "") +
        '" data-sort="' + key + '" aria-sort="' + aria + '">' +
        '<span class="lab">' + htmlLabel + "</span>" +
        (withIco === false ? "" : sortIco(key)) + "</button>";
    }
    function sortHit(key) {
      const on = sortKey === key ? " on" : "";
      return '<button type="button" class="sort-hit sortable' + on + '" data-sort="' + key +
        '" tabindex="-1" aria-hidden="true">' + sortIco(key) + "</button>";
    }
    function headStatic(label) {
      return '<span class="head-static">' + esc(label) + "</span>";
    }

    function renderBoard() {
      const hot = bestOdds();
      const rows = sortedRows();
      const sl = el.board.scrollLeft;
      const st = el.board.scrollTop;
      const lockHead =
        '<div class="lock-cluster">' +
          '<div class="cell pin-id head-split' + headOn("no") + '">' +
            headBtn("no", "馬號", false) + headStatic("馬名") + sortHit("no") +
          "</div>" +
          '<div class="cell pin-draw' + headOn("draw") + '">' + headBtn("draw", "檔位") + "</div>" +
          '<div class="cell pin-odds head-split' + headOn("win") + '">' +
            headBtn("win", "獨贏", false) + headStatic("位置") + sortHit("win") +
          "</div></div>";
      const scrollHeadCells = SCROLL_COLS.map((c) =>
        '<div class="cell ' + c.cls + headOn(c.key) + '">' + headBtn(c.key, c.label) + "</div>"
      ).join("");
      const head = '<div class="hrow head">' + lockHead + scrollHeadCells + "</div>";

      const body = rows.map((r, i) => {
        const alt = i % 2 ? " alt" : "";
        const scratch = r.scratched ? " scratched" : "";
        const winHot = !r.scratched && r.win === hot.minW ? " hot" : "";
        const plaHot = !r.scratched && r.place === hot.minP ? " hot" : "";
        const odds = r.scratched || r.win == null
          ? '<div class="odds"><span class="na">—</span></div>'
          : '<div class="odds"><span class="win' + winHot + '">' + esc(r.win) +
            '</span><span class="pla' + plaHot + '">' + esc(r.place) + "</span></div>";
        const name = '<span class="hname">' + esc(r.name) + "</span>";
        const lock =
          '<div class="lock-cluster">' +
            '<div class="cell pin-id' + colOn("no") + '">' + silkTag(r) +
            '<span class="hno">' + esc(r.no) + "</span>" + name + "</div>" +
            '<div class="cell pin-draw' + colOn("draw") + '"><span class="draw-dot">' + esc(r.draw) + "</span></div>" +
            '<div class="cell odds pin-odds' + colOn("odds") + '">' + odds + "</div>" +
          "</div>";
        const cells = SCROLL_COLS.map((c) =>
          '<div class="cell ' + c.cls + colOn(c.key) + '"><span class="v">' + esc(fmt(r[c.key])) + "</span></div>"
        ).join("");
        return '<div class="hrow' + alt + scratch + '">' + lock + cells + "</div>";
      }).join("");

      el.board.innerHTML = head + body;
      el.board.scrollLeft = sl;
      el.board.scrollTop = st;

      document.querySelectorAll("#board [data-sort]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-sort");
          if (!key || key === "name" || key === "place") return;
          if (sortKey === key) sortDir = -sortDir;
          else { sortKey = key; sortDir = 1; }
          renderBoard();
        });
      });
    }

    renderPills();
    renderMeta();
    renderBoard();
  })();
  </script>

    /* 演示：第 1 場已完賽並已派彩（歷史場次），按名次排序＋冠亞季殿水印 */
    function ensureRace1HistoryPaidDemo() {
      if (!MEETING || !Array.isArray(MEETING.races)) return;
      const race = MEETING.races.find(function (r) { return Number(r.num) === 1; });
      if (!race || !Array.isArray(race.runners)) return;
      race.paid = true;
      race.history = true;
      const active = race.runners.filter(function (r) { return r && !r.scratched; });
      const already = active.length && active.every(function (r) {
        return numOrNull(r.finish) != null || numOrNull(r.position) != null || numOrNull(r.rank) != null;
      });
      if (already) return;
      active.slice().sort(function (a, b) {
        const aw = numOrNull(a.win);
        const bw = numOrNull(b.win);
        if (aw == null && bw == null) return Number(a.no) - Number(b.no);
        if (aw == null) return 1;
        if (bw == null) return -1;
        if (aw !== bw) return aw - bw;
        return Number(a.no) - Number(b.no);
      }).forEach(function (r, i) {
        r.finish = i + 1;
      });
    }
    ensureRace1HistoryPaidDemo();

    /* 演示：若干馬裝備有變更 → 上仗 gearPrev／本期 gear */
    function ensureGearChangeDemo() {
      if (!MEETING || !Array.isArray(MEETING.races)) return;
      const specs = [
        { num: 1, no: 3, gearPrev: "TT", gear: "CP-/SR2/TT" },

        { num: 1, no: 11, gearPrev: "B", gear: "B/TT" },

        { num: 2, no: 9, gearPrev: "B", gear: "B/TT" },
        { num: 5, no: 5, gearPrev: "SR", gear: "SR/TT" },
        { num: 5, no: 8, gearPrev: "H", gear: "B" }
      ];
      specs.forEach(function (sp) {
        const race = MEETING.races.find(function (r) { return Number(r.num) === sp.num; });
        if (!race || !Array.isArray(race.runners)) return;
        const row = race.runners.find(function (r) { return r && Number(r.no) === sp.no; });
        if (!row || row.scratched) return;
        row.gearPrev = sp.gearPrev;
        row.gear = sp.gear;
      });
    }

    function syncFillSheetHeight(overlayId, sheetId, bodyId) {
      const overlay = document.getElementById(overlayId);
      const sheet = document.getElementById(sheetId);
      const body = document.getElementById(bodyId);
      if (!overlay || !sheet || !body || overlay.hasAttribute("hidden")) return;
      const avail = Math.max(0, Math.floor(overlay.clientHeight));

      body.style.minHeight = "0";

    function famousTipsForTipster(tipster, race) {
      if (!tipster || !race) return [];
      /* 指數名家：號碼與綜合指數膠囊對應策略行一致 */
      if (tipster.indexStrategy) {
        const lim = Math.min(6, Math.max(1, Number(tipster.count) || 6));
        return indexPicksForStrategy(tipster.indexStrategy, lim, race).map(String);
      }
      const runners = (race.runners || []).filter(function (r) {
        return r && !r.scratched && numOrNull(r.win) != null;
      }).slice();
      if (!runners.length) return [];
      runners.sort(function (a, b) {
        const aw = numOrNull(a.win);
        const bw = numOrNull(b.win);
        if (aw !== bw) return aw - bw;
        return Number(a.no) - Number(b.no);
      });
      const max = Math.min(6, Math.max(1, Number(tipster.count) || 4), runners.length);
      const start = (Number(tipster.seed) || 0) % Math.max(1, runners.length);
      const out = [];
      const seen = {};
      for (let i = 0; i < runners.length && out.length < max; i++) {
        const row = runners[(start + i * 2) % runners.length];
        const no = String(row.no);
        if (seen[no]) continue;
        seen[no] = 1;
        out.push(no);
      }
      /* 不足時按賠率序補齊 */
      for (let j = 0; j < runners.length && out.length < max; j++) {
        const no = String(runners[j].no);
        if (seen[no]) continue;
        seen[no] = 1;
        out.push(no);
      }
      return out;

      const tally = {};

        const tips = famousTipsForTipster(t, race);
        const earlyG = famousGroupEarlyBonus(t.group);
        tips.forEach(function (no, idx) {
          if (!tally[no]) tally[no] = { no: no, votes: 0, early: 0 };
          tally[no].votes += 1;
          tally[no].early += (10 - idx) + earlyG;

      return Object.keys(tally).map(function (k) { return tally[k]; }).sort(function (a, b) {

    function saveSynthHorseNote(opts) {
      const o = opts || {};
      const text = String(getSynthNoteDraftLive() || "").trim();
      if (!synthReviewSheetNo) return false;
      const runners = currentRunners();
      const row = runners.find(function (r) { return r && String(r.no) === String(synthReviewSheetNo); });
      if (!row || row.scratched) return false;
      synthNoteDraft = text;
      synthNoteBaseline = text;
      row.horseNote = text;
      if (!Array.isArray(row.horseNoteHistory)) row.horseNoteHistory = [];
      if (text) {
        const meet = currentMeet();
        const distMatch = meet && meet.meta ? String(meet.meta).match(/(\d{3,4})\s*米/) : null;
        const courseLabel = (MEETING && MEETING.courseLabel) || "";
        const course = /沙田/.test(courseLabel) ? "沙田" : (/跑馬地|谷/.test(courseLabel) ? "跑馬地" : (courseLabel || ""));
        const entry = {
          id: "n" + Date.now(),
          date: (MEETING && MEETING.date) || "",
          text: text,
          finish: row.finish != null ? String(row.finish) : "",
          jockey: row.jockey != null ? String(row.jockey) : "",
          dist: distMatch ? (distMatch[1] + "米") : "",
          course: course

        row.horseNoteHistory = [entry].concat(row.horseNoteHistory.filter(function (it) {
          return !(it && String(it.text || it.note || "").trim() === text && String(it.date || "") === String(entry.date));

        row.horseNoteCount = row.horseNoteHistory.length;

    function splitPersonName(raw) {
      const p = splitNameAllow(raw);
      const name = (p && p.name) || String(raw == null ? "" : raw).trim();
      return name && name !== "—" ? name : "";
    }
    function jtCollabCoreStats(r) {
      const jockey = splitPersonName(r && r.jockey);
      const trainer = splitPersonName(r && r.trainer);
      const no = Number(r && r.no) || 0;
      const raceNum = Number(currentRace) || 1;
      const seed = Math.abs(no * 17 + raceNum * 11 + (jockey.length * 3) + (trainer.length * 5));
      const runs = 6 + (seed % 10);
      const wins = seed % 4;
      const seconds = (seed >> 1) % 3;
      const thirds = (seed >> 2) % 3;
      const places = wins + seconds + thirds;
      const winPctNum = runs ? Number(((wins / runs) * 100).toFixed(1)) : 0;
      const placePctNum = runs ? Number(((places / runs) * 100).toFixed(1)) : 0;
      return {
        jockey: jockey,
        trainer: trainer,
        seed: seed,
        runs: runs,
        wins: wins,
        seconds: seconds,
        thirds: thirds,
        winPctNum: winPctNum,
        placePctNum: placePctNum,
        winPct: winPctNum.toFixed(1),
        placePct: placePctNum.toFixed(1)
      };
    }
    /* 本場未劃走馬中，騎練合作勝出率最高者（並列全標） */
    function jtBestCollabWinNos() {
      const out = {};
      const runners = currentRunners() || [];
      let best = null;
      const scored = [];
      runners.forEach(function (r) {
        if (!r || r.scratched) return;
        const st = jtCollabCoreStats(r);
        if (!st.jockey && !st.trainer) return;
        scored.push({ no: String(r.no), n: st.winPctNum });
        if (best == null || st.winPctNum > best) best = st.winPctNum;
      });
      if (best == null) return out;
      scored.forEach(function (s) {
        if (s.n === best) out[s.no] = true;
      });
      return out;
    }
    function jtCollabDemoOf(r) {
      const st = jtCollabCoreStats(r);
      const courses = ["沙田", "跑馬地", "沙田", "跑馬地"];
      const dists = ["1200米", "1400米", "1650米", "1000米", "1800米"];
      const hist = [];
      for (let i = 0; i < Math.min(st.runs, 6); i++) {
        const finRoll = (st.seed + i * 9) % 11;
        const finish = finRoll === 0 ? 1 : finRoll === 1 ? 2 : finRoll === 2 ? 3 : (4 + (finRoll % 7));
        const mo = ((9 - (i % 6)) + 11) % 12 + 1;
        const day = 3 + ((st.seed + i * 5) % 24);
        hist.push({
          date: "2026-" + String(mo).padStart(2, "0") + "-" + String(day).padStart(2, "0"),
          course: courses[(st.seed + i) % courses.length],
          dist: dists[(st.seed + i * 2) % dists.length],
          finish: finish
        });
      }
      return {
        jockey: st.jockey,
        trainer: st.trainer,
        main: "歷史出賽合作：" + st.runs + " 仗 · " + st.wins + "冠 " + st.seconds + "亞 " + st.thirds + "季",
        winRate: "勝出率 " + st.winPct + "%",
        placeRate: "位置率 " + st.placePct + "%",
        winPctNum: st.winPctNum,
        races: hist
      };
    }

    const SPEEDMAP_CMS = "https://consvc.hkjc.com/-/media/Sites/JCRW/SpeedPro/current/sg_race_";

    function isSpeedMapSheetOpen() {

    function syncSpeedMapSheetTop() {
      /* 與水位彈窗同錨：insight／膠囊底邊＝列表頂（layout 座標，不受 zoom 干擾） */
      const sheet = document.getElementById("speedMapSheet");

      if (el.board) el.board.scrollTop = 0;
      const shellRect = el.boardShell.getBoundingClientRect();

        topPx = Math.round(pin.getBoundingClientRect().bottom - shellRect.top);
      } else if (el.boardMain) {

        while (n && n !== el.boardShell) {

            if (r.placeInPct == null) r.placeInPct = null;
            return;
          }
          if (r.placeInN != null && r.placeInTotal != null) {
            if (r.placeInPct == null && Number(r.placeInTotal) > 0) {
              r.placeInPct = Math.round((Number(r.placeInN) / Number(r.placeInTotal)) * 100);
            }
            return;
          }
          const no = Number(r.no) || 0;
          /* 出賽 6～36；入圍率約 20%～70% */

          const rate = 20 + ((no * 11 + raceNum * 3) % 51);
          let n = Math.round(total * rate / 100);
          if (n < 0) n = 0;
          if (n > total) n = total;
          r.placeInN = n;
          r.placeInTotal = total;
          r.placeInPct = total ? Math.round((n / total) * 100) : 0;
        });
        /* 範例錨點：第1場 1號 → 16/32｜50% */

    /* 演示：同班賽／同場同程／同程 — 出賽（冠-亞-季），例 23（6-4-5） */
    function ensureSameTrackDemo() {
      if (!MEETING || !Array.isArray(MEETING.races)) return;
      const keys = ["sameClass", "sameCourseDist", "sameDist"];
      MEETING.races.forEach(function (race) {
        if (!race || !Array.isArray(race.runners)) return;
        const raceNum = Number(race.num) || 1;
        race.runners.forEach(function (r) {
          if (!r) return;
          if (r.scratched) {
            keys.forEach(function (k) {
              if (r[k] == null) r[k] = null;
            });
            return;
          }
          const no = Number(r.no) || 0;
          keys.forEach(function (key, ki) {
            if (r[key] != null && r[key] !== "") return;
            const seed = no * (13 + ki * 5) + raceNum * (7 + ki * 3) + ki * 17;
            const runs = 2 + (seed % 29); /* 2～30 */
            let first = seed % (Math.floor(runs / 2) + 1);
            let second = (seed * 3) % (Math.floor(runs / 3) + 1);
            let third = (seed * 5) % (Math.floor(runs / 4) + 1);
            if (first + second + third > runs) {
              third = Math.max(0, runs - first - second);
            }
            r[key] = { runs: runs, first: first, second: second, third: third };
          });
        });
        /* 範例錨點：第1場 1號同班賽 → 23（6-4-5） */
        if (raceNum === 1) {
          race.runners.forEach(function (r) {
            if (!r || Number(r.no) !== 1 || r.scratched) return;
            r.sameClass = { runs: 23, first: 6, second: 4, third: 5 };
          });
        }
      });
    }

    function payoutFinishNosForRace(race) {
      const runners = ((race && race.runners) || []).filter(function (r) { return r && !r.scratched; });
      if (!runners.length) return [];
      const hasFinish = runners.every(function (r) { return finishOfRunner(r) != null; });
      const sorted = runners.slice().sort(function (a, b) {
        if (hasFinish) {
          const fa = finishOfRunner(a);
          const fb = finishOfRunner(b);
          if (fa !== fb) return fa - fb;
          return Number(a.no) - Number(b.no);
        }
        const aw = numOrNull(a.win);
        const bw = numOrNull(b.win);
        if (aw == null && bw == null) return Number(a.no) - Number(b.no);
        if (aw == null) return 1;
        if (bw == null) return -1;
        if (aw !== bw) return aw - bw;
        return Number(a.no) - Number(b.no);
      });
      return sorted.map(function (r) { return r.no; });

        }
        /* 心水標記：只按勾選序號正／反排；未勾選永遠在後 */
        if (sortKey === "tipNote") {
          const ta = getTipNoteOrder(a && a.no);

          if (ta == null && tb == null) return Number(a.no) - Number(b.no);

        if (sortKey === "gear") {

    function fixedScrollColW(key) {

    function fitScrollColWidths() {
      const rows = el.board.querySelectorAll(".hrow");
      if (!rows.length) return;
      const cols = activeScrollCols();
      const n = cols.length;
      const widths = new Array(n).fill(0);
      const all = [];
      rows.forEach((row) => {
        const cells = row.querySelectorAll(".scroll-col");
        for (let i = 0; i < cells.length && i < n; i++) all.push({ cell: cells[i], key: cols[i] && cols[i].key });
      });
      all.forEach(function (item) {
        const cell = item.cell;
        const fw = fixedScrollColW(item.key);
        if (fw != null) {
          cell.style.width = fw + "px";
          cell.style.flex = "0 0 " + fw + "px";
          cell.style.overflow = "hidden";
          return;
        }
        cell.style.width = "max-content";
        cell.style.flex = "0 0 auto";
        cell.style.overflow = "visible";
      });
      rows.forEach((row) => {
        const cells = row.querySelectorAll(".scroll-col");
        for (let i = 0; i < cells.length && i < n; i++) {
          const fw = cols[i] ? fixedScrollColW(cols[i].key) : null;
          if (fw != null) {
            widths[i] = fw;
            continue;
          }
          widths[i] = Math.max(widths[i], Math.ceil(cells[i].getBoundingClientRect().width));
        }
      });
      rows.forEach((row) => {
        const cells = row.querySelectorAll(".scroll-col");
        for (let i = 0; i < cells.length && i < n; i++) {
          cells[i].style.width = widths[i] + "px";
          cells[i].style.flex = "0 0 " + widths[i] + "px";
          /* 水印列保持可見溢出，其餘清掉臨時 overflow */
          if (cells[i].classList.contains("finish-wm-host") || cells[i].classList.contains("finish-wm-pair")) {
            cells[i].style.overflow = "visible";
          } else if (fixedScrollColW(cols[i] && cols[i].key) != null) {
            cells[i].style.overflow = "hidden";
          } else {
            cells[i].style.overflow = "";
          }

    function sheetItem(label, value, wide) {

      return '<div class="item' + (wide ? " wide" : "") + '"><span class="k">' + esc(label) +

    function syncWaterSheetTop() {
      if (!el.waterSheet || !el.boardShell) return;
      if (el.board) el.board.scrollTop = 0;
      const shellRect = el.boardShell.getBoundingClientRect();
      const pin = document.getElementById("insightPin");
      let topPx = 0;
      if (pin) {
        /* insight／膠囊不 zoom：以其底邊＝馬匹列表頂。勿用 #boardMain.getBoundingClientRect().top，
           CSS zoom 放大後該值會偏高，導致水位殼上移遮住綜合指數膠囊。 */
        topPx = Math.round(pin.getBoundingClientRect().bottom - shellRect.top);
      } else if (el.boardMain) {
        /* 回退：累加 offsetTop（layout 座標，不受 zoom 視覺縮放干擾） */
        let y = 0;
        let n = el.boardMain;
        while (n && n !== el.boardShell) {
          y += n.offsetTop;

      el.waterSheet.style.top = Math.max(0, topPx) + "px";

    /* 水位彈窗時段：近→遠（左新右舊），箭頭相對右側更早時段比較 */
    const WATER_HOUR_COLS = 8;
    function parseMeetHour(meet) {
      const t = meet && (meet.time || meet.meta);
      const m = String(t || "").match(/(\d{1,2})\s*:\s*(\d{2})/);
      if (!m) return 14;
      return Math.max(0, Math.min(23, Number(m[1])));
    }
    function waterHourLabels(count) {
      const n = Math.max(1, Number(count) || WATER_HOUR_COLS);
      const base = parseMeetHour(currentMeet());
      const out = [];
      /* i=0 最左＝最近整點；往右每列更早一小時 */
      for (let i = 0; i < n; i++) {
        const h = (base - i + 24) % 24;
        out.push((h < 10 ? "0" : "") + h + ":00");
      }
      return out;
    }
    function clampInt(v, lo, hi) {
      const n = Math.round(Number(v));
      if (!Number.isFinite(n)) return lo;
      return Math.max(lo, Math.min(hi, n));
    }
    /* hourAgo：距開跑整點幾小時前；0＝最近。演示：越早水位略高、流量略低 */
    function waterHourSample(r, hourAgo) {
      if (!r || r.scratched) {
        return { winW: null, winF: null, plaW: null, plaF: null, wpW: null, wpF: null };
      }
      const no = Number(r.no) || 0;
      const raceNum = Number(currentRace) || 1;
      const hourIdx = Math.max(0, Number(hourAgo) || 0);
      const jitter = ((no * 3 + raceNum * 5 + hourIdx * 7) % 5) - 2;
      const winW0 = numOrNull(r.winWater);
      const plaW0 = numOrNull(r.placeWater);
      const wpW0 = numOrNull(r.wpWater);
      const winF0 = numOrNull(r.winFlow);
      const plaF0 = numOrNull(r.placeFlow);
      const wpF0 = numOrNull(r.wpFlow);
      const winW = winW0 == null ? null : clampInt(winW0 + hourIdx * 1.2 + jitter, 40, 99);
      const plaW = plaW0 == null ? null : clampInt(plaW0 + hourIdx * 1.0 + (jitter % 3), 35, 99);
      /* WP 時序抖動僅作占位；真實值日後由 API 提供 */
      const wpW = wpW0 == null ? null : clampInt(wpW0 + hourIdx * 1.1 + ((jitter + 1) % 3), 30, 99);
      const winF = winF0 == null ? null : clampInt(winF0 - hourIdx + ((no + hourIdx) % 3), 0, 40);
      const plaF = plaF0 == null ? null : clampInt(plaF0 - Math.max(0, hourIdx - 1) + ((no * 2 + hourIdx) % 3), 0, 40);
      const wpF = wpF0 == null ? null : clampInt(wpF0 - Math.max(0, hourIdx - 1) + ((no + hourIdx * 2) % 3), 0, 40);
      return { winW: winW, winF: winF, plaW: plaW, plaF: plaF, wpW: wpW, wpF: wpF };
    }
    /* 本時段 vs 更早時段（右鄰）：升＝綠↖，降＝紅↙。例：14:00=87、13:00=90 → 87 下紅↙ */
    function waterTrendDir(cur, earlier) {
      const a = numOrNull(cur);
      const b = numOrNull(earlier);
      if (a == null || b == null || a === b) return "";
      return a > b ? "up" : "down";
    }
    function waterTrendArrowHtml(dir) {
      if (dir !== "up" && dir !== "down") {
        return '<span class="wh-arr none" aria-hidden="true">↖</span>';
      }
      const label = dir === "up" ? "高於更早時段（升）" : "低於更早時段（降）";
      const ch = dir === "up" ? "↖" : "↙";
      return '<span class="wh-arr ' + dir + '" title="' + label + '" aria-hidden="true">' + ch + "</span>";
    }
    /* showArrow：水位箭頭在數字前；流量不顯示箭頭 */
    function waterMetricHtml(cls, val, fmtFn, earlierVal, showArrow) {
      const empty = val == null;
      const numHtml =
        '<span class="' + cls + (empty ? " muted" : "") + '">' +
          esc(empty ? "—" : fmtFn(val)) +
        "</span>";
      if (!showArrow) {
        return '<span class="wh-metric no-arr">' + numHtml + "</span>";
      }
      return (
        '<span class="wh-metric">' +
          waterTrendArrowHtml(waterTrendDir(val, earlierVal)) +
          numHtml +
        "</span>"
      );
    }
    function waterHourCellHtml(sample, earlier, colIdx) {
      const e = earlier || {};
      const colAttr = ' data-wh-col="' + esc(String(colIdx)) + '"';
      const empty =
        !sample ||
        (sample.winW == null && sample.plaW == null && sample.wpW == null &&
         sample.winF == null && sample.plaF == null && sample.wpF == null);
      if (empty) {
        return (
          '<div class="whour"' + colAttr + ' role="button" tabindex="0">' +
            '<div class="wh-line win">' +
              waterMetricHtml("wv", null, fmtWater, null, true) +
              waterMetricHtml("fv", null, fmtFlow, null, false) +
            "</div>" +
            '<div class="wh-line pla">' +
              waterMetricHtml("wv", null, fmtWater, null, true) +
              waterMetricHtml("fv", null, fmtFlow, null, false) +
            "</div>" +
            '<div class="wh-line wp">' +
              waterMetricHtml("wv", null, fmtWater, null, true) +
              waterMetricHtml("fv", null, fmtFlow, null, false) +
            "</div>" +
          "</div>"
        );
      }
      return (
        '<div class="whour"' + colAttr + ' role="button" tabindex="0">' +
          '<div class="wh-line win">' +
            waterMetricHtml("wv", sample.winW, fmtWater, e.winW, true) +
            waterMetricHtml("fv", sample.winF, fmtFlow, e.winF, false) +
          "</div>" +
          '<div class="wh-line pla">' +
            waterMetricHtml("wv", sample.plaW, fmtWater, e.plaW, true) +
            waterMetricHtml("fv", sample.plaF, fmtFlow, e.plaF, false) +
          "</div>" +
          '<div class="wh-line wp">' +
            waterMetricHtml("wv", sample.wpW, fmtWater, e.wpW, true) +
            waterMetricHtml("fv", sample.wpF, fmtFlow, e.wpF, false) +
          "</div>" +
        "</div>"
      );
    }
    /* 水位表十字焦點：{ no, col }；滑動不清除，點其他格切換 */
    let waterCrossFocus = null;
    function clearWaterCrossFocus() {
      const board = el.waterSheetBody && el.waterSheetBody.querySelector(".water-board");
      if (!board) return;
      board.querySelectorAll(".is-wh-cross-row").forEach(function (n) {
        n.classList.remove("is-wh-cross-row");
      });
      board.querySelectorAll(".is-wh-cross-col, .is-wh-cross-cell").forEach(function (n) {
        n.classList.remove("is-wh-cross-col");
        n.classList.remove("is-wh-cross-cell");
      });

    function applyWaterCrossFocus() {
      clearWaterCrossFocus();
      if (!waterCrossFocus) return;
      const board = el.waterSheetBody && el.waterSheetBody.querySelector(".water-board");
      if (!board) return;
      const no = String(waterCrossFocus.no);
      const col = Number(waterCrossFocus.col);
      if (!Number.isFinite(col)) {
        waterCrossFocus = null;
        return;

      const row = board.querySelector('.water-row[data-no="' + no.replace(/"/g, "") + '"]');
      if (!row) {
        waterCrossFocus = null;
        return;

      row.classList.add("is-wh-cross-row");
      board.querySelectorAll('.whour[data-wh-col="' + col + '"]').forEach(function (cell) {
        cell.classList.add("is-wh-cross-col");
      });
      const hit = row.querySelector('.whour[data-wh-col="' + col + '"]');
      if (hit) hit.classList.add("is-wh-cross-cell");

    function bindWaterCrossFocus() {
      const body = el.waterSheetBody;
      if (!body || body.dataset.crossBound === "1") return;
      body.dataset.crossBound = "1";
      let tapMoved = false;
      body.addEventListener("touchstart", function () { tapMoved = false; }, { passive: true });
      body.addEventListener("touchmove", function () { tapMoved = true; }, { passive: true });
      function activateFrom(cell) {
        if (!cell) return;
        const row = cell.closest(".water-row[data-no]");
        if (!row || row.classList.contains("head")) return;
        const no = row.getAttribute("data-no");
        const col = cell.getAttribute("data-wh-col");
        if (no == null || col == null) return;
        /* 再點同一格：取消十字高亮 */
        if (
          waterCrossFocus &&
          String(waterCrossFocus.no) === String(no) &&
          Number(waterCrossFocus.col) === Number(col)
        ) {
          clearWaterCrossFocusState();
          return;
        }
        setWaterCrossFocus(no, col);

        if (tapMoved) return;
        const cell = ev.target && ev.target.closest
          ? ev.target.closest(".water-row:not(.head) .whour[data-wh-col]")
          : null;
        if (!cell || !body.contains(cell)) return;
        activateFrom(cell);
      });
      body.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        const cell = ev.target && ev.target.closest
          ? ev.target.closest(".water-row:not(.head) .whour[data-wh-col]")

                    '<span class="wp-tname" title="' + esc(tFull) + '">' + esc(tShow) + "</span>" +

    /* 連贏示意：由獨贏／位置合成三角矩陣；日後可換成真實 QIN／QPL 盤 */
    let qinMode = "qin"; /* qin=正Q；qpl=連贏位置 */
    function qinPairKey(a, b) {
      return a < b ? a + "-" + b : b + "-" + a;
    }
    function synthQinOdds(wa, wb) {
      const a = numOrNull(wa), b = numOrNull(wb);
      if (a == null || b == null) return null;
      let v = a * b * 0.26;
      if (v >= 999) return 999;
      if (v >= 100) return Math.round(v);
      if (v >= 20) return Math.round(v * 2) / 2;
      return Math.round(v * 10) / 10;
    }
    function synthQplOdds(pa, pb) {
      const a = numOrNull(pa), b = numOrNull(pb);
      if (a == null || b == null) return null;
      let v = a * b * 0.62;
      if (v >= 999) return 999;
      if (v >= 100) return Math.round(v);
      if (v >= 20) return Math.round(v * 2) / 2;
      return Math.round(v * 10) / 10;
    }
    function fmtQinOdds(v) {
      const n = numOrNull(v);
      if (n == null) return "—";
      if (n >= 100) return String(Math.round(n));
      if (Number.isInteger(n)) return String(n);
      return n.toFixed(1);
    }
    function synthQinIndex(odds) {
      const n = numOrNull(odds);
      if (n == null) return null;
      const raw = 98 - Math.log10(Math.max(n, 1.05)) * 14;
      return Math.max(70, Math.min(92, Math.round(raw)));
    }
    function qinDropClass(a, b, raceNum) {
      const seed = qinMode === "qpl" ? 7 : 0;
      const s = (a * 17 + b * 31 + (raceNum + seed) * 13) % 23;
      if (s === 0) return "drop50";
      if (s === 1 || s === 2) return "drop20";
      return "";
    }
    function qinIndexClass(idx) {
      const n = numOrNull(idx);
      if (n == null) return "";
      if (n >= 89) return "idx-b";
      if (n >= 87) return "idx-g";
      if (n >= 85) return "idx-r";
      return "";
    }
    function buildQinPairs() {
      let runners = currentRunners()
        .filter(function (r) { return numOrNull(r.no) != null; })
        .slice()
        .sort(function (a, b) { return a.no - b.no; });
      if (runners.length > QIN_MAX_N) runners = runners.slice(0, QIN_MAX_N);
      const nos = runners.map(function (r) { return r.no; });
      const byNo = {};
      const scratch = {};
      runners.forEach(function (r) {
        byNo[r.no] = r;
        if (r.scratched) scratch[r.no] = true;
      });
      const oddsMap = {};
      let hotKey = null;
      let hotOdds = Infinity;
      const useQpl = qinMode === "qpl";
      for (let i = 0; i < nos.length; i++) {
        for (let j = i + 1; j < nos.length; j++) {
          const a = nos[i], b = nos[j];
          const key = qinPairKey(a, b);
          if (scratch[a] || scratch[b]) {
            oddsMap[key] = null;
            continue;
          }
          const od = useQpl
            ? synthQplOdds(byNo[a].place, byNo[b].place)
            : synthQinOdds(byNo[a].win, byNo[b].win);
          oddsMap[key] = od;
          if (od != null && od < hotOdds) {
            hotOdds = od;
            hotKey = key;
          }
        }
      }
      return { nos: nos, oddsMap: oddsMap, hotKey: hotKey, mode: qinMode, scratch: scratch };
    }
    function qinHorseScratched(qin, no) {
      return !!(qin && qin.scratch && qin.scratch[no]);
    }
    function qinPairInvolvesScratch(qin, a, b) {
      return qinHorseScratched(qin, a) || qinHorseScratched(qin, b);
    }
    function renderQinModeSwitchBtn(extraClass) {
      const side = qinMode === "qpl" ? "qpl" : "qin";

      return (

          '" role="switch" aria-checked="' + (side === "qin" ? "true" : "false") +
          '" aria-label="連贏盤種：位置Q或正Q">' +
          '<span class="qin-sw-track" aria-hidden="true">' +
            '<span class="qin-sw-thumb"></span>' +
            '<span class="qin-sw-lab" data-qin-mode="qpl">位置Q</span>' +

    /* 單一矩陣：上三角＝賠率，下三角＝指數；角標開關切正Q／位置Q；首列「1」位為靜態指數 */
    function renderQinTable(qin) {
      const nos = qin.nos;
      const n = nos.length;
      const useQpl = qin.mode === "qpl";

      for (let j = 1; j < n; j++) {

        html += '<th class="qin-ch' + sc + '">' + esc(nos[j]) + "</th>";
      }
      html += "</tr></thead><tbody>";
      for (let i = 0; i < n; i++) {

        if (i === 0) {

          html += '<th class="qin-rh qin-idx-lab' + sc + '" scope="row">' +
            '<span class="qin-idx-inner">' +

            "</span></th>";
        } else {
          const sc = qinHorseScratched(qin, rowHorse) ? " scratch" : "";
          html += '<th class="qin-rh' + sc + '" scope="row">' + esc(rowHorse) + "</th>";
        }
        for (let j = 0; j < n; j++) {
          const colHorse = nos[j];
          if (i === j) {
            const sc = qinHorseScratched(qin, rowHorse) ? " scratch" : "";
            html += '<th class="qin-h' + sc + '">' + esc(rowHorse) + "</th>";
            continue;
          }
          const key = qinPairKey(rowHorse, colHorse);
          const scratched = qinPairInvolvesScratch(qin, rowHorse, colHorse);
          const od = scratched ? null : qin.oddsMap[key];
          if (j > i) {
            let cls = "qin-c";
            let text = "—";
            let attrs = ' data-qin-key="' + esc(key) + '" data-qin-kind="odds"';
            if (scratched) {
              cls += " scratch";
              attrs += ' data-qin-scratch="1" aria-disabled="true" aria-label="退出 ' + esc(key) + '"';
            } else {
              text = fmtQinOdds(od);
              if (key === qin.hotKey) cls += " hot";
              else {
                const drop = qinDropClass(rowHorse, colHorse, currentRace);
                if (drop) cls += " " + drop;
              }
              attrs += ' role="button" tabindex="0" aria-label="' + oddsLab + " " + esc(key) + '"';
            }
            html += '<td class="' + cls + '"' + attrs + ">" + esc(text) + "</td>";
          } else {
            let cls = "qin-c idx-cell";
            let text = "—";
            let attrs = ' data-qin-key="' + esc(key) + '" data-qin-kind="idx"';
            if (scratched) {
              cls += " scratch";
              attrs += ' data-qin-scratch="1" aria-disabled="true" aria-label="退出 ' + esc(key) + '"';
            } else {
              const idx = synthQinIndex(od);
              text = idx == null ? "—" : String(idx);
              const ic = qinIndexClass(idx);
              if (ic) cls += " " + ic;
              attrs += ' role="button" tabindex="0" aria-label="' + idxLab + " " + esc(key) + '"';
            }
            html += '<td class="' + cls + '"' + attrs + ">" + esc(text) + "</td>";
          }
        }
        html += "</tr>";
      }
      html += "</tbody></table></div></div>";
      return html;
    }
    function renderQinLegend() {
      const useQpl = qinMode === "qpl";
      return (
        '<div class="qin-legend">' +
          '<div class="qin-legend-main">' +
            '<div class="qin-legend-row">' +
              '<span class="lab">上三角</span>' +

    function renderQinPanelHtml() {

    function refreshQinPanel() {
      const panel = document.getElementById("qinPanel");
      const tbl = panel && panel.querySelector(".qin-tbl");
      if (!panel || !tbl || !el.boardMain) return;

      /* 就地改數值／按鈕態，不拆 qinX，避免 replace 瞬間撐高把整頁捲動上推 */
      const boardSt = el.board.scrollTop;
      const qinX = document.getElementById("qinX");
      const sl = qinX ? qinX.scrollLeft : 0;
      const st = qinX ? qinX.scrollTop : 0;
      const keepFocus = qinFocusKey;
      const active = document.activeElement;
      if (active && panel.contains(active) && typeof active.blur === "function") active.blur();

      const qin = buildQinPairs();
      const useQpl = qin.mode === "qpl";
      const oddsLab = useQpl ? "連贏位置" : "連贏";
      const idxLab = useQpl ? "位置指數" : "連贏指數";

      tbl.setAttribute("data-qin-mode", qin.mode || "qin");
      tbl.setAttribute("aria-label", oddsLab + "賠率（上三角）與" + idxLab + "（下三角）");

      const side = qinMode === "qpl" ? "qpl" : "qin";
      panel.querySelectorAll("button.qin-mode-switch").forEach(function (btn) {
        btn.setAttribute("data-qin-side", side);
        btn.setAttribute("aria-checked", side === "qin" ? "true" : "false");
      });

      tbl.querySelectorAll("td.qin-c[data-qin-key]").forEach(function (td) {
        const key = td.getAttribute("data-qin-key");
        const kind = td.getAttribute("data-qin-kind");
        const parts = String(key || "").split("-");
        const a = Number(parts[0]);
        const b = Number(parts[1]);
        const scratched = qinPairInvolvesScratch(qin, a, b);
        const keptFocus = !scratched && td.classList.contains("is-qin-focus");
        if (scratched) {
          td.className = "qin-c" + (kind === "idx" ? " idx-cell" : "") + " scratch";
          td.textContent = "—";
          td.setAttribute("data-qin-scratch", "1");
          td.setAttribute("aria-disabled", "true");
          td.setAttribute("aria-label", "退出 " + key);
          td.removeAttribute("role");
          td.removeAttribute("tabindex");
          return;
        }
        td.removeAttribute("data-qin-scratch");
        td.removeAttribute("aria-disabled");
        td.setAttribute("role", "button");
        td.setAttribute("tabindex", "0");
        const od = qin.oddsMap[key];
        if (kind === "odds") {
          let cls = "qin-c";
          if (key === qin.hotKey) cls += " hot";
          else {
            const drop = qinDropClass(a, b, currentRace);
            if (drop) cls += " " + drop;
          }
          if (keptFocus) cls += " is-qin-focus";
          td.className = cls;
          td.textContent = fmtQinOdds(od);
          td.setAttribute("aria-label", oddsLab + " " + key);
        } else {
          const idx = synthQinIndex(od);
          let cls = "qin-c idx-cell";
          const ic = qinIndexClass(idx);
          if (ic) cls += " " + ic;
          if (keptFocus) cls += " is-qin-focus";
          td.className = cls;
          td.textContent = idx == null ? "—" : String(idx);
          td.setAttribute("aria-label", idxLab + " " + key);
        }
      });

      /* 表頭／對角退出態隨資料刷新（換場後結構不變時） */
      const nos = qin.nos || [];
      tbl.querySelectorAll("th.qin-ch").forEach(function (th, idx) {
        const no = nos[idx + 1];
        th.classList.toggle("scratch", qinHorseScratched(qin, no));
      });
      const idxLabTh = tbl.querySelector("th.qin-rh.qin-idx-lab");
      if (idxLabTh) {
        const no0 = nos[0];
        idxLabTh.classList.toggle("scratch", qinHorseScratched(qin, no0));
        const noEl = idxLabTh.querySelector(".qin-idx-no");
        if (noEl && no0 != null) noEl.textContent = String(no0);
      }
      tbl.querySelectorAll("th.qin-rh:not(.qin-idx-lab)").forEach(function (th, idx) {
        const no = nos[idx + 1];
        th.classList.toggle("scratch", qinHorseScratched(qin, no));
      });
      tbl.querySelectorAll("th.qin-h").forEach(function (th, idx) {
        const no = nos[idx];
        th.classList.toggle("scratch", qinHorseScratched(qin, no));
      });

      const legend = panel.querySelector(".qin-legend");
      if (legend) {
        const wrap = document.createElement("div");
        wrap.innerHTML = renderQinLegend();
        if (wrap.firstElementChild) legend.replaceWith(wrap.firstElementChild);
      }

      if (qinX) {
        qinX.scrollLeft = sl;
        qinX.scrollTop = st;
      }
      el.board.scrollTop = boardSt;
      qinFocusKey = keepFocus;
      if (keepFocus) setQinPairFocus(keepFocus, tbl);

    function setQinMode(mode) {

    function bindQinModeSwitch() {

      function toggleQinMode(ev) {

    /* 連贏格寬規矩：
       - 任何時候（含字體縮放後）首列與各數據列等寬均分
       - ≤14 匹：等分鋪滿可用寬
       - >14 匹：鎖定首行／首列，橫滑看其餘；列寬仍等寬（按 14 匹＋首列密度） */
    function fitQinTableWidths() {
      const panel = document.getElementById("qinPanel");
      const tbl = panel && panel.querySelector(".qin-tbl");
      const qinX = document.getElementById("qinX");
      if (!panel || !tbl) return;
      const n = Number(tbl.getAttribute("data-n") || 0);
      if (n < 2) return;
      const colCount = n + 1; /* 首列馬號 + n 匹 */
      const avail = Math.max(panel.clientWidth, 200);
      let cell;
      let total;
      if (n <= QIN_FIT_N) {
        cell = avail / colCount;
        total = avail;
      } else {
        cell = Math.max(1, Math.floor(avail / (QIN_FIT_N + 1)));
        total = cell * colCount;
      }
      const titleW = cell; /* 與數據列同寬 */
      panel.style.setProperty("--qin-title-w", titleW + "px");
      panel.style.setProperty("--qin-cell", cell + "px");
      tbl.style.width = total + "px";
      tbl.style.minWidth = total + "px";
      const fs = cell >= 28 ? 12 : cell >= 24 ? 11 : 10;
      tbl.style.fontSize = fs + "px";
      if (qinX) {
        /* 約鎖 14 列可視高度，超出（如 20 匹）在格內豎滑，首行 sticky 才會生效 */
        const rowsVisible = Math.min(n, QIN_FIT_N);

    /* 輕點連贏格：同座標賠率／指數雙邊高亮提醒 */
    let qinFocusKey = "";

      if (!nodes.length) return;
      nodes.forEach(function (el) { el.classList.add("is-qin-focus"); });

    function bindQinPairFocus() {
      const tbl = document.querySelector("#qinPanel .qin-tbl");
      const qinX = document.getElementById("qinX");
      if (!tbl) return;
      if (qinFocusKey) setQinPairFocus(qinFocusKey, tbl);
      if (tbl.dataset.focusBound === "1") return;
      tbl.dataset.focusBound = "1";
      let tapMoved = false;
      if (qinX) {
        qinX.addEventListener("touchstart", function () { tapMoved = false; }, { passive: true });
        qinX.addEventListener("touchmove", function () { tapMoved = true; }, { passive: true });
      }
      function onActivate(cell) {
        if (!cell) return;
        if (cell.getAttribute("data-qin-scratch") === "1" || cell.classList.contains("scratch")) return;
        const key = cell.getAttribute("data-qin-key");
        if (!key) return;
        if (qinFocusKey === key) clearQinPairFocus(tbl);
        else setQinPairFocus(key, tbl);

      tbl.addEventListener("click", function (ev) {
        if (tapMoved) return;
        const cell = ev.target && ev.target.closest ? ev.target.closest("td.qin-c[data-qin-key]") : null;
        if (!cell || !tbl.contains(cell)) return;

    /* 豎向觸邊 1:1 帶頁；松手短慣性且可被新觸摸立刻打斷；橫向觸邊只擋回彈 */
    function bindQinOverscrollGuard() {
      const qinX = document.getElementById("qinX");
      const wrap = el.board;
      if (!qinX || !wrap || qinX.dataset.overscrollBound === "1") return;
      qinX.dataset.overscrollBound = "1";

      let startX = 0;
      let startY = 0;
      let lastY = 0;
      let axis = "";
      let samples = [];
      let wrapInertiaRaf = 0;
      let inertiaVel = 0;
      const DECEl = 0.994;

      function stopWrapInertia() {
        if (!wrapInertiaRaf) return;
        cancelAnimationFrame(wrapInertiaRaf);
        wrapInertiaRaf = 0;
        inertiaVel = 0;
      }

      function pushSample(y, t) {
        samples.push({ y: y, t: t });
        while (samples.length > 1 && t - samples[0].t > 80) samples.shift();
      }

      function sampleFingerVel() {
        if (samples.length < 2) return 0;
        const a = samples[0];
        const b = samples[samples.length - 1];
        const dt = b.t - a.t;
        if (dt < 12) return 0;
        return (b.y - a.y) / dt;
      }

      function startWrapInertia(fingerVelY) {
        stopWrapInertia();
        let v = fingerVelY;
        if (v > 2.2) v = 2.2;
        else if (v < -2.2) v = -2.2;
        if (Math.abs(v) < 0.08) return;
        inertiaVel = v;
        let prev = performance.now();
        function step(now) {
          const dt = Math.min(34, Math.max(0, now - prev));
          prev = now;
          v *= Math.pow(DECEl, dt);
          inertiaVel = v;
          wrap.scrollTop -= v * dt;
          if (Math.abs(v) > 0.04) wrapInertiaRaf = requestAnimationFrame(step);
          else {
            wrapInertiaRaf = 0;
            inertiaVel = 0;
          }
        }
        wrapInertiaRaf = requestAnimationFrame(step);
      }

      wrap.addEventListener("touchstart", stopWrapInertia, { passive: true, capture: true });
      wrap.addEventListener("pointerdown", stopWrapInertia, { passive: true, capture: true });

        startX = ev.touches[0].clientX;
        startY = ev.touches[0].clientY;
        lastY = startY;
        pushSample(startY, performance.now());
      }, { passive: true });

      qinX.addEventListener("touchmove", function (ev) {
        if (!ev.touches || !ev.touches[0]) return;
        const x = ev.touches[0].clientX;
        const y = ev.touches[0].clientY;
        const now = performance.now();
        const dx = x - startX;
        const dy = y - startY;
        const deltaY = y - lastY;
        lastY = y;
        pushSample(y, now);

        /* 慣性進行中一旦再拖，立刻交出控制權 */
        if (wrapInertiaRaf) stopWrapInertia();

        if (!axis) {
          if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
          axis = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
        }

        const maxL = Math.max(0, qinX.scrollWidth - qinX.clientWidth);
        const maxT = Math.max(0, qinX.scrollHeight - qinX.clientHeight);
        const sl = qinX.scrollLeft;
        const st = qinX.scrollTop;

        if (axis === "h") {

        const atBottom = st >= maxT - 0.5;

        }

      }, { passive: true });

      return f.session === "night" ? "19:15" : "13:00";
    }
    function formatFixtureMetaLine(f) {
      if (!f || !f.date) return "該日暫無賽事";
      const p = String(f.date).split("-");
      const md = (p.length === 3)
        ? (String(Number(p[2])) + "/" + String(Number(p[1])))
        : "";
      const wd = (p.length === 3)
        ? (WEEKDAY_SHORT[new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay()] || "")
        : "";
      const time = defaultFixtureTime(f);
      if (f.region || f.venueLabel) {
        return [md, wd, time, f.venueLabel || f.venue || "外地", f.track || "草地", f.klass || "—", (f.dist || "").toString().replace(/米$/, ""), f.going || "—"]
          .filter(function (x) { return x != null && String(x).trim() !== ""; })
          .join(" ");
      }
      const trackRaw = f.track || (f.course === "ST" && f.session === "night" ? "全天候" : "草地");
      let surface = trackRaw;
      if (trackRaw === "草地") {
        surface = (f.course === "HV") ? "谷草" : "田草";
      }
      const klass = f.klass || "";
      const dist = (f.dist || "").toString().replace(/米$/, "");
      const going = f.going || (trackRaw === "全天候" ? "封地" : "好地");
      return [md, wd, time, surface, klass, dist, going]
        .filter(function (x) { return x != null && String(x).trim() !== ""; })
        .join(" ");
    }
    /* 由已載入會議首場整理成 j18 場次信息樣式 */
    function formatMeetingRaceMetaLine(meet, race) {
      return formatRaceInfoLine(meet && meet.date, race, meet);
    }
    function nearestFixtureDate(fromIso) {
      const dates = [];
      const seen = {};
      activeFixtureList().forEach(function (f) {
        if (!seen[f.date]) { seen[f.date] = 1; dates.push(f.date); }
      });
      dates.sort();
      if (!dates.length) return fromIso || null;
      const today = fromIso || new Date().toISOString().slice(0, 10);
      let best = dates[0];
      for (let i = 0; i < dates.length; i++) {
        if (dates[i] <= today) best = dates[i];
        else break;
      }
      return best;
    }

    function renderRaceCalendar() {
      const title = document.getElementById("raceCalTitle");
      const grid = document.getElementById("raceCalGrid");
      if (!grid) return;
      if (title) title.textContent = raceCalViewY + "年" + raceCalViewM + "月";
      syncCalScopeSwitch();
      if (raceCalPreviewActive) previewSelectedFixtureMeta();
      const first = new Date(raceCalViewY, raceCalViewM - 1, 1);
      const startPad = first.getDay(); /* 0=Sun */
      const daysInMonth = new Date(raceCalViewY, raceCalViewM, 0).getDate();
      const prevDays = new Date(raceCalViewY, raceCalViewM - 1, 0).getDate();
      let html = "";
      const total = 42;
      for (let i = 0; i < total; i++) {
        let y = raceCalViewY, m = raceCalViewM, d, mute = false;
        if (i < startPad) {
          d = prevDays - startPad + i + 1;
          m = raceCalViewM - 1;
          if (m < 1) { m = 12; y -= 1; }
          mute = true;
        } else if (i >= startPad + daysInMonth) {
          d = i - (startPad + daysInMonth) + 1;
          m = raceCalViewM + 1;
          if (m > 12) { m = 1; y += 1; }
          mute = true;
        } else {
          d = i - startPad + 1;
        }
        const iso = y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        const list = mute ? [] : fixturesOnDate(iso);
        const isRace = list.length > 0;
        const sel = iso === raceCalSelected;
        const marks = list.map(function (f) {
          return '<i class="' + fixtureMarkClass(f) + '"></i>';
        }).join("");
        html += '<button type="button" class="cal-cell' +
          (mute ? " mute" : "") +
          (isRace ? " race" : "") +
          (sel ? " is-selected" : "") +
          '" data-iso="' + iso + '"' +
          (isRace ? "" : " disabled") +
          '><span class="d">' + d + '</span><span class="marks">' + marks + "</span></button>";
      }
      grid.innerHTML = html;
      grid.querySelectorAll(".cal-cell.race").forEach(function (btn) {
        btn.addEventListener("click", function () {
          raceCalSelected = btn.getAttribute("data-iso");
          syncMenuRaceDate();
          previewSelectedFixtureMeta();
          renderRaceCalendar();
        });
      });
    }

    function boardOverlayAnchorTop() {
      /* fixed 彈層用視口座標。insight／膠囊不 zoom，以其底邊＝馬匹列表頂；
         勿用 #boardMain.getBoundingClientRect().top（CSS zoom 放大後會偏高遮住膠囊）。 */
      const pin = document.getElementById("insightPin");
      if (pin) return Math.max(0, Math.round(pin.getBoundingClientRect().bottom));
      const main = (el && el.boardMain) || document.getElementById("boardMain");
      if (!main) return 0;
      let y = 0;
      let n = main;
      while (n) {

        n = n.offsetParent;

      return Math.max(0, Math.round(y));

    function pairCombo(a, b, ordered) {
      if (a == null || b == null) return "";
      if (ordered) return String(a) + "," + String(b);
      const xs = [Number(a), Number(b)].sort(function (x, y) { return x - y; });
      return xs[0] + "," + xs[1];
    }
    function trioCombo(a, b, c, ordered) {
      if (a == null || b == null || c == null) return "";
      if (ordered) return [a, b, c].join(",");
      return [Number(a), Number(b), Number(c)].sort(function (x, y) { return x - y; }).join(",");
    }
    function quartetCombo(a, b, c, d, ordered) {
      if (a == null || b == null || c == null || d == null) return "";
      if (ordered) return [a, b, c, d].join(",");
      return [Number(a), Number(b), Number(c), Number(d)].sort(function (x, y) { return x - y; }).join(",");
    }
    /* 派彩表區塊：優先 race.dividends；否則按名次生成演示彩池（對齊馬會常見排列） */
    function buildPayoutDetailSections(race) {
      if (race && Array.isArray(race.dividends) && race.dividends.length) {
        const map = {};
        const order = [];
        race.dividends.forEach(function (d) {
          if (!d || !d.pool) return;
          const key = String(d.pool);
          if (!map[key]) {
            map[key] = { pool: key, rows: [] };
            order.push(key);
          }
          map[key].rows.push({
            combo: d.combo != null ? String(d.combo) : (d.combination != null ? String(d.combination) : "—"),
            pay: d.pay != null ? d.pay : d.dividend
          });
        });
        return order.map(function (k) { return map[k]; }).filter(function (s) { return s.rows.length; });
      }
      const nos = payoutFinishNosForRace(race).map(function (n) { return String(n); });
      if (!nos.length) return [];
      const a = nos[0];
      const b = nos[1];
      const c = nos[2];
      const d = nos[3];
      const sections = [];
      sections.push({ pool: "獨贏", rows: [{ combo: a, pay: 118.5 }] });
      if (b && c) {
        sections.push({
          pool: "位置",
          rows: [
            { combo: a, pay: 28 },
            { combo: b, pay: 15.5 },
            { combo: c, pay: 16 }
          ]
        });
      }
      if (b) {
        sections.push({ pool: "連贏", rows: [{ combo: pairCombo(a, b, false), pay: 205.5 }] });
      }
      if (b && c) {
        sections.push({
          pool: "位置Q",
          rows: [
            { combo: pairCombo(a, b, false), pay: 75 },
            { combo: pairCombo(a, c, false), pay: 63.5 },
            { combo: pairCombo(b, c, false), pay: 31.5 }
          ]
        });
        sections.push({ pool: "二重彩", rows: [{ combo: pairCombo(a, b, true), pay: 539 }] });
        sections.push({ pool: "三重彩", rows: [{ combo: trioCombo(a, b, c, false), pay: 1597 }] });
        sections.push({ pool: "單T", rows: [{ combo: trioCombo(a, b, c, true), pay: 182 }] });
      }
      if (b && c && d) {
        sections.push({ pool: "四連環", rows: [{ combo: quartetCombo(a, b, c, d, false), pay: 601 }] });
        sections.push({ pool: "四重彩", rows: [{ combo: quartetCombo(a, b, c, d, true), pay: 15907 }] });
      }
      return sections;
    }
    function renderPayoutDetailBody() {
      const body = document.getElementById("payoutDetailBody");
      if (!body) return;
      const race = currentMeet();
      const sections = buildPayoutDetailSections(race);
      if (!sections.length) {
        body.innerHTML = '<div class="payout-detail-empty">暫無派彩資料</div>';
        return;
      }
      let rowsHtml = "";
      sections.forEach(function (sec) {
        const n = sec.rows.length;
        sec.rows.forEach(function (row, i) {
          rowsHtml += "<tr>";
          if (i === 0) {

          rowsHtml += '<td class="payout-combo">' + esc(row.combo) + "</td>";

      });
      body.innerHTML =
        '<table class="payout-tbl" aria-label="派彩結果">' +
          "<thead><tr><th>彩池</th><th>勝出組合</th><th>派彩</th></tr></thead>" +

        "</table>";

    function colSortListHtml(keys, side) {

    function syncColSortArrowState() {
      const up = document.getElementById("colSortUp");
      const down = document.getElementById("colSortDown");

      const right = document.getElementById("colSortRight");
      const pick = colSortPick;
      const visIdx = pick && pick.side === "vis" ? visibleScrollKeys.indexOf(pick.key) : -1;
      const hidIdx = pick && pick.side === "hid" ? hiddenScrollKeys.indexOf(pick.key) : -1;
      if (up) up.disabled = !(pick && pick.side === "vis" && visIdx > 0);
      if (down) down.disabled = !(pick && pick.side === "vis" && visIdx >= 0 && visIdx < visibleScrollKeys.length - 1);
      if (left) left.disabled = !(pick && pick.side === "vis" && visIdx >= 0);

    function moveColToHidden() {
      if (!colSortPick || colSortPick.side !== "vis") return;
      const key = colSortPick.key;
      const i = visibleScrollKeys.indexOf(key);
      if (i < 0) return;
      visibleScrollKeys.splice(i, 1);
      if (hiddenScrollKeys.indexOf(key) < 0) hiddenScrollKeys.push(key);
      colSortPick = { side: "hid", key: key };

    function moveColToVisible() {
      if (!colSortPick || colSortPick.side !== "hid") return;
      const key = colSortPick.key;
      const i = hiddenScrollKeys.indexOf(key);
      if (i < 0) return;
      hiddenScrollKeys.splice(i, 1);
      if (visibleScrollKeys.indexOf(key) < 0) visibleScrollKeys.push(key);
      colSortPick = { side: "vis", key: key };
      applyColLayoutAndRefresh();
    }
    function moveColVisible(delta) {
      if (!colSortPick || colSortPick.side !== "vis") return;
      const i = visibleScrollKeys.indexOf(colSortPick.key);
      if (i < 0) return;
      const j = i + delta;
      if (j < 0 || j >= visibleScrollKeys.length) return;
      const tmp = visibleScrollKeys[i];
      visibleScrollKeys[i] = visibleScrollKeys[j];
      visibleScrollKeys[j] = tmp;
      applyColLayoutAndRefresh();

      const overlay = document.getElementById("raceCalOverlay");
      const sheet = document.getElementById("raceCalSheet");
      const prev = document.getElementById("raceCalPrev");
      const next = document.getElementById("raceCalNext");
      const closeBtn = document.getElementById("raceCalClose");
      if (prev) prev.addEventListener("click", function (ev) {
        ev.preventDefault();
        raceCalViewM -= 1;
        if (raceCalViewM < 1) { raceCalViewM = 12; raceCalViewY -= 1; }
        renderRaceCalendar();
      });
      if (next) next.addEventListener("click", function (ev) {
        ev.preventDefault();
        raceCalViewM += 1;
        if (raceCalViewM > 12) { raceCalViewM = 1; raceCalViewY += 1; }
        renderRaceCalendar();
      });
      if (closeBtn) closeBtn.addEventListener("click", function (ev) {
        ev.preventDefault();
        closeRaceDateCalendar();
      });
      const scopeBtn = document.getElementById("raceCalScopeSwitch");
      if (scopeBtn) {
        scopeBtn.addEventListener("click", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          raceCalScope = raceCalScope === "hk" ? "os" : "hk";
          /* 切換範圍後，選日對齊該範圍最近有賽事之日 */
          const keep = raceCalSelected;
          if (!fixturesOnDate(keep).length) {
            raceCalSelected = nearestFixtureDate(keep || (MEETING && MEETING.date) || null);
          }
          syncMenuRaceDate();
          renderRaceCalendar();
          if (raceCalPreviewActive) previewSelectedFixtureMeta();
        });
      }
      if (overlay) {
        overlay.addEventListener("click", function (ev) {
          if (ev.target === overlay) closeRaceDateCalendar();
        });
      }
      if (sheet) sheet.addEventListener("click", function (ev) { ev.stopPropagation(); });
      /* Escape 統一由頂欄菜單處理鏈接管，避免未打開時誤 close＋重載會議 */
      window.addEventListener("resize", function () {
        const ov = document.getElementById("raceCalOverlay");
        if (ov && !ov.hasAttribute("hidden")) syncRaceCalOverlayTop();
      });
    }
    bindRaceDateCalendar();

    (function bindTopbarMenu() {
      const btn = document.getElementById("navMenuBtn");
      const menu = document.getElementById("navMenu");
      const back = document.getElementById("navBack");
      if (!btn || !menu) return;
      const themeSwitch = document.getElementById("themeSwitch");
      const themeLabLight = document.getElementById("themeLabLight");
      const themeLabDark = document.getElementById("themeLabDark");
      const THEME_KEY = "j18-racecard-theme";
      function currentTheme() {
        return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      }
      function syncThemeSwitch() {
        const dark = currentTheme() === "dark";
        if (themeSwitch) {
          themeSwitch.setAttribute("aria-pressed", dark ? "true" : "false");
          themeSwitch.setAttribute("aria-label", dark ? "切換淺色模式" : "切換深色模式");
        }
        if (themeLabLight) themeLabLight.classList.toggle("is-on", !dark);
        if (themeLabDark) themeLabDark.classList.toggle("is-on", dark);
      }
      function setTheme(mode) {
        const dark = mode === "dark";
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
        else document.documentElement.removeAttribute("data-theme");
        try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (e) {}
        syncThemeSwitch();
      }
      function toggleTheme() {
        setTheme(currentTheme() === "dark" ? "light" : "dark");
      }
      syncThemeSwitch();
      if (themeSwitch) {
        themeSwitch.addEventListener("click", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          toggleTheme();
        });
      }
      /* 列表縮放：每級 +10px／100px＝+10%，最多 2 級；復原回 0 */
      const LIST_ZOOM_MAX = 2;
      const LIST_ZOOM_STEP_PX = 10;
      let listZoomLevel = 0;
      function listZoomFactor(level) {
        return 1 + (Number(level) || 0) * (LIST_ZOOM_STEP_PX / 100);
      }
      function syncZoomButtons() {
        menu.querySelectorAll("[data-zoom-step]").forEach(function (b) {
          const step = Number(b.getAttribute("data-zoom-step"));
          if (step === 0) b.disabled = listZoomLevel === 0;
          else if (step < 0) b.disabled = listZoomLevel <= 0;
          else b.disabled = listZoomLevel >= LIST_ZOOM_MAX;
        });
      }
      function applyListZoom() {
        const z = listZoomFactor(listZoomLevel);
        const targets = [
          document.getElementById("boardMain"),
          document.getElementById("waterSheetZoom")
        ];
        targets.forEach(function (node) {
          if (!node) return;
          node.style.setProperty("--list-zoom", String(z));
          /* 部分 WebKit 對 CSS 變數 zoom 支援不穩，同步寫入 */
          try { node.style.zoom = String(z); } catch (e) {}
        });
        syncZoomButtons();
        fitScrollColWidths();
        fitQinTableWidths();
        syncHeadScrollLeft();
        /* zoom 改變後立刻重算表頭 sticky top（÷ zoom） */
        if (typeof syncInsightStickyHeight === "function") {
          syncInsightStickyHeight();
          requestAnimationFrame(function () {
            syncInsightStickyHeight();
          });
        }
        /* 殼／fixed 彈層不 zoom；放大後按 insight 底邊重鎖（避開 boardMain zoom 量測偏差） */
        function resyncZoomAnchors() {
          if (isWaterSheetOpen()) syncWaterSheetTop();
          if (typeof isSpeedMapSheetOpen === "function" && isSpeedMapSheetOpen()) syncSpeedMapSheetTop();
          syncOpenBoardOverlaysTop();
        }
        resyncZoomAnchors();
        requestAnimationFrame(function () {
          resyncZoomAnchors();
          requestAnimationFrame(resyncZoomAnchors);
        });
      }
      function setListZoomLevel(next) {
        const n = Math.max(0, Math.min(LIST_ZOOM_MAX, Number(next) || 0));
        if (n === listZoomLevel) {
          syncZoomButtons();
          return;
        }
        listZoomLevel = n;
        applyListZoom();
      }
      function setOpen(on) {
        if (on) {
          menu.removeAttribute("hidden");
          btn.setAttribute("aria-expanded", "true");
          syncZoomButtons();
          syncThemeSwitch();
        } else {
          menu.setAttribute("hidden", "");
          btn.setAttribute("aria-expanded", "false");
        }
      }
      function isOpen() {
        return btn.getAttribute("aria-expanded") === "true";
      }
      btn.addEventListener("click", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        setOpen(!isOpen());
      });
      menu.addEventListener("click", function (ev) {
        const zoomBtn = ev.target && ev.target.closest ? ev.target.closest("[data-zoom-step]") : null;
        if (zoomBtn && menu.contains(zoomBtn)) {
          ev.preventDefault();
          ev.stopPropagation();
          const step = Number(zoomBtn.getAttribute("data-zoom-step"));
          if (step === 0) setListZoomLevel(0);
          else setListZoomLevel(listZoomLevel + step);
          return;
        }
        const item = ev.target && ev.target.closest ? ev.target.closest("button[data-nav]") : null;
        if (!item || !menu.contains(item)) return;
        ev.preventDefault();
        setOpen(false);
        /* 示意：先關閉菜單；日後可接路由／彈層 */
        const act = item.getAttribute("data-nav");
        if (act === "raceDate") {
          openRaceDateCalendar();
        } else if (act === "tipRecord") {
          openTipRecordSheet();
        } else if (act === "colSort") {
          openColSortSheet();
        } else if (act === "service") {
          const anno = document.querySelector(".anno");
          if (anno && typeof anno.scrollIntoView === "function") {
            anno.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        } else if (act === "demoOddsTick") {
          simulateOddsTickRefresh();
        }
      });
      /* 點擊菜單外任意位置（含水位彈窗）立即收回；capture 以免被 stopPropagation 擋住 */
      function closeMenuIfOutside(ev) {
        if (!isOpen()) return;
        const t = ev.target;
        if (btn.contains(t) || menu.contains(t)) return;
        setOpen(false);
      }
      document.addEventListener("pointerdown", closeMenuIfOutside, true);
      document.addEventListener("click", closeMenuIfOutside, true);
      if (back) {
        back.addEventListener("click", function () {
          setOpen(false);
          if (window.history.length > 1) window.history.back();
        });
      }
      /* 現場直播／收音機：入口預留；電視圖標暫以點按切換有／無訊號示意 */
      const liveTv = document.getElementById("navLiveTv");
      const radio = document.getElementById("navRadio");
      if (liveTv) {
        liveTv.addEventListener("click", function (ev) {
          ev.preventDefault();
          setOpen(false);
          const on = liveTv.getAttribute("data-signal") === "on";
          const next = on ? "off" : "on";
          liveTv.setAttribute("data-signal", next);
          liveTv.setAttribute("aria-pressed", next === "on" ? "true" : "false");
          const label = next === "on" ? "現場直播，有訊號" : "現場直播，無訊號";
          liveTv.setAttribute("aria-label", label);
          liveTv.title = (next === "on" ? "現場直播（有訊號）" : "現場直播（無訊號）") + "· 點按切換";
        });
      }
      if (radio) {
        radio.addEventListener("click", function (ev) {
          ev.preventDefault();
          setOpen(false);
          const on = radio.getAttribute("data-signal") === "on";
          const next = on ? "off" : "on";
          radio.setAttribute("data-signal", next);
          radio.setAttribute("aria-pressed", next === "on" ? "true" : "false");
          radio.setAttribute("aria-label", next === "on" ? "收音機，有訊號" : "收音機，無訊號");
          radio.title = (next === "on" ? "收音機（有訊號）" : "收音機（無訊號）") + "· 點按切換";
        });
      }
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape") {
          if (isOpen()) {
            setOpen(false);
            btn.focus();
            return;
          }
          if (typeof isRaceDateCalendarOpen === "function" && isRaceDateCalendarOpen()) {
            closeRaceDateCalendar();
            return;
          }
          const payOv = document.getElementById("payoutDetailOverlay");
          if (payOv && !payOv.hasAttribute("hidden")) {
            closePayoutDetail();
            return;
          }
          if (isWaterSheetOpen()) {
            closeWaterSheet();
            return;
          }
          const colOv = document.getElementById("colSortOverlay");
          if (colOv && !colOv.hasAttribute("hidden")) {
            closeColSortSheet();
            return;
          }
          const revOv = document.getElementById("synthReviewOverlay");
          if (revOv && !revOv.hasAttribute("hidden")) {
            closeSynthReviewSheet();
            return;
          }
          if (typeof isSpeedMapSheetOpen === "function" && isSpeedMapSheetOpen()) {
            closeSpeedMapSheet();
            return;
          }
          const jtOv = document.getElementById("jtCollabOverlay");
          if (jtOv && !jtOv.hasAttribute("hidden")) {
            closeJtCollabSheet();
            return;
          }
          const tipOv = document.getElementById("tipRecordOverlay");
          if (tipOv && !tipOv.hasAttribute("hidden")) {
            closeTipRecordSheet();
            return;
          }
          const famOv = document.getElementById("famousTipsOverlay");
          if (famOv && !famOv.hasAttribute("hidden")) {
            closeFamousTipsSheet();
            return;
          }
          closeHorseSheet();
        }
      });
      syncZoomButtons();
      /* renderBoard 重繪後重算欄寬（縮放仍掛在 #boardMain） */
      const main = document.getElementById("boardMain");
      if (main) {
        const mo = new MutationObserver(function () {
          if (listZoomLevel > 0) {
            fitScrollColWidths();
            fitQinTableWidths();
            syncHeadScrollLeft();
            if (typeof syncInsightStickyHeight === "function") syncInsightStickyHeight();
          }
        });
        mo.observe(main, { childList: true });
      }
    })();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { renderBoard(); });
    }
    window.addEventListener("resize", function () {
      fitQinTableWidths();
      syncHeadScrollLeft();
    });
  })();
  </script>
</body>
</html>

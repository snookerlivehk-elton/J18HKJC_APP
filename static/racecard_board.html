<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("j18-racecard-theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="noindex" />
  <title>排位 · J18</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav: #3d5a80;
      --nav-2: #334b6b;
      --page: #eef1f5;
      --text: #2c3340;
      --muted: #8a93a3;
      --blue: #5ba3d9;
      --blue-2: #3b8fd4;
      --green: #5cb85c;
      --yellow: #d4a017;
      --orange: #e88b2a;
      --red: #e74c3c;
      --place: #27ae60;
      --line: #e4e7ec;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      /* 左鎖兩欄：馬號上馬名下；獨贏上位置下左、檔位豎排右 */
      --pin-id: 94px;
      --pin-odds: 58px;
      --pin-w: calc(var(--pin-id) + var(--pin-odds));
      --head-fs: 13px;
      /* 右滑列規則：最長數據到分隔線固定 2px（JS COL_FIT 同步） */
      --scroll-col-gap: 2px;
      --scroll-col-rule: 1px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      overflow: hidden;
      background: #d8dee6; color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex; flex-direction: column;
      max-width: 430px; margin: 0 auto;
      background: var(--page);
      min-height: 100%;
      box-shadow: 0 0 0 1px rgba(45,62,80,.12);
    }
    button { font-family: inherit; }

    .topbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      /* 須 ≥ 媒體按鈕 55px，否則頂／底邊會横切電視／收音機圖標 */
      height: 56px; padding: 0 10px;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff; z-index: 60;
      position: relative;
      overflow: visible;
    }
    .topbar .side {
      min-width: 72px;
      font-size: 15px;
      font-weight: 700;
    }
    .topbar .side.l {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      justify-content: flex-start;
    }
    .topbar .side.r {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      text-align: right;
    }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .06em; }
    .topbar .nav-back,
    .topbar .nav-famous,
    .topbar .nav-menu-btn,
    .topbar .nav-media {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin: 0;
      padding: 6px 4px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar .side.l .nav-back {
      margin-left: 2px;
      padding: 6px 6px;
      flex: 0 0 auto;
    }
    .topbar .nav-famous {
      letter-spacing: .04em;
      padding: 6px 8px;
    }
    .topbar .nav-media {
      width: 55px;
      height: 55px;
      padding: 0;
      flex: 0 0 auto;
    }
    .topbar .nav-live-tv {
      margin-left: -10px;
    }
    .topbar .nav-radio {
      margin-left: -16px;
    }
    .topbar .nav-media svg {
      display: block;
      width: 41px;
      height: 41px;
    }
    /* 電視機螢幕：無訊號雪花／有訊號站內色輪跳 */
    .nav-live-tv .tv-snow-layer { display: none; }
    .nav-live-tv .tv-lcd-signal { display: none; }
    .nav-live-tv[data-signal="off"] .tv-snow-layer { display: block; }
    .nav-live-tv[data-signal="on"] .tv-lcd-signal {
      display: block;
      animation: tv-signal-cycle 2.4s steps(1) infinite;
    }
    .nav-live-tv[data-signal="off"] .tv-snow-pat-a {
      animation: tv-snow-shift-a 0.16s steps(4) infinite;
    }
    .nav-live-tv[data-signal="off"] .tv-snow-pat-b {
      animation: tv-snow-shift-b 0.11s steps(3) infinite;
    }
    .nav-live-tv[data-signal="off"] .tv-snow-flick {
      animation: tv-snow-flick 0.18s steps(2) infinite;
    }
    @keyframes tv-snow-shift-a {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1.1px, 0.5px); }
      50% { transform: translate(0.7px, -0.8px); }
      75% { transform: translate(-0.5px, 0.6px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes tv-snow-shift-b {
      0% { transform: translate(0, 0); }
      33% { transform: translate(0.9px, -0.6px); }
      66% { transform: translate(-0.8px, 0.7px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes tv-snow-flick {
      0%, 100% { opacity: .92; }
      50% { opacity: .72; }
    }
    @keyframes tv-signal-cycle {
      0% { fill: var(--red); }
      25% { fill: var(--blue); }
      50% { fill: var(--yellow); }
      75% { fill: var(--green); }
    }
    /* 收音機錶盤：無訊號灰斜杠／有訊號綠燈呼吸 */
    .nav-radio .radio-sig-off { display: none; }
    .nav-radio .radio-sig-on { display: none; }
    .nav-radio[data-signal="off"] .radio-sig-off { display: block; }
    .nav-radio[data-signal="on"] .radio-sig-on { display: block; }
    .nav-radio[data-signal="on"] .radio-led {
      transform-box: fill-box;
      transform-origin: center;
      animation: radio-led-breathe 1.35s ease-in-out infinite;
    }
    @keyframes radio-led-breathe {
      0%, 100% { opacity: .4; transform: scale(.92); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    @media (prefers-reduced-motion: reduce) {
      .nav-live-tv[data-signal="off"] .tv-snow-pat-a,
      .nav-live-tv[data-signal="off"] .tv-snow-pat-b,
      .nav-live-tv[data-signal="off"] .tv-snow-flick,
      .nav-live-tv[data-signal="on"] .tv-lcd-signal,
      .nav-radio[data-signal="on"] .radio-led {
        animation: none;
      }
      .nav-live-tv[data-signal="on"] .tv-lcd-signal { fill: var(--blue); }
      .nav-radio[data-signal="on"] .radio-led { opacity: 1; transform: none; }
    }
    .topbar .nav-back:active,
    .topbar .nav-famous:active,
    .topbar .nav-menu-btn:active,
    .topbar .nav-menu-btn[aria-expanded="true"],
    .topbar .nav-media:active {
      background: rgba(255, 255, 255, .14);
    }
    .topbar .nav-back .chev {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      margin-top: -1px;
    }
    .topbar .nav-menu-btn .lab { letter-spacing: .04em; }
    .topbar .nav-menu-btn .caret {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      opacity: .95;
      transition: transform .18s ease;
    }
    .topbar .nav-menu-btn[aria-expanded="true"] .caret {
      transform: rotate(180deg);
    }
    .topbar-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 70;
      min-width: 168px;
      padding: 6px 0;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      box-shadow: 0 10px 28px rgba(45, 62, 80, .22), 0 0 0 1px rgba(45, 62, 80, .08);
      transform-origin: top right;
      animation: topbarMenuIn .16s ease-out;
    }
    .topbar-menu[hidden] { display: none; }
    @keyframes topbarMenuIn {
      from { opacity: 0; transform: translateY(-4px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .topbar-menu { animation: none; }
      .topbar .nav-menu-btn .caret { transition: none; }
    }
    .topbar-menu button {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 0;
      padding: 10px 10px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar-menu button:active {
      background: #eef3f8;
    }
    .topbar-menu button .menu-tag {
      margin-left: auto;
      padding-left: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }
    .topbar-menu .sep {
      height: 1px;
      margin: 6px 8px;
      background: var(--line);
    }
    .topbar-menu .menu-zoom {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 8px 10px;
    }
    .topbar-menu .menu-zoom .zoom-lab {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .04em;
      user-select: none;
    }
    .topbar-menu .menu-zoom .zoom-btn,
    .topbar-menu .menu-zoom .zoom-reset {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 32px;
      height: 32px;
      margin: 0;
      padding: 0 10px;
      border: 1px solid #c5ced9;
      border-radius: 8px;
      background: #f4f7fa;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar-menu .menu-zoom .zoom-reset {
      margin-left: 2px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .04em;
    }
    .topbar-menu .menu-zoom .zoom-btn:active,
    .topbar-menu .menu-zoom .zoom-reset:active {
      background: #e8eef4;
    }
    .topbar-menu .menu-zoom .zoom-btn:disabled,
    .topbar-menu .menu-zoom .zoom-reset:disabled {
      opacity: .38;
      cursor: default;
    }

    /* 顯示模式：字體調整上方的滑動開關（淺／深） */
    .topbar-menu .menu-theme {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 8px 6px;
      user-select: none;
    }
    .topbar-menu .menu-theme .theme-lab {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .04em;
    }
    .topbar-menu .menu-theme .theme-lab.is-on {
      color: #2f5649;
      font-weight: 700;
    }
    .topbar-menu .menu-theme .theme-switch {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 4px 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      min-width: 0;
      width: auto;
    }
    .topbar-menu .menu-theme .theme-track {
      position: relative;
      display: block;
      width: 46px;
      height: 26px;
      border-radius: 13px;
      background: #c5ced9;
      box-shadow: inset 0 1px 2px rgba(45, 62, 80, .18);
      transition: background .22s ease;
      overflow: hidden;
    }
    .topbar-menu .menu-theme .theme-track::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.28) 42%, transparent 70%);
      transform: translateX(-60%);
      transition: transform .35s ease;
      pointer-events: none;
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-track {
      background: linear-gradient(180deg, #3d6b5c 0%, #2f5649 100%);
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-track::before {
      transform: translateX(60%);
    }
    .topbar-menu .menu-theme .theme-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(45, 62, 80, .28);
      transition: transform .22s ease;
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-thumb {
      transform: translateX(20px);
    }
    @media (prefers-reduced-motion: reduce) {
      .topbar-menu .menu-theme .theme-track,
      .topbar-menu .menu-theme .theme-track::before,
      .topbar-menu .menu-theme .theme-thumb { transition: none; }
    }
    /* 馬匹列表／水位彈窗內容等比例縮放；水位殼本身不 zoom，避免 top 對齊被放大帶偏 */
    #boardMain,
    #waterSheetZoom {
      transform-origin: top left;
      zoom: var(--list-zoom, 1);
    }
    @supports not (zoom: 1) {
      #boardMain,
      #waterSheetZoom {
        transform: scale(var(--list-zoom, 1));
        width: calc(100% / var(--list-zoom, 1));
      }
    }

    /* 頁眉下公告跑馬燈（隨列表滾動，不鎖定） */
    .anno {
      display: flex;
      align-items: stretch;
      height: 28px;
      background: #fff6d6;
      border-bottom: 1px solid #edd9a0;
      overflow: hidden;
    }
    .anno-lab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      background: #f0dfa0;
      color: #3d5a80;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    .anno-track {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 8px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 8px), transparent);
    }
    .anno-run {
      display: inline-flex;
      align-items: center;
      gap: 56px;
      white-space: nowrap;
      will-change: transform;
      animation: annoMarquee 22s linear infinite;
      color: #d32f2f;
      font-size: 13px;
      font-weight: 400;
      line-height: 1;
      padding-left: 10px;
    }
    .anno-run span { flex: 0 0 auto; }
    @keyframes annoMarquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .anno-run { animation: none; transform: none; }
    }

    .subhead {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 8px 10px 5px;
    }

    /* 場次：單行不換行；寬度不夠時左右滑選 */
    .race-pills {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: flex-start;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      scrollbar-width: thin;
      padding: 1px 2px 4px;
    }
    .race-pills::-webkit-scrollbar {
      height: 3px;
    }
    .race-pills::-webkit-scrollbar-thumb {
      background: #c5ced9;
      border-radius: 2px;
    }
    .race-pills button {
      flex: 0 0 auto;
      width: 32px; height: 26px; border: 0; border-radius: 6px; cursor: pointer;
      font-weight: 800; font-size: 13px; color: #fff; background: var(--green);
      -webkit-tap-highlight-color: transparent;
    }
    .race-pills button.active { background: var(--blue); }
    .race-pills button.demo { background: var(--orange); }
    .race-pills button.demo.active { background: var(--blue); }

    .meta {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-top: 3px; font-size: 12px; line-height: 1.45; color: #5b6575;
    }
    .race-meta-line {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .race-status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 1px;
      max-width: 4.8em;
      padding: 0;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
      color: #5b6575;
      white-space: nowrap;
    }
    .race-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: #8a93a3;
      box-shadow: 0 0 0 1px rgba(45, 62, 80, .08);
    }
    /* 狀態燈色系對齊頁面：藍／綠／黃／紅／橙 */
    .race-status[data-status="wait"] .race-status-dot { background: var(--blue); }
    .race-status[data-status="parade"] .race-status-dot { background: var(--green); }
    .race-status[data-status="gate"] .race-status-dot { background: var(--yellow); }
    .race-status[data-status="running"] .race-status-dot {
      background: var(--red);
      box-shadow: 0 0 0 1px rgba(231, 76, 60, .18);
      animation: raceStatusPulse 1.2s ease-in-out infinite;
    }
    .race-status[data-status="paid"] .race-status-dot { background: var(--orange); }
    .race-status[data-status="wait"] { color: var(--blue-2); }
    .race-status[data-status="parade"] { color: #3d9a3d; }
    .race-status[data-status="gate"] { color: #a67f0f; }
    .race-status[data-status="running"] { color: #c0392b; }
    .race-status[data-status="paid"] { color: #c46e18; }
    @keyframes raceStatusPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .55; transform: scale(.92); }
    }
    @media (prefers-reduced-motion: reduce) {
      .race-status[data-status="running"] .race-status-dot { animation: none; }
    }
    .race-meta-text {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }
    .race-meta-viewport {
      display: block;
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
    }
    .race-meta-run {
      display: inline-block;
      max-width: none;
      white-space: nowrap;
      line-height: 1.45;
      will-change: transform;
      transform: translateX(0);
    }
    .race-meta-run.is-marquee {
      animation-name: raceMetaBounce;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-direction: alternate;
      animation-duration: var(--meta-dur, 10s);
    }
    @keyframes raceMetaBounce {
      from { transform: translateX(0); }
      to { transform: translateX(calc(-1 * var(--meta-overflow, 0px))); }
    }
    @media (prefers-reduced-motion: reduce) {
      .race-meta-run.is-marquee { animation: none; transform: none; }
    }

    /* 場次信息與馬匹列表之間：時間軸＋膠囊（對齊參考稿，吸頂鎖定） */
    .insight-pin {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 4px 4px 3px; /* 左右收窄，給展開膠囊更多號碼空間 */
      background: #f7f9fc;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(45, 62, 80, .04);
    }
    .time-scrub {
      display: block;
      min-width: 0;
      padding: 0 12px; /* 兩頭各縮 10px（原 2px） */
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .time-scrub-track-wrap {
      position: relative;
      width: 100%;
      padding-top: 14px;
      height: 36px;
      box-sizing: border-box;
      cursor: pointer;
    }
    .time-scrub-labels {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 14px;
      pointer-events: none;
    }
    .time-scrub-lab-item {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 11px; /* +2px */
      font-weight: 700;
      line-height: 1;
      color: #8a93a3;
      white-space: nowrap;
      letter-spacing: 0;
    }
    .time-scrub-lab-item.is-edge-start {
      transform: translateX(0);
    }
    .time-scrub-lab-item.is-edge-end {
      transform: translateX(-100%);
    }
    .time-scrub-lab-item.is-active {
      color: #c45f12;
      font-weight: 800;
    }
    .time-scrub-lab-item.is-open-lab {
      font-size: 10px; /* +2px */
      letter-spacing: -.02em;
    }
    /* 視覺細軌＋加大熱區 */
    .time-scrub-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 20px;
      height: 5px;
      border-radius: 999px;
      background: #e6ebf2;
      box-shadow: inset 0 0 0 1px rgba(45, 62, 80, .05);
    }
    .time-scrub-fill {
      position: absolute;
      left: 0;
      top: 0;

    /* 左鎖：馬號名｜賠率；右滑時段等寬；水位箭頭在數字前同行，行高壓到數字本身 */
    .water-board {

      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      gap: var(--wh-line-gap);
      /* 右框較前版外拓 3px；數字／箭頭再左移 2px */
      padding: var(--wh-pad-y) 8px var(--wh-pad-y) 2px;

    .wp-odds .win,
    .wp-odds .pla,
    .wp-odds .wp {

      align-items: flex-start;
      justify-content: flex-end;
      box-sizing: border-box;
      height: var(--wh-line-h);
      min-height: var(--wh-line-h);

      line-height: var(--wh-num-lh);
      white-space: nowrap;
      text-align: right;
      transform: translateX(-5px);
    }

    .wp-odds .pla { color: #7b8494; }
    .wp-odds .wp {
      color: #8a93a3;

      transform: translateX(5px);

    .wp-odds .win.hot,
    .wp-odds .pla.hot,

    .wp-odds .od-n {

    /* 時段列：等寬收緊、內容居中對齊 */
    .whour {

      line-height: var(--wh-num-lh);
      white-space: nowrap;
    }
    /* 水位＝箭頭＋數字同行；流量＝僅數字 */
    .wh-metric {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      gap: 0;
      min-width: 0;
      height: var(--wh-line-h);
    }
    .wh-metric:not(.no-arr) {
      flex: 0 0 auto;
      min-width: calc(var(--wh-arr-w) + 1.25em);
    }
    .wh-metric.no-arr {
      flex: 0 0 1.3em;
      width: 1.3em;
      justify-content: center;
    }
    .wh-line .wv,
    .wh-line .fv {
      display: block;
      font-size: var(--wh-num-fs);
      font-weight: 400;
      text-align: center;
      line-height: var(--wh-num-lh);
      height: var(--wh-line-h);
      font-variant-numeric: tabular-nums lining-nums;
    }
    .wh-line .wv {
      width: 1.25em;
      min-width: 1.25em;

    }
    .wh-line .fv {

    }
    .wh-line.pla .wv,
    .wh-line.pla .fv { color: #7b8494; }
    /* 第三行 WP（獨贏+位置混合池）：再淡一級，與獨贏／位置分層 */
    .wh-line.wp .wv,
    .wh-line.wp .fv { color: #8a93a3; }
    .wh-line .muted { color: var(--muted); }
    /* 升＝綠↖，降＝紅↙；預設隱藏佔位，僅十字高亮行／列顯示，減少眼花 */
    .wh-arr {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 var(--wh-arr-w);
      width: var(--wh-arr-w);
      height: var(--wh-line-h);
      font-size: var(--wh-arr-fs);
      font-weight: 700;
      line-height: 1;

    .water-row.alt.is-wh-cross-row .wp-odds,

    .hrow.head .cell.scroll-col.has-cell-peek {

      left: 0;
      bottom: 0;

    .hrow.alt.mark-2 .lock-cluster { background: #c5e8d3; }

    .lock-cluster {
      position: sticky;
      left: 0;
      top: auto;
      z-index: 4;
      display: grid;
      grid-template-columns: var(--pin-id) var(--pin-odds);
      flex: 0 0 var(--pin-w);
      width: var(--pin-w);
      min-width: var(--pin-w);
      align-self: stretch;
      background: #fff;
      box-shadow: 6px 0 8px rgba(45, 62, 80, .10);
      isolation: isolate;
    }
    .hrow.alt .lock-cluster { background: #f4f6f8; }
    .hrow.head {
      position: relative;
      z-index: 6;
      height: 47px;
      background: #eef3f8;
      color: #111;
      font-size: var(--head-fs); font-weight: 400;
      text-align: center;
    }
    .hrow.head .lock-cluster {
      z-index: 8;
      background: #eef3f8;
    }

    .cell {
      display: flex; align-items: center; justify-content: center;
      padding: 0 2px;
      font-size: var(--head-fs);
      font-weight: 400;
      overflow: hidden;
    }
    .lock-cluster .cell.pin-id {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1px;
      padding: 1px 2px;
    }
    /* 資料列：彩衣｜馬號｜騎／練姓氏首字（上騎下練）；馬名跨底 */
    .hrow:not(.head) .cell.pin-id {
      display: grid;
      grid-template-columns: 33px 22px 15px;
      grid-template-rows: 31px minmax(0, 1fr);
      column-gap: 2px;
      align-items: stretch;
      justify-items: stretch;
      padding: 0 2px 0 0;
      overflow: visible;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hrow:not(.head) .cell.pin-id:active {
      background: rgba(91, 163, 217, .16);
    }
    .hno {
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      justify-self: center;
      z-index: 2;
      display: grid;
      place-items: center;
      place-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--nav);
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      margin-top: -1px;
    }
    /* 列表第一列：馬號加大 2px、下移 2px；橫向仍左移 3px（騎／練首字不動） */
    .hrow:not(.head) .cell.pin-id .hno {
      width: 24px;
      height: 24px;
      font-size: 17px;
      transform: translate(-3px, 2px);
    }
    .hno > span,
    .draw-no > span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 1em;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums lining-nums;
      transform: translateY(-0.08em);
    }
    /* 馬號右側：上＝騎師姓氏首字，下＝練馬師姓氏首字 */
    .hrow:not(.head) .cell.pin-id .jt-ini {
      grid-column: 3;
      grid-row: 1;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      align-self: center;
      justify-self: center;
      line-height: 1;
      min-width: 0;
      pointer-events: none;
    }
    .jt-ini .j-ini,
    .jt-ini .t-ini {
      display: block;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.05;
      text-align: center;
    }
    .jt-ini .j-ini,
    .jt-ini .t-ini { color: var(--text); }
    .jt-ini .j-ini { transform: translateY(-1px); }
    .jt-ini .t-ini { transform: translateY(1px); }
    /* 馬名橫跨首列；右側留空給兩字跑法角標；僅馬名左移 5px（自 -7px 右移 2px）
       width 補回位移，避免 transform 左移後右側留白、文字卻被 ellipsis 截斷 */
    .hrow:not(.head) .cell.pin-id .hname {
      grid-column: 1 / -1;
      grid-row: 2;
      z-index: 2;
      align-self: center;
      justify-self: stretch;
      max-width: none;
      width: calc(100% + 5px);
      padding: 0 26px 0 1px;
      margin-top: -1px;
      text-align: left;
      transform: translateX(-5px);
    }
    /* 預計跑法兩字全稱角標：前領／跟前／中置／後上 —— 貼首列右下 */
    .hrow:not(.head) .cell.pin-id .rs-chip {
      position: absolute;
      right: 1px;
      bottom: 3px;
      z-index: 3;
      box-sizing: border-box;
      min-width: 24px;
      height: 14px;
      padding: 0 3px;
      margin: 0;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      line-height: 14px;
      text-align: center;
      color: #fff;
      letter-spacing: -.04em;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
    .rs-chip.lead { background: #3d5a80; }   /* 前領 */
    .rs-chip.press { background: #2f8f78; }  /* 跟前 */
    .rs-chip.mid { background: #6a7382; }    /* 中置 */
    .rs-chip.late { background: #c47a3a; }   /* 後上 */
    .hrow.scratched .rs-chip { opacity: .55; }
    .hrow.head .lock-cluster .cell { padding: 0 2px; }
    .hrow.head .cell.head-split {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1px;
    }
    .hrow.head .cell.head-split .odds-sort {
      flex: 0 1 auto;
      min-width: 0;
    }
    .hrow.head .cell.head-split .sort-hit {
      flex: 0 0 auto;
    }
    /* 獨贏／位置左、檔位豎排右，同一格 */
    .hrow.head .cell.pin-odds {
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 1px;
      padding: 0 2px;
    }
    .odds-labs {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 0;
      line-height: 1.02;
      text-align: right;
    }
    .draw-sort {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: var(--head-fs);
      font-weight: 400;
      padding: 0;
      line-height: 1.02;
      cursor: pointer;
    }
    .draw-lab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.02;
      font-size: inherit;
      font-weight: 400;
    }
    .sortable { cursor: pointer; user-select: none; }
    .head-static {
      display: block;
      font-size: var(--head-fs); font-weight: 400; line-height: 1.02;
      /* 隨表頭主題色（淺／深），與可排序欄文字一致 */
      color: inherit; cursor: default; user-select: none;
    }
    .odds-sort {
      display: inline-flex; flex-direction: row;
      align-items: center; justify-content: center; gap: 1px;
      width: auto; max-width: 100%; border: 0; background: transparent;
      color: inherit; font: inherit; font-size: var(--head-fs); font-weight: 400;
      padding: 0; line-height: 1.02; cursor: pointer; text-align: center;
      white-space: nowrap; border-radius: 3px;
    }
    .hrow.head .lock-cluster .odds-sort { font-size: var(--head-fs); line-height: 1.02; }
    .hrow.head .scroll-col .odds-sort {
      flex-direction: row; align-items: center; justify-content: center;
      gap: 1px; width: auto; font-size: var(--head-fs); white-space: nowrap;
      line-height: 1.02;
    }
    .odds-sort .lab { display: block; line-height: 1.02; font-size: inherit; }
    .sort-hit {
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; background: transparent; padding: 0; margin: 0;
      cursor: pointer; color: inherit; line-height: 1;
    }
    .sort-ico {
      display: inline-flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1px; flex: 0 0 auto;
      line-height: 1;
    }
    .sort-ico .u, .sort-ico .d {
      display: block; font-size: 10px; font-weight: 900;
      color: #c5cad3; line-height: 1;
    }
    .sortable.on { color: #2c5f8a; }
    .sort-ico .u.on, .sort-ico .d.on { color: var(--orange); }
    .hrow.head .cell.sort-on {
      background: #e4eef8;
      box-shadow: inset 0 -2px 0 #3b8fd4;
    }
    .cell.sort-col { background: rgba(91, 163, 217, .12); }
    .hrow.alt .cell.sort-col { background: rgba(91, 163, 217, .18); }

    .silk {
      display: block;
      width: 17px; height: 17px;
      border-radius: 0;
      background-color: transparent;
    }
    .hrow:not(.head) .cell.pin-id .silk {
      grid-column: 1;
      grid-row: 1;
      width: auto;
      min-width: 0;
      min-height: 0;
      align-self: stretch;
      justify-self: stretch;
      /* 相對原位：上移 2px、左移 3px（騎／練首字不動） */
      margin: 2px 0 0 1px;
      height: calc(100% + 1px);
      overflow: hidden;
      z-index: 1;
    }
    .silk.has-img {
      background-color: transparent !important;
      box-shadow: none !important;
      background-size: contain;
      background-position: left top;
      background-repeat: no-repeat;
    }
    .hname {
      display: block;
      font-size: 13px; font-weight: 400; line-height: 1.02;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text);
      max-width: none; /* 舊 52px 會讓四字馬名被截斷，右側卻看似仍有空位 */
      text-align: left;
      letter-spacing: -.02em;
    }

    .hrow:not(.head) .cell.pin-odds {
      flex-direction: row;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      padding: 2px 3px 2px 8px;
      overflow: hidden;
    }
    /* 右欄：上旗下檔位；檔位底邊與位置賠率齊平 */
    .draw-flag-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      flex: 0 0 auto;
      gap: 2px;
      min-width: 22px;
      padding: 0;
      transform: translateX(3px);
    }
    .row-flag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: #b0b8c4;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      line-height: 0;
      transform: translateY(6px);
    }
    .row-flag svg {
      width: 25px;
      height: 28px;
      display: block;
    }
    .row-flag:active {
      background: rgba(45, 62, 80, .08);
    }
    .row-flag[data-mark="1"] {
      color: var(--orange);
    }
    .row-flag[data-mark="2"] {
      color: var(--green);
    }
    .draw-no {
      display: grid;
      place-items: center;
      place-content: center;
      flex: 0 0 auto;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 1px solid #cfd6de;
      background: #fff;
      font-size: 13px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: 0;
      color: var(--text);
      text-align: center;
    }

    .odds {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 2px;
      line-height: 1.02;
      padding: 0;
      transform: translateX(2px);
      font-variant-numeric: tabular-nums lining-nums;
    }
    /* 內層賠率棧：與外層 cell.odds 分開，避免整格被當 .odds 撐變形 */
    .cell.pin-odds > .odds {
      flex: 0 0 auto;
      max-width: calc(100% - 36px);
      overflow: visible;
    }
    .odds .win,
    .odds .pla {
      position: relative;
      display: block;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.02;
      white-space: nowrap;
      text-align: right;
    }
    .odds .win { color: var(--text); transform: translateY(-7px); }
    .odds .pla { color: #7b8494; transform: translateY(-4px); }
    .odds .win.hot, .odds .pla.hot { color: var(--red); }
    .odds .od-n {
      font: inherit;
      color: inherit;
      font-variant-numeric: tabular-nums lining-nums;
      line-height: 1;
    }
    /* 字符箭頭絕對貼數字右側，不佔版面寬度（外層賠率／水位流量／彈窗賠率共用） */
    .odds .od-tick,
    .scroll-col .wp .od-tick,
    .wp-odds .od-tick {
      position: absolute;
      left: 100%;
      top: 50%;
      margin-top: -0.45em;
      margin-left: 1px;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
      font-family: "Noto Sans TC", "PingFang TC", "Segoe UI Symbol", sans-serif;
    }
    /* 彈窗賠率行高含水位箭頭位，升降箭改對齊數字中線 */
    .wp-odds .od-tick {
      top: calc(var(--wh-num-fs) * var(--wh-num-lh) / 2);
      margin-top: 0;
      transform: translateY(-50%);
    }
    .odds .od-tick.up,
    .scroll-col .wp .od-tick.up,
    .wp-odds .od-tick.up { color: #1e8e3e; }
    .odds .od-tick.down,
    .scroll-col .wp .od-tick.down,
    .wp-odds .od-tick.down { color: #c0392b; }
    /* 賠率刷新後：箭頭呼吸 3 次提示升降更新 */
    .odds .od-tick.fresh,
    .scroll-col .wp .od-tick.fresh,
    .wp-odds .od-tick.fresh {
      animation: odTickBreath .65s ease-in-out 3;
      transform-origin: center center;
    }
    .wp-odds .od-tick.fresh {
      animation-name: odTickBreathWp;
    }
    @keyframes odTickBreath {
      0%, 100% { opacity: 1; transform: scale(1); }
      40% { opacity: .22; transform: scale(1.45); }
      75% { opacity: 1; transform: scale(1); }
    }
    @keyframes odTickBreathWp {
      0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
      40% { opacity: .22; transform: translateY(-50%) scale(1.45); }
      75% { opacity: 1; transform: translateY(-50%) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .odds .od-tick.fresh,
      .scroll-col .wp .od-tick.fresh,
      .wp-odds .od-tick.fresh { animation: none; opacity: 1; }
    }
    .odds .na { color: var(--muted); font-size: 14px; }

    .muted { color: var(--muted); font-weight: 400; }
    .form { letter-spacing: .02em; font-weight: 400; font-variant-numeric: tabular-nums; }
    .comment { font-size: var(--head-fs); font-weight: 400; color: #4a5563; }
    /* 右滑列：列寬隨最長內容；數據到分隔線 = --scroll-col-gap */
    .scroll-col {
      position: relative;
      flex: 0 0 auto;
      width: max-content;
      min-width: 0;
      justify-content: center;
      padding: 0 calc(var(--scroll-col-gap) + var(--scroll-col-rule)) 0 var(--scroll-col-gap);
      overflow: hidden;
    }
    .scroll-col::after {
      content: "";
      position: absolute;
      top: var(--scroll-col-gap); bottom: var(--scroll-col-gap); right: 0;
      width: var(--scroll-col-rule);
      background: #e4e7ec;
      pointer-events: none;
    }
    .scroll-col.num {
      font-variant-numeric: tabular-nums;
      font-weight: 400;
    }
    /* 心水標記：居中勾選＋序號；開跑中凍結 */
    .scroll-col.tip-note {
      justify-content: center;
      align-items: center;
      min-width: 44px;
    }
    .tip-note-cell {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 36px;
      padding: 1px 0;
      box-sizing: border-box;
    }
    .tip-note-cell.is-na .v {
      color: var(--muted);
    }
    .tip-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin: 0;
      padding: 2px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tip-check:disabled {
      cursor: default;
      opacity: .55;
    }
    /* 開跑凍結：已勾選保持清晰，未勾選才淡化 */
    .tip-note-cell.is-frozen .tip-check.is-on:disabled {
      opacity: 1;
    }
    .tip-ord {
      display: inline-block;
      min-width: 14px;
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #c45f12;
      text-align: right;
      line-height: 1;
    }
    .tip-box {
      position: relative;
      box-sizing: border-box;
      width: 20px;
      height: 20px;
      border: 2px solid #8a93a3;
      border-radius: 5px;
      background: #fff;
    }
    .tip-check.is-on .tip-box,
    .tip-note-cell.is-on .tip-box {
      border-color: #2f5649;
      background: #2f5649;
    }
    .tip-tick {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
    }
    .tip-note-cell.is-frozen .tip-check:not(:disabled) {
      cursor: default;
    }
    /* 綜合評述：固定 200px；上黑「評述：」一行、下紅「筆記：」一行，字號同馬主，超出省略 */
    .scroll-col.synth-review {
      justify-content: flex-start;
      align-items: center;
      width: 200px;
      min-width: 200px;
      max-width: 200px;
      box-sizing: border-box;
    }
    .hrow.head .cell.scroll-col.synth-review {
      justify-content: center;
    }
    .hrow.head .cell.scroll-col.synth-review .odds-sort .lab {
      white-space: nowrap;
    }
    .hrow:not(.head) .cell.scroll-col.synth-review {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hrow:not(.head) .cell.scroll-col.synth-review:active {
      background: rgba(47, 86, 73, .08);
    }
    .synth-review-cell {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 2px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0;
      padding: 1px 0;
      box-sizing: border-box;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .synth-review-cell .sr-line {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--head-fs); /* 與馬主列內容同大 */
      font-weight: 400;
      line-height: 1.2;
      text-align: left;
    }
    .synth-review-cell .sr-line.sr-review {
      color: var(--text); /* 評述：黑／正文色 */
    }
    .synth-review-cell .sr-line.sr-note {
      color: #e74c3c; /* 筆記：紅 */
    }
    .synth-review-sheet .cal-head,
    .jt-collab-sheet .cal-head {
      margin-bottom: 10px;
    }
    .synth-review-sheet .cal-title,
    .jt-collab-sheet .cal-title {
      flex: 1 1 auto;
      min-width: 0;
      text-align: left;
    }
    .jt-collab-sheet-body {
      min-height: 260px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .jt-collab-pair {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      letter-spacing: .02em;
    }
    .jt-collab-summary {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--muted);
    }
    .jt-sum-main {
      flex: 1 1 auto;
      min-width: 0;
    }
    .jt-sum-rates {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      white-space: nowrap;
      line-height: 1.35;
    }
    .jt-sum-rate {
      font-variant-numeric: tabular-nums;
    }
    .jt-collab-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .jt-collab-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: baseline;
      padding: 8px 10px;
      border-radius: 10px;
      background: #f3f5f8;
      font-size: 13px;
      line-height: 1.4;
    }
    .jt-collab-row .jt-main {
      min-width: 0;
      color: var(--text);
      font-weight: 600;
    }
    .jt-collab-row .jt-sub {
      display: block;
      margin-top: 2px;

      font-weight: 500;

    .jt-collab-row .jt-finish {

    .jt-collab-empty {

      font-size: 13px;
      font-weight: 600;
      color: var(--muted);

    /* 心水戰績：頂貼公告下；內容夠高則 JS 貼底（is-fill），否則按內容收縮 */
    #tipRecordOverlay {
      padding: 0 10px 0;
      align-items: flex-start;
      box-sizing: border-box;
    }
    .cal-sheet.tip-record-sheet {
      /* 彈層內次要字比全域 --muted 更深，保證淺／深色可讀 */
      --tr-muted: #556070;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: auto;
      max-height: 100%;
      /* 外框寬度沿用 .cal-sheet（min(342px, 100%)），不拉滿視窗 */
      margin-bottom: 0;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
    }
    .cal-sheet.tip-record-sheet.is-fill {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    .tip-record-sheet .cal-head {
      flex: 0 0 auto;
      margin-bottom: 10px;
    }
    .tip-record-sheet .cal-title {
      flex: 1 1 auto;
      min-width: 0;
      text-align: left;
    }
    .tip-record-sheet-body {
      flex: 0 1 auto;
      min-height: 0;
      max-height: none;
      overflow: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }
    /* 三段分區：左色條＋淺底邊框；內文間距同步收緊，淨高度不增加 */
    .tr-sec {
      margin: 0;
      padding: 7px 8px 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f7f9fc;
      box-shadow: inset 3px 0 0 var(--tr-sec-accent, var(--nav));
      box-sizing: border-box;
    }
    .tr-sec.tr-day { --tr-sec-accent: var(--nav); background: #f5f8fc; }
    .tr-sec.tr-stats { --tr-sec-accent: #2f8f7a; background: #f4faf8; }
    .tr-sec.tr-board { --tr-sec-accent: #b06a14; background: #fbf7f0; }
    .tr-sec-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--text);
      margin: 0 0 5px;
      line-height: 1.25;
    }
    .tr-sec-title::before {
      content: "";
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--tr-sec-accent, var(--nav));
    }
    .tr-sec-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 6px;
      margin-bottom: 5px;
    }
    .tr-sec-head .tr-sec-title {
      margin: 0;
      flex: 1 1 auto;
      min-width: 0;
    }
    /* 名家榜：標題與本日／本賽季膠囊強制同行 */
    .tr-sec.tr-board .tr-sec-head {
      flex-wrap: nowrap;
      gap: 4px;
    }
    .tr-sec.tr-board .tr-sec-title {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tr-sec.tr-board .tr-scope {
      flex: 0 0 auto;
      min-width: 118px;
      width: 118px;
    }
    /* 本日／本賽季：對齊筆記膠囊彈力滑塊 */
    .tr-scope {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      gap: 0;
      min-width: 132px;
      padding: 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      border: 1px solid var(--line);
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .tr-scope-slider {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 2px;
      width: calc(50% - 2px);
      border-radius: 999px;
      background: var(--nav);
      box-shadow: 0 1px 3px rgba(45, 62, 80, .22);
      transform: translateX(0);
      transition: transform .32s cubic-bezier(.22, 1.35, .36, 1);
      will-change: transform;
      pointer-events: none;
      z-index: 0;
    }
    .tr-scope[data-scope="season"] .tr-scope-slider {
      transform: translateX(100%);
    }
    .tr-scope-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 3px 9px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--tr-muted);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color .22s ease;
    }
    .tr-scope-btn.is-on { color: #fff; }
    @media (prefers-reduced-motion: reduce) {
      .tr-scope-slider { transition: none; }
      .tr-scope-btn { transition: none; }
    }
    .tr-help-btn {
      margin: 0;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .8);
      color: var(--tr-muted);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

    .tr-help-btn[aria-expanded="true"] {

    .tr-help {

    .tr-day-list {

    .tr-day-row {

    .tr-day-nos .cap-no .cap-badge,

    .tr-day-empty {

      font-weight: 700;
      color: var(--tr-muted);
    }
    .tr-prize-total {
      margin: 0 0 5px;
      padding: 6px 8px;
      border-radius: 8px;
      background: linear-gradient(180deg, #fff7e8 0%, #ffefd2 100%);

      color: #7a4e0e;

    .tr-stat-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    /* 名稱｜勝率｜場次｜獎金 同一行，固定欄寬對齊 */
    .tr-stat-row {
      display: grid;
      grid-template-columns: 44px 48px 72px minmax(56px, 1fr);
      gap: 4px 6px;
      align-items: center;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .78);
      border: 1px solid rgba(45, 62, 80, .06);
      font-size: 12px;

    .tr-stat-name {

    .tr-stat-rate {

    }
    .tr-stat-meta {
      font-weight: 700;

      white-space: nowrap;
      font-variant-numeric: tabular-nums;

    .tr-stat-prize {

    .tr-lb-list {

    }
    .tr-lb-row {
      border-radius: 8px;
      background: rgba(255, 255, 255, .78);
      border: 1px solid rgba(45, 62, 80, .06);
      overflow: hidden;
    }
    .tr-lb-sum {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) 40px auto;
      gap: 5px;
      align-items: center;

      padding: 5px 8px;
      border: 0;
      background: transparent;
      color: inherit;

      text-align: left;

    .tr-lb-name-wrap {

    }
    .tr-lb-name {
      flex: 0 1 auto;
      min-width: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

    /* 本人上榜：金色 me 章＋列左側微強調，方便一眼定位 */
    .tr-lb-me {

    .ft-help-btn {

    .ft-help {

    .ft-list {

    html[data-theme="dark"] .cal-sheet.famous-tips-sheet {

    .synth-review-sheet-body {
      min-height: 300px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .synth-review-sheet-body .sr-sheet-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .synth-review-sheet-body .sr-sheet-block.is-review {
      gap: 0;
    }
    .synth-review-sheet-body .sr-sheet-text {
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      min-height: 1.2em;
    }
    /* 馬匹個人筆記：場次數字綠系左右滑動膠囊（彈性過渡參考綜合指數 flex 切換） */
    .sr-note-cap {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      width: 100%;
      min-height: 42px;
      margin: 0;
      padding: 3px;
      border: 1px solid #b7dfb7;
      border-radius: 999px;
      background: #e8f6e8;
      box-shadow: inset 0 0 0 1px rgba(92, 184, 92, .14);
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .sr-note-cap-slider {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 1px 3px rgba(47, 120, 60, .22);
      transform: translateX(0);
      transition: transform .32s cubic-bezier(.22, 1.35, .36, 1);
      will-change: transform;
      pointer-events: none;
      z-index: 0;
    }
    .sr-note-cap[data-side="hist"] .sr-note-cap-slider {
      transform: translateX(100%);
    }
    .sr-note-cap-opt {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 0;
      margin: 0;
      padding: 2px 6px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #3d7a3d;
      font: inherit;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .01em;
      line-height: 1.2;
      text-align: center;
      white-space: normal;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color .22s ease;
    }
    .sr-note-cap-opt.is-on {
      color: #fff;
    }
    .sr-note-cap-opt .sr-note-cap-count {
      font-weight: 800;
      white-space: nowrap;
    }
    @media (prefers-reduced-motion: reduce) {
      .sr-note-cap-slider { transition: none; }
      .sr-note-cap-opt { transition: none; }
    }
    .sr-note-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }
    .sr-note-input {
      display: block;
      width: 100%;
      min-height: 110px;
      margin: 0;
      padding: 10px 12px;
      border: 1px solid #c5d6c5;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      box-sizing: border-box;
    }
    .sr-note-input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(92, 184, 92, .22);
    }
    .sr-note-input::placeholder {
      color: #9aa3b2;
    }
    .sr-note-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .sr-note-btn {
      min-width: 76px;
      height: 34px;
      margin: 0;
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .sr-note-btn.is-save {
      background: var(--green);
      color: #fff;
    }
    .sr-note-btn.is-save:active {
      filter: brightness(.96);
    }
    .sr-note-hist {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0;
      max-height: min(52vh, 420px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sr-note-hist-row {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid #d7e8d7;
    }
    .sr-note-hist-row:last-child {
      border-bottom: 0;
    }
    .sr-note-hist-sum {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      width: 100%;
      margin: 0;
      padding: 10px 8px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    .sr-note-hist-sum:active {
      background: rgba(92, 184, 92, .1);
    }
    .sr-note-hist-row.is-open .sr-note-hist-sum {
      background: rgba(92, 184, 92, .12);
    }
    .sr-note-hist-meta {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 0 3px;
      font-size: 11px;
      font-weight: 700;
      color: #3d7a3d;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .sr-note-hist-meta span {
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .sr-note-hist-meta .sep {
      color: #9bbb9b;
      font-weight: 600;
      margin: 0;
      padding: 0;
    }
    .sr-note-hist-detail {
      padding: 0 8px 10px;
      box-sizing: border-box;
    }
    .sr-note-hist-detail[hidden] {
      display: none !important;
    }
    .sr-note-hist-detail-box {
      width: 100%;
      margin: 0;
      padding: 10px 12px;
      border: 1px solid #c5d6c5;
      border-radius: 10px;
      background: #f4faf4;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      box-sizing: border-box;
    }
    .sr-note-hist-empty {
      font-size: 13px;
      color: var(--muted);
      padding: 10px 4px;
    }
    /* 入圍數｜% 等：數據靠右 */
    .scroll-col.end {
      justify-content: flex-end;
      text-align: right;
    }
    .scroll-col.end .v {
      display: block;
      width: 100%;
      text-align: right;
    }
    .scroll-col .v {
      display: block;
      min-width: 0;
      max-width: none;
      overflow: visible;
      text-align: center;
      font-size: var(--head-fs);
      line-height: 1.05;
      white-space: nowrap;
    }
    /* 馬主：固定 100px；過長兩行顯示 */
    .scroll-col.owner-col {
      width: 100px;
      min-width: 100px;
      max-width: 100px;
      box-sizing: border-box;
      justify-content: center;
    }
    .hrow.head .cell.scroll-col.owner-col {
      justify-content: center;
    }
    .scroll-col.owner-col .v.owner-name {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
      width: 100%;
      max-width: 100%;
      line-height: 1.2;
      text-align: center;
    }
    .scroll-col .v.stacked {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      white-space: nowrap;
    }
    .scroll-col .v.stacked .nm,
    .scroll-col .v.stacked .sub {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      font: inherit;
      color: inherit;
      line-height: inherit;
    }
    .scroll-col .v.stacked .sub.delta {
      font-size: 12px;
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: .01em;
    }
    .scroll-col .v.stacked .sub.delta-pos { color: #c0392b; }
    .scroll-col .v.stacked .sub.delta-neg { color: #1e8e3e; }
    /* 裝備變更：上＝上仗（前：…，同位置賠率灰）；下＝本期 */
    .scroll-col .v.gear-chg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      white-space: nowrap;
      line-height: 1.12;
    }
    .scroll-col .v.gear-chg .gear-prev {
      display: block;
      color: #7b8494; /* 同 .odds .pla */
      font-size: 11px;
      font-weight: 400;
      line-height: 1.1;
    }
    .scroll-col .v.gear-chg .gear-now {
      display: block;
      color: var(--text);
      font: inherit;
      line-height: 1.1;
    }
    /* 預計跑法：文字 + 四枚向左三角（實心位＝跑法） */
    .scroll-col .v.run-style {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
      line-height: 1.05;
    }
    .scroll-col .v.run-style .nm {
      display: block;
      font: inherit;
      color: inherit;
      line-height: inherit;
    }
    .scroll-col .rs-marks {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 9px;
      line-height: 0;
    }
    .scroll-col .rs-tri {
      display: block;
      width: 7px;
      height: 8px;
      flex: 0 0 auto;
      overflow: visible;
    }
    .scroll-col .rs-tri polygon {
      stroke: #2a5f8f;
      stroke-width: 1.1;
      stroke-linejoin: round;
    }
    .scroll-col .rs-tri.on polygon {
      fill: #2a5f8f;
    }
    .scroll-col .rs-tri:not(.on) polygon {
      fill: #fff;
    }
    /* 近六賽績＋班次升降：每個近績數字正下方緊跟對應升／平／降圖例 */
    .scroll-col .v.form-class {
      display: inline-flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 0;
      white-space: nowrap;
      line-height: 1.05;
    }
    .scroll-col .fc-seg {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      min-width: 1.05em;
    }
    .scroll-col .fc-seg .fc-num {
      display: block;
      font: inherit;
      color: inherit;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .scroll-col .fc-sep {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 1px;
      font: inherit;
      color: inherit;
      line-height: 1.05;
      user-select: none;
    }
    .scroll-col .fc-m {
      display: block;
      width: 7px;
      height: 8px;
      flex: 0 0 auto;
      overflow: visible;
    }
    .scroll-col .fc-m.up polygon {
      fill: #1e8e3e;
      stroke: #1e8e3e;
      stroke-width: 0.6;
      stroke-linejoin: round;
    }
    .scroll-col .fc-m.down polygon {
      fill: #c0392b;
      stroke: #c0392b;
      stroke-width: 0.6;
      stroke-linejoin: round;
    }
    .scroll-col .fc-m.flat rect {
      fill: #8a93a0;
    }
    /* 水位／流量：獨贏上、位置下；右對齊＋▲▼（與賠率欄同款，零占位） */
    .scroll-col .wp {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 2px;
      line-height: 1.02;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      white-space: nowrap;
      overflow: visible;
    }
    .scroll-col .wp .w,
    .scroll-col .wp .p {
      position: relative;
      display: block;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.02;
      text-align: right;
    }
    .scroll-col .wp .w {
      color: var(--text);
      transform: translateY(-8px);
    }
    .scroll-col .wp .p {
      color: #7b8494;
      transform: translateY(-5px);
    }
    .scroll-col .wp .od-n {
      font: inherit;
      color: inherit;
      line-height: 1;
    }
    .scroll-col:has(.wp) {
      overflow: visible;
      align-items: flex-end;
    }

    /* 歷史場次前四名：負磅與騎師之間 — 絲帶徽章名次水印（無拖影） */
    .hrow:not(.head):has(.finish-wm-host) {
      overflow: visible;
      z-index: 2;
    }
    .hrow:not(.head) .cell.finish-wm-host,
    .hrow:not(.head) .cell.finish-wm-pair {
      position: relative;
      overflow: visible !important;
    }
    .hrow:not(.head) .cell.finish-wm-host {
      z-index: 0;
    }
    .hrow:not(.head) .cell.finish-wm-pair {
      z-index: 1;
    }
    .finish-wm {
      --wm-r: 224;
      --wm-g: 58;
      --wm-b: 58;
      --wm-fill: rgba(var(--wm-r), var(--wm-g), var(--wm-b), .58);
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translate(calc(-50% - 9px), -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 46px;
      pointer-events: none;
      z-index: 0;
      /* 不用整層 opacity：白描邊必須實心 */
      opacity: 1;
      user-select: none;
      color: rgb(var(--wm-r), var(--wm-g), var(--wm-b));
      overflow: visible;
    }
    /* 名次數字：塊面字形 + 實心白描邊 */
    .finish-wm-num {
      position: relative;
      z-index: 1;
      font-family: "Arial Black", Impact, "Helvetica Neue Condensed Bold", "Arial Narrow", sans-serif;
      font-size: 40px;
      font-weight: 900;
      font-style: italic;
      font-stretch: condensed;
      line-height: .78;
      letter-spacing: -0.06em;
      color: var(--wm-fill);
      -webkit-text-stroke: 5px #fff;
      paint-order: stroke fill;
      text-shadow:
        0 0 0 #fff,
        -3px 0 0 #fff,
        3px 0 0 #fff,
        0 -3px 0 #fff,

        3px -3px 0 #fff,
        -3px 3px 0 #fff,
        3px 3px 0 #fff,
        -1.5px -3px 0 #fff,
        1.5px -3px 0 #fff,
        -1.5px 3px 0 #fff,
        1.5px 3px 0 #fff,
        -3px -1.5px 0 #fff,

    .silk-1 { background:#e10600; } .silk-2 { background:#111; }
    .silk-3 { background:#0057b8; } .silk-4 { background:#ffd100; color:#222; }
    .silk-5 { background:#00a651; } .silk-6 { background:#e4007c; }
    .silk-7 { background:#00b5e2; color:#083044; } .silk-8 { background:#8a8d8f; }
    .silk-9 { background:#ff6a00; } .silk-10 { background:#6f2c91; }
    .silk-11 { background:#a8d08d; color:#1a3318; } .silk-12 { background:#7a1f2b; }
    .silk-13 { background:#fff; color:#111; box-shadow: inset 0 0 0 1px #999; }

    /* 連贏區：表內橫豎滾動；首行／首列 CSS sticky（20 匹可鎖定標號） */
    .qin-panel {
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      width: 100%;
      background: #eef1f5;
      border-top: 8px solid #eef1f5;
      padding: 0 0 10px;
      --qin-cell: 24px;
      --qin-title-w: 24px;
    }
    /* 排位頁底部走位圖：接在連贏下；圖放大可橫滑，豎向隨頁展開 */
    .board-speed-map {
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      width: 100%;
      background: #eef1f5;
      border-top: 8px solid #eef1f5;
      padding: 0 0 12px;
    }
    .board-speed-map-head {
      padding: 8px 10px 6px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--text);
      line-height: 1.25;
    }
    .board-speed-map-body {
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      background: #f3f5f8;
      max-height: none;
    }
    .board-speed-map-body img {
      display: block;
      width: 180%;
      max-width: none;
      height: auto;
      vertical-align: top;
    }
    .qin-block {
      background: #fff;
      position: relative;
      /* 裁切邊緣回彈時 sticky 標號「漂浮」溢出 */
      overflow: hidden;
    }
    .qin-x {
      overflow: auto;
      /* 禁邊緣回彈漂浮；表內仍用 touch 慣性跟手 */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    .qin-tbl {
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
      font-variant-numeric: tabular-nums lining-nums;
      line-height: 1;
    }
    /* 明確列寬，避免角標 colspan=2 把首兩列均分導致右側留白 */
    .qin-tbl col.qin-col-rh {
      width: var(--qin-title-w);
    }
    .qin-tbl col.qin-col-c {
      width: var(--qin-cell);
    }
    .qin-tbl th,
    .qin-tbl td {
      border: 1px solid #cfd6e0;
      text-align: center;
      vertical-align: middle;
      padding: 0;
      height: var(--qin-cell);
      min-width: var(--qin-cell);
      width: var(--qin-cell);
      font-weight: 400;
      color: var(--text);
      background: #fff;
      box-sizing: border-box;
    }
    /* 角標：位置Q／正Q 左右波動開關（橫跨首列＋原「1」位） */
    .qin-tbl .qin-switch-cell {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 4;
      padding: 0;
      vertical-align: middle;
      background: #cfd5de;
      min-width: calc(var(--qin-title-w) + var(--qin-cell));
      width: calc(var(--qin-title-w) + var(--qin-cell));
      box-shadow: 0 2px 4px rgba(45, 62, 80, .10), 3px 0 6px rgba(45, 62, 80, .12);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .qin-mode-switch {
      display: block;
      width: 100%;
      height: 100%;
      min-height: var(--qin-cell);
      margin: 0;
      padding: 2px;
      border: 0;
      background: transparent;
      cursor: pointer;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .qin-sw-track {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: calc(var(--qin-cell) - 4px);
      border-radius: 3px;
      background: #b8c0cb;
      overflow: hidden;
    }
    .qin-sw-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: var(--orange);
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(45, 62, 80, .18);
      transform: translateX(0);
      transition: transform .22s cubic-bezier(.4, .0, .2, 1);
      pointer-events: none;
      z-index: 0;
    }
    .qin-tbl[data-qin-mode="qin"] .qin-sw-thumb,
    .qin-mode-switch[data-qin-side="qin"] .qin-sw-thumb {
      transform: translateX(100%);
    }
    .qin-sw-lab {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1px;
      font: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .01em;
      line-height: 1.05;
      color: #5b6575;
      white-space: nowrap;
      transition: color .18s ease;
      user-select: none;
    }
    .qin-tbl[data-qin-mode="qpl"] .qin-sw-lab[data-qin-mode="qpl"],
    .qin-tbl[data-qin-mode="qin"] .qin-sw-lab[data-qin-mode="qin"],
    .qin-mode-switch[data-qin-side="qpl"] .qin-sw-lab[data-qin-mode="qpl"],
    .qin-mode-switch[data-qin-side="qin"] .qin-sw-lab[data-qin-mode="qin"] {
      color: #fff;
      font-weight: 800;
    }
    .qin-mode-switch:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -3px;
    }
    .qin-mode-switch:active .qin-sw-thumb {
      filter: brightness(.96);
    }
    /* 首列「1」位：豎排「指數」灰底＋右側 1/3 藍底馬號，非按鈕 */
    .qin-tbl .qin-rh.qin-idx-lab {
      padding: 0;
      background: #cfd5de;
      color: #5b6575;
      cursor: default;
      user-select: none;
      overflow: hidden;
    }
    .qin-idx-inner {
      display: flex;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: var(--qin-cell);
    }
    .qin-idx-txt {
      flex: 2 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 1px 0;
      background: #cfd5de;
      color: #5b6575;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.05;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }
    .qin-idx-no {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-width: 0;
      background: #5b8fc7;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }
    .qin-tbl .qin-rh.qin-idx-lab.scratch .qin-idx-no {
      background: #9aa3af;
      color: #e8eaed;
    }
    .qin-tbl .qin-h {
      background: #5b8fc7;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
    }
    /* 首行馬號：豎滑鎖定 */
    .qin-tbl .qin-ch {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #5b8fc7;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      box-shadow: 0 2px 4px rgba(45, 62, 80, .10);
    }
    /* 首列馬號：橫滑鎖定 */
    .qin-tbl .qin-rh {
      position: sticky;
      left: 0;
      z-index: 3;
      background: #5b8fc7;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      min-width: var(--qin-title-w);
      width: var(--qin-title-w);
      box-shadow: 3px 0 6px rgba(45, 62, 80, .12);
    }
    .qin-tbl .qin-empty {
      border-color: transparent;
      background: transparent;
    }
    .qin-tbl .qin-c.hot,
    .qin-tbl .qin-c.idx-r { background: #e74c3c; color: #fff; }
    .qin-tbl .qin-c.drop20,
    .qin-tbl .qin-c.idx-g { background: var(--green); color: #fff; } /* 場次數字綠 */
    .qin-tbl .qin-c.drop50,
    .qin-tbl .qin-c.idx-b { background: #c47a3a; color: #fff; } /* 「後上」標黃 */
    /* 下三角指數格：未上色時用淡底；上色規則須壓過淡底（同特異度時後寫生效） */
    .qin-tbl .qin-c.idx-cell {
      background: #eef4fa;
      color: #3d5a80;
    }
    .qin-tbl .qin-c.idx-cell.idx-r {
      background: #e74c3c;
      color: #fff;
    }
    .qin-tbl .qin-c.idx-cell.idx-g {
      background: var(--green);
      color: #fff;
    }
    .qin-tbl .qin-c.idx-cell.idx-b {
      background: #c47a3a;
      color: #fff;
    }
    .qin-tbl .qin-c[data-qin-key] {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    /* 退出駒：保留馬號座標，賠率／指數灰顯「—」（對齊列表退出態） */
    .qin-tbl .qin-ch.scratch,
    .qin-tbl .qin-rh.scratch,
    .qin-tbl .qin-h.scratch {
      opacity: .45;
      text-decoration: line-through;
    }
    .qin-tbl .qin-c.scratch,
    .qin-tbl .qin-c.idx-cell.scratch {
      background: #f0f2f5;
      color: #9aa3b0;
      cursor: default;
      font-weight: 400;
    }
    .qin-tbl .qin-c.scratch[data-qin-key] {
      cursor: default;
    }
    /* 輕點座標：框外 outline 呼吸，不佔格內空間（密格如 20 匹仍可讀數字） */
    .qin-tbl .qin-c.is-qin-focus {
      position: relative;
      z-index: 5;
      box-shadow: none;
      outline: 2px solid #ff9a1a;
      outline-offset: 0;
      animation: qinFocusPulse 1.05s ease-in-out infinite;
    }
    @keyframes qinFocusPulse {
      0%, 100% {
        outline-color: #d97808;
        outline-offset: 0;
      }
      50% {
        outline-color: #ff3d00;
        outline-offset: 2px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .qin-tbl .qin-c.is-qin-focus {
        animation: none;
        outline-color: #ff4d00;
        outline-offset: 1px;
      }
    }

    .qin-legend {

    /* —— 菜單：最近賽日（日期選擇欄）；寬度跟內容收緊 —— */
    .topbar-menu {

    }
    .speed-map-body img {
      display: block;

      width: 180%;

      height: auto;

    .speed-map-loading,
    .speed-map-error {

      font-weight: 600;

    /* 派彩詳情：與賽期日曆同殼同寬；橙頭＋三列表，內容超出可內滾 */
    .payout-detail-sheet {

      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 44px;
      background: #c88852;
      color: #fff;
      border-radius: 16px 16px 0 0;
    }
    .payout-detail-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .12em;
      line-height: 1;

    .payout-detail-close {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);

      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

    .payout-detail-close:active {
      background: rgba(255, 255, 255, .18);

    .payout-detail-body {
      flex: 1 1 auto;
      min-height: 0;
      max-height: 360px; /* 超出此高則表體內滾 */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      box-sizing: border-box;
      background: #fff;
      border-radius: 0 0 16px 16px;
    }
    .payout-tbl {
      width: 100%;

      table-layout: fixed;
      font-size: 13px;
      line-height: 1.25;
      color: #3a4554;
    }
    .payout-tbl th,
    .payout-tbl td {
      padding: 9px 6px;
      text-align: center;
      vertical-align: middle;
      border: 1px solid #d7dee6;
      word-break: break-all;

    }
    .payout-tbl .payout-amt {

    .payout-detail-empty {

    .col-sort-sheet .cal-close {

    .col-sort-body {

      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .col-sort-panes {
      flex: 1 1 auto;
      display: flex;
      align-items: stretch;
      gap: 6px;
      min-height: 0;
    }
    .col-sort-pane {
      flex: 1 1 0;

      border-radius: 10px;

    .col-sort-pane-lab {

    .col-sort-list {
      flex: 1 1 auto;

      overflow: auto;

      flex-direction: column;
      gap: 3px;
    }
    .col-sort-item {
      display: block;
      width: 100%;
      margin: 0;
      padding: 7px 8px;
      border: 0;
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 600;

    }
    .col-sort-ops {
      flex: 0 0 auto;
      width: 76px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;

    }
    .col-sort-ops-mid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .col-sort-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: #e8eef4;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;

    .col-sort-arrow:active {

    }

      opacity: .35;

    }
    .col-sort-foot {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      padding-top: 2px;
    }
    .col-sort-reset {
      min-width: 96px;
      height: 34px;
      margin: 0;
      padding: 0 16px;
      border: 0;
      border-radius: 9px;
      background: #2f5649;
      color: #fff;

      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .col-sort-reset:active {
      filter: brightness(.94);
    }
    .cal-sub { display: none !important; }
    /* 上下撥動：省橫向空間，避免擠壓右側關閉鍵 */
    .cal-scope-switch {
      flex: 0 0 auto;
      display: block;
      width: 52px;
      height: 52px;
      margin: 0 2px 0 auto;
      padding: 2px;
      border: 0;
      border-radius: 6px;
      /* 與連贏表左上角開關同色階 */
      background: #cfd5de;
      box-shadow: inset 0 0 0 1px #b8c0cb;
      cursor: pointer;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .cal-scope-switch .qin-sw-track {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: 0;
      border-radius: 4px;
      background: #b8c0cb;
      overflow: hidden;
    }
    .cal-scope-switch .qin-sw-thumb {
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      border-radius: 3px;
      background: var(--orange);
      transform: translateY(0);
      transition: transform .22s cubic-bezier(.4, .0, .2, 1);
    }
    .cal-scope-switch[data-cal-scope="os"] .qin-sw-thumb {
      transform: translateY(100%);
    }
    .cal-scope-switch .qin-sw-lab {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.05;
      white-space: nowrap;
      padding: 0;
      color: #5b6575;
    }
    .cal-scope-switch[data-cal-scope="hk"] .qin-sw-lab[data-cal-scope="hk"],
    .cal-scope-switch[data-cal-scope="os"] .qin-sw-lab[data-cal-scope="os"] {
      color: #fff;
    }
    .cal-wdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin: 2px 0 2px;
    }
    .cal-wdays span {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #8a93a3;
      padding: 2px 0;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px 2px;
      min-height: 168px;
    }
    .cal-cell {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      min-height: 34px;
      padding: 3px 0 2px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: default;
    }
    .cal-cell.mute { color: #c0c6d0; }
    .cal-cell.race {
      cursor: pointer;
      background: #f5f7fa;
    }
    .cal-cell.race:active { transform: scale(.97); }
    .cal-cell.is-selected {
      box-shadow: inset 0 0 0 1.5px #3d5a80;
      background: #eef3f8;
    }
    .cal-cell .d {
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .cal-cell .marks {
      display: flex;
      gap: 3px;
      min-height: 7px;
      align-items: center;
      justify-content: center;
    }
    .cal-cell .marks i {
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .dot.st-day, .marks i.st-day { background: var(--yellow); }
    .dot.hv-night, .marks i.hv-night { background: #3d5a80; }
    .dot.st-night, .marks i.st-night { background: #1f6f8f; }
    .dot.hv-day, .marks i.hv-day { background: #5a8f6b; }
    .dot.os-uk, .marks i.os-uk { background: #5b6b9a; }
    .dot.os-au, .marks i.os-au { background: #b08a3c; }
    .dot.os-fr, .marks i.os-fr { background: #6b8f9a; }
    .dot.os-ae, .marks i.os-ae { background: #8a6a9a; }
    .cal-legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    /* display:grid 會蓋過原生 [hidden]，須顯式隱藏 */
    .cal-legend[hidden] {
      display: none !important;
    }
    .cal-legend-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .cal-legend .lg {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #707888;
      white-space: nowrap;
    }
    .cal-legend .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    /* ========== 深色模式：佈局不變，僅換色（密表護眼） ========== */

<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("j18-racecard-theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="noindex" />
  <title>排位 · J18</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav: #3d5a80;
      --nav-2: #334b6b;
      --page: #eef1f5;
      --text: #2c3340;
      --muted: #8a93a3;
      --blue: #5ba3d9;
      --blue-2: #3b8fd4;
      --green: #5cb85c;
      --orange: #e88b2a;
      --red: #e74c3c;
      --place: #27ae60;
      --line: #e4e7ec;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      /* 左鎖兩欄：馬號上馬名下；獨贏上位置下左、檔位豎排右 */
      --pin-id: 74px;
      --pin-odds: 58px;
      --pin-w: calc(var(--pin-id) + var(--pin-odds));
      --head-fs: 13px;
      /* 右滑列規則：最長數據到分隔線固定 2px（JS COL_FIT 同步） */
      --scroll-col-gap: 2px;
      --scroll-col-rule: 1px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      overflow: hidden;
      background: #d8dee6; color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex; flex-direction: column;
      max-width: 430px; margin: 0 auto;
      background: var(--page);
      min-height: 100%;
      box-shadow: 0 0 0 1px rgba(45,62,80,.12);
    }
    button { font-family: inherit; }

    .topbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 44px; padding: 0 10px;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff; z-index: 60;
      position: relative;
    }
    .topbar .side {
      min-width: 64px;
      font-size: 15px;
      font-weight: 700;
    }
    .topbar .side.l {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .topbar .side.r {
      position: relative;
      display: flex;
      justify-content: flex-end;
      text-align: right;
    }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .06em; }
    .topbar .nav-back,
    .topbar .nav-menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin: 0;
      padding: 6px 4px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar .nav-back:active,
    .topbar .nav-menu-btn:active,
    .topbar .nav-menu-btn[aria-expanded="true"] {
      background: rgba(255, 255, 255, .14);
    }
    .topbar .nav-back .chev {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      margin-top: -1px;
    }
    .topbar .nav-menu-btn .lab { letter-spacing: .04em; }
    .topbar .nav-menu-btn .caret {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      opacity: .95;
      transition: transform .18s ease;
    }
    .topbar .nav-menu-btn[aria-expanded="true"] .caret {
      transform: rotate(180deg);
    }
    .topbar-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 70;
      min-width: 168px;
      padding: 6px 0;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      box-shadow: 0 10px 28px rgba(45, 62, 80, .22), 0 0 0 1px rgba(45, 62, 80, .08);
      transform-origin: top right;
      animation: topbarMenuIn .16s ease-out;
    }
    .topbar-menu[hidden] { display: none; }
    @keyframes topbarMenuIn {
      from { opacity: 0; transform: translateY(-4px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .topbar-menu { animation: none; }
      .topbar .nav-menu-btn .caret { transition: none; }
    }
    .topbar-menu button {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 0;
      padding: 11px 14px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar-menu button:active {
      background: #eef3f8;
    }
    .topbar-menu button .menu-tag {
      margin-left: auto;
      padding-left: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }
    .topbar-menu .sep {
      height: 1px;
      margin: 6px 10px;
      background: var(--line);
    }
    .topbar-menu .menu-zoom {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px 10px;
    }
    .topbar-menu .menu-zoom .zoom-lab {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .04em;
      user-select: none;
    }
    .topbar-menu .menu-zoom .zoom-btn,
    .topbar-menu .menu-zoom .zoom-reset {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 32px;
      height: 32px;
      margin: 0;
      padding: 0 10px;
      border: 1px solid #c5ced9;
      border-radius: 8px;
      background: #f4f7fa;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar-menu .menu-zoom .zoom-reset {
      margin-left: 2px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .04em;
    }
    .topbar-menu .menu-zoom .zoom-btn:active,
    .topbar-menu .menu-zoom .zoom-reset:active {
      background: #e8eef4;
    }
    .topbar-menu .menu-zoom .zoom-btn:disabled,
    .topbar-menu .menu-zoom .zoom-reset:disabled {
      opacity: .38;
      cursor: default;
    }

    /* 顯示模式：字體調整上方的滑動開關（淺／深） */
    .topbar-menu .menu-theme {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 6px;
      user-select: none;
    }
    .topbar-menu .menu-theme .theme-lab {
      flex: 0 0 auto;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .04em;
    }
    .topbar-menu .menu-theme .theme-lab.is-on {
      color: #2f5649;
      font-weight: 700;
    }
    .topbar-menu .menu-theme .theme-switch {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 4px 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      min-width: 0;
      width: auto;
    }
    .topbar-menu .menu-theme .theme-track {
      position: relative;
      display: block;
      width: 46px;
      height: 26px;
      border-radius: 13px;
      background: #c5ced9;
      box-shadow: inset 0 1px 2px rgba(45, 62, 80, .18);
      transition: background .22s ease;
      overflow: hidden;
    }
    .topbar-menu .menu-theme .theme-track::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.28) 42%, transparent 70%);
      transform: translateX(-60%);
      transition: transform .35s ease;
      pointer-events: none;
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-track {
      background: linear-gradient(180deg, #3d6b5c 0%, #2f5649 100%);
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-track::before {
      transform: translateX(60%);
    }
    .topbar-menu .menu-theme .theme-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(45, 62, 80, .28);
      transition: transform .22s ease;
    }
    .topbar-menu .menu-theme .theme-switch[aria-pressed="true"] .theme-thumb {
      transform: translateX(20px);
    }
    @media (prefers-reduced-motion: reduce) {
      .topbar-menu .menu-theme .theme-track,
      .topbar-menu .menu-theme .theme-track::before,
      .topbar-menu .menu-theme .theme-thumb { transition: none; }
    }
    /* 馬匹列表／水位彈窗內容等比例縮放；水位殼本身不 zoom，避免 top 對齊被放大帶偏 */
    #boardMain,
    #waterSheetZoom {
      transform-origin: top left;
      zoom: var(--list-zoom, 1);
    }
    @supports not (zoom: 1) {
      #boardMain,
      #waterSheetZoom {
        transform: scale(var(--list-zoom, 1));
        width: calc(100% / var(--list-zoom, 1));
      }
    }

    /* 頁眉下公告跑馬燈（隨列表滾動，不鎖定） */
    .anno {
      display: flex;
      align-items: stretch;
      height: 28px;
      background: #fff6d6;
      border-bottom: 1px solid #edd9a0;
      overflow: hidden;
    }
    .anno-lab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      background: #f0dfa0;
      color: #3d5a80;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    .anno-track {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 8px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 8px), transparent);
    }
    .anno-run {
      display: inline-flex;
      align-items: center;
      gap: 56px;
      white-space: nowrap;
      will-change: transform;
      animation: annoMarquee 22s linear infinite;
      color: #d32f2f;
      font-size: 13px;
      font-weight: 400;
      line-height: 1;
      padding-left: 10px;
    }
    .anno-run span { flex: 0 0 auto; }
    @keyframes annoMarquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .anno-run { animation: none; transform: none; }
    }

    .subhead {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 8px 10px 10px;
    }

    /* 場次：單行不換行；寬度不夠時左右滑選 */
    .race-pills {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: flex-start;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      scrollbar-width: thin;
      padding: 1px 2px 4px;
    }
    .race-pills::-webkit-scrollbar {
      height: 3px;
    }
    .race-pills::-webkit-scrollbar-thumb {
      background: #c5ced9;
      border-radius: 2px;
    }
    .race-pills button {
      flex: 0 0 auto;
      width: 32px; height: 26px; border: 0; border-radius: 6px; cursor: pointer;
      font-weight: 800; font-size: 13px; color: #fff; background: var(--green);
      -webkit-tap-highlight-color: transparent;
    }
    .race-pills button.active { background: var(--blue); }
    .race-pills button.demo { background: var(--orange); }
    .race-pills button.demo.active { background: var(--blue); }

    .meta {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-top: 8px; font-size: 12px; line-height: 1.45; color: #5b6575;
    }

    /* 表格區殼：表體 + 馬匹詳情彈層同尺寸 */
    .board-shell {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    /* 縱向：board-wrap；橫向馬匹：board-x；連贏在 board-x 外，左右滑互不干擾 */
    .board-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: clip;
      overflow-y: auto;
      overscroll-behavior: none;
      overflow-anchor: none;
      -webkit-overflow-scrolling: touch;
      background: #fff;
    }
    @supports not (overflow-x: clip) {
      .board-wrap { overflow-x: hidden; }
    }
    .board-x {
      overflow-x: auto;
      overflow-y: clip;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
      background: #fff;
    }
    @supports not (overflow-y: clip) {
      .board-x { overflow-y: hidden; }
    }
    /* 馬匹區塊：表頭在 board-x 外 CSS sticky（豎鎖原生）；
       右表頭用獨立 overflow-x + scrollLeft 跟隨 body（非 transform，減少果凍） */
    .board-horses {
      position: relative;
      background: #fff;
    }
    .board-head-pin {
      position: sticky;
      top: 0;
      z-index: 7;
      background: #eef3f8;
      overflow: hidden;
    }
    .board-head-pin .hrow.head {
      position: relative;
      top: auto;
      z-index: 7;
      width: 100%;
      min-width: 0;
    }
    .board-head-pin .lock-cluster {
      position: relative;
      left: auto;
      z-index: 8;
      background: #eef3f8;
    }
    .board-head-x {
      flex: 1 1 auto;
      min-width: 0;
      height: 47px;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      pointer-events: none;
    }
    .board-head-x::-webkit-scrollbar { display: none; }
    .board-head-x .head-scroll-inner {
      display: flex;
      align-items: stretch;
      height: 100%;
      min-width: max-content;
    }
    .board-head-pin button,
    .board-head-pin .sort-hit {
      pointer-events: auto;
    }

    .horse-sheet {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: inset 0 1px 0 rgba(45, 62, 80, .08);
      animation: horseSheetIn .22s ease-out;
    }
    .horse-sheet[hidden] { display: none !important; }
    @keyframes horseSheetIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    /* 水位頁：只蓋住馬匹列表（board-main 起），不遮場次／賽道信息 */
    .board-shell.is-water-open #board {
      overflow: hidden;
    }
    .water-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0; /* JS 對齊 board-main 頂（不受內部 zoom 影響） */
      z-index: 35;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: inset 0 1px 0 rgba(45, 62, 80, .08);
      animation: horseSheetIn .22s ease-out;
      overflow: hidden;
    }
    .water-sheet[hidden] { display: none !important; }
    #waterSheetZoom {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .water-sheet-bar {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 44px 10px 12px;
      background: linear-gradient(180deg, #3d6b5c 0%, #2f5649 100%);
      color: #fff;
    }
    .water-sheet-title {
      min-width: 0;
      flex: 1 1 auto;
    }
    .water-sheet-title .nm {
      display: block;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .06em;
      line-height: 1.15;
    }
    .water-sheet-title .sub {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      opacity: .9;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .water-sheet-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 6px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .water-sheet-close:active { background: rgba(255,255,255,.28); }
    .water-sheet-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 0;
      background: #f4f6f8;
    }
    .water-hint {
      flex: 0 0 auto;
      padding: 5px 12px;
      font-size: 11px;
      color: #5b6b64;
      background: #eef4f1;
      border-bottom: 1px solid #d5e2db;
      letter-spacing: .02em;
    }
    .water-hint b { color: #2f5649; font-weight: 700; }
    /* 左鎖：馬號名｜賠率；右滑時段等寬；水位箭頭在數字前同行，行高壓到數字本身 */
    .water-board {
      --wh-num-fs: 14px;
      --wh-num-lh: 1.05;
      --wh-arr-fs: 10px;
      --wh-arr-w: 0.78em;
      --wh-line-gap: 2px;
      --wh-pad-y: 4px;
      --wh-line-h: calc(var(--wh-num-fs) * var(--wh-num-lh));
      --wh-col-w: 54px;
      --wh-odds-w: 37px;
      --wh-pin-w: 73px;
      min-width: max-content;
      background: #fff;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-row {
      display: flex;
      align-items: stretch;
      min-height: 0;
      border-bottom: 1px solid var(--line);
    }
    .water-row.alt .water-lock,
    .water-row.alt .water-pin,
    .water-row.alt .wp-odds,
    .water-row.alt .whour { background: #f4f6f8; }
    .water-row.scratched { opacity: .45; }
    .water-row.head {
      position: sticky;
      top: 0;
      z-index: 5;
      min-height: 28px;
      border-bottom: 1px solid #c9d9d1;
    }
    .water-row.head .water-lock,
    .water-row.head .water-pin,
    .water-row.head .wp-odds,
    .water-row.head .whour {
      background: #e8f0ec;
      color: #355a4c;
      font-size: 11px;
      font-weight: 700;
    }
    /* 馬號名＋賠率一起 sticky，橫滑時段時數字列不丟 */
    .water-lock {
      position: sticky;
      left: 0;
      z-index: 3;
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      background: #fff;
      box-shadow: 2px 0 4px rgba(45, 62, 80, .06);
    }
    .water-row.head .water-lock { z-index: 6; }
    .water-pin {
      flex: 0 0 var(--wh-pin-w);
      width: var(--wh-pin-w);
      box-sizing: border-box;
      padding: var(--wh-pad-y) 4px var(--wh-pad-y) 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 0;
      background: #fff;
      overflow: hidden;
    }
    .water-row.head .water-pin {
      justify-content: center;
      align-items: center;
    }
    /* 馬號＋騎練＋馬名收成一塊垂直居中，避免名下大片留白 */
    .wp-stack {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      width: 100%;
    }
    .wp-id {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    /* 與外層馬匹列表 .hno 同尺（22×22／15px） */
    .water-pin .hno {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      place-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--nav);
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-pin .hno > span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 1em;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums lining-nums;
      transform: translateY(-0.08em);
    }
    /* 與外層列表 .hname 同尺 */
    .water-pin .nm {
      display: block;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.02;
      padding-left: 0;
      letter-spacing: -.02em;
      margin-top: 3px;

    .wp-jt-col {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 1px;
    }
    .wp-jname,
    .wp-tname {
      display: block;

      overflow: hidden;
      text-overflow: ellipsis;

      text-align: left;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.05;
      color: var(--text);
    }
    .wp-tname { color: #5b6575; }
    /* 賠率獨立列：與時段水位同行高、同頂邊，橫向齊平 */
    .wp-odds {
      flex: 0 0 var(--wh-odds-w);
      width: var(--wh-odds-w);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      gap: var(--wh-line-gap);
      /* 右框較前版外拓 3px；數字／箭頭再左移 2px */
      padding: var(--wh-pad-y) 8px var(--wh-pad-y) 2px;
      background: #fff;
      border-right: 1px solid #d5e2db;
      overflow: visible;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-row.head .wp-odds {
      justify-content: center;
      align-items: center;
      padding-right: 6px;
    }
    .wp-odds .win,
    .wp-odds .pla,
    .wp-odds .wp {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      box-sizing: border-box;
      height: var(--wh-line-h);
      min-height: var(--wh-line-h);
      font-size: var(--wh-num-fs);
      font-weight: 400;
      line-height: var(--wh-num-lh);
      white-space: nowrap;
      text-align: right;
      transform: translateX(-5px);
    }
    .wp-odds .win { color: var(--text); }
    .wp-odds .pla { color: #7b8494; }
    .wp-odds .wp { color: #8a93a3; }
    .wp-odds .win.hot,
    .wp-odds .pla.hot,
    .wp-odds .wp.hot { color: var(--red); }
    .wp-odds .od-n {
      font: inherit;
      font-size: var(--wh-num-fs);
      line-height: var(--wh-num-lh);
      color: inherit;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .water-pin .pin-lab,
    .wp-odds .pin-lab {
      font-size: 11px;
      font-weight: 700;
      color: #355a4c;
      line-height: 1.2;
      text-align: center;
      width: 100%;
    }
    /* 時段列：等寬收緊、內容居中對齊 */
    .whour {
      flex: 0 0 var(--wh-col-w);
      width: var(--wh-col-w);
      box-sizing: border-box;
      padding: var(--wh-pad-y) 1px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: var(--wh-line-gap);
      background: #fff;
      border-right: 1px solid #eef1f4;
    }
    .water-row.head .whour {
      text-align: center;
      justify-content: center;
      align-items: center;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .wh-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 100%;
      height: var(--wh-line-h);
      min-height: var(--wh-line-h);
      line-height: var(--wh-num-lh);
      white-space: nowrap;
    }
    /* 水位＝箭頭＋數字同行；流量＝僅數字 */
    .wh-metric {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      gap: 0;
      min-width: 0;
      height: var(--wh-line-h);
    }
    .wh-metric:not(.no-arr) {
      flex: 0 0 auto;
      min-width: calc(var(--wh-arr-w) + 1.25em);
    }
    .wh-metric.no-arr {
      flex: 0 0 1.3em;
      width: 1.3em;
      justify-content: center;
    }
    .wh-line .wv,
    .wh-line .fv {
      display: block;
      font-size: var(--wh-num-fs);
      font-weight: 400;
      text-align: center;
      line-height: var(--wh-num-lh);
      height: var(--wh-line-h);
      font-variant-numeric: tabular-nums lining-nums;
    }
    .wh-line .wv {
      width: 1.25em;
      min-width: 1.25em;
      color: var(--text);
    }
    .wh-line .fv {
      width: 100%;
      color: #5b6575;
    }
    .wh-line.pla .wv,
    .wh-line.pla .fv { color: #7b8494; }
    /* 第三行 WP（獨贏+位置混合池）：再淡一級，與獨贏／位置分層 */
    .wh-line.wp .wv,
    .wh-line.wp .fv { color: #8a93a3; }
    .wh-line .muted { color: var(--muted); }
    /* 升＝綠↖，降＝紅↙；預設隱藏佔位，僅十字高亮行／列顯示，減少眼花 */
    .wh-arr {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 var(--wh-arr-w);
      width: var(--wh-arr-w);
      height: var(--wh-line-h);
      font-size: var(--wh-arr-fs);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      pointer-events: none;
      visibility: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Segoe UI Symbol", sans-serif;
    }
    .wh-arr.up { color: #1e8e3e; }
    .wh-arr.down { color: #c0392b; }
    .water-row.is-wh-cross-row .wh-arr:not(.none),
    .whour.is-wh-cross-col .wh-arr:not(.none) {
      visibility: visible;
    }
    /* 水位表十字定位：點選時段格 → 整行＋整列高亮，交叉為焦點 */
    .water-row:not(.head) .whour[data-wh-col] {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    /* 十字高亮：沿用水位頂欄綠系（#3d6b5c／#2f5649／#e8f0ec） */
    .water-row.is-wh-cross-row > .water-lock,
    .water-row.is-wh-cross-row .water-pin,
    .water-row.is-wh-cross-row .wp-odds,
    .water-row.is-wh-cross-row > .whour {
      background: #dce9e2;
    }
    .water-row.alt.is-wh-cross-row > .water-lock,
    .water-row.alt.is-wh-cross-row .water-pin,
    .water-row.alt.is-wh-cross-row .wp-odds,
    .water-row.alt.is-wh-cross-row > .whour {
      background: #d0e0d7;
    }
    .water-board .whour.is-wh-cross-col {
      background: #dce9e2;
    }
    .water-row.alt .whour.is-wh-cross-col {
      background: #d0e0d7;
    }
    .water-row.head .whour.is-wh-cross-col {
      background: #c2d6cb;
      box-shadow: inset 0 -2px 0 #2f5649;
      color: #234438;
    }
    .water-board .whour.is-wh-cross-cell {
      background: #a8c9b6;
      box-shadow: inset 0 0 0 1.5px #2f5649;
      z-index: 2;
    }
    .water-row.is-wh-cross-row > .water-lock {
      box-shadow: 2px 0 4px rgba(45, 62, 80, .06), inset 0 0 0 1px rgba(47, 86, 73, .4);
    }
    /* 點水位數字打開詳情；表頭「水位」仍負責排序 */
    .hrow:not(.head) .cell.scroll-col[data-open="water"] {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hrow:not(.head) .cell.scroll-col[data-open="water"]:active {
      background: rgba(47, 86, 73, .08);
    }
    .horse-sheet-bar {

    .hrow {

    /* 小旗標記整行：一按黃、再按綠、三按復原 */
    .hrow.mark-1 { background: #fde8cc; }
    .hrow.mark-1 .lock-cluster { background: #fde8cc; }
    .hrow.mark-2 { background: #d4efdf; }
    .hrow.mark-2 .lock-cluster { background: #d4efdf; }
    .hrow.alt.mark-1 { background: #f7dcb8; }

    .lock-cluster {

      top: auto;
      z-index: 4;

    /* 資料列：彩衣｜馬號｜騎／練姓氏首字（上騎下練）；馬名跨底 */

      align-items: center;

      width: 32px;
      height: 32px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: #b0b8c4;

    .odds {

      align-items: flex-end;
      justify-content: flex-end;
      gap: 2px;
      line-height: 1.02;
      padding: 0;
      transform: translateX(2px);
      font-variant-numeric: tabular-nums lining-nums;
    }
    /* 內層賠率棧：與外層 cell.odds 分開，避免整格被當 .odds 撐變形 */
    .cell.pin-odds > .odds {
      flex: 0 0 auto;
      max-width: calc(100% - 36px);
      overflow: visible;
    }
    .odds .win,
    .odds .pla {

    }
    .odds .win { color: var(--text); transform: translateY(-7px); }
    .odds .pla { color: #7b8494; transform: translateY(-4px); }
    .odds .win.hot, .odds .pla.hot { color: var(--red); }
    .odds .od-n {
      font: inherit;
      color: inherit;
      font-variant-numeric: tabular-nums lining-nums;
      line-height: 1;
    }
    /* 字符箭頭絕對貼數字右側，不佔版面寬度（外層賠率／水位流量／彈窗賠率共用） */
    .odds .od-tick,
    .scroll-col .wp .od-tick,
    .wp-odds .od-tick {
      position: absolute;
      left: 100%;
      top: 50%;
      margin-top: -0.45em;
      margin-left: 1px;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
      font-family: "Noto Sans TC", "PingFang TC", "Segoe UI Symbol", sans-serif;
    }
    /* 彈窗賠率行高含水位箭頭位，升降箭改對齊數字中線 */
    .wp-odds .od-tick {
      top: calc(var(--wh-num-fs) * var(--wh-num-lh) / 2);
      margin-top: 0;
      transform: translateY(-50%);
    }
    .odds .od-tick.up,
    .scroll-col .wp .od-tick.up,
    .wp-odds .od-tick.up { color: #1e8e3e; }
    .odds .od-tick.down,
    .scroll-col .wp .od-tick.down,
    .wp-odds .od-tick.down { color: #c0392b; }
    /* 賠率刷新後：箭頭呼吸 3 次提示升降更新 */
    .odds .od-tick.fresh,
    .scroll-col .wp .od-tick.fresh,
    .wp-odds .od-tick.fresh {
      animation: odTickBreath .65s ease-in-out 3;
      transform-origin: center center;
    }
    .wp-odds .od-tick.fresh {
      animation-name: odTickBreathWp;
    }
    @keyframes odTickBreath {
      0%, 100% { opacity: 1; transform: scale(1); }
      40% { opacity: .22; transform: scale(1.45); }
      75% { opacity: 1; transform: scale(1); }
    }
    @keyframes odTickBreathWp {
      0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
      40% { opacity: .22; transform: translateY(-50%) scale(1.45); }
      75% { opacity: 1; transform: translateY(-50%) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .odds .od-tick.fresh,
      .scroll-col .wp .od-tick.fresh,
      .wp-odds .od-tick.fresh { animation: none; opacity: 1; }
    }
    .odds .na { color: var(--muted); font-size: 14px; }

    .muted { color: var(--muted); font-weight: 400; }
    .form { letter-spacing: .02em; font-weight: 400; font-variant-numeric: tabular-nums; }
    .comment { font-size: var(--head-fs); font-weight: 400; color: #4a5563; }
    /* 右滑列：列寬隨最長內容；數據到分隔線 = --scroll-col-gap */
    .scroll-col {
      position: relative;
      flex: 0 0 auto;
      width: max-content;
      min-width: 0;
      justify-content: center;
      padding: 0 calc(var(--scroll-col-gap) + var(--scroll-col-rule)) 0 var(--scroll-col-gap);
      overflow: hidden;
    }
    .scroll-col::after {
      content: "";
      position: absolute;
      top: var(--scroll-col-gap); bottom: var(--scroll-col-gap); right: 0;
      width: var(--scroll-col-rule);
      background: #e4e7ec;
      pointer-events: none;
    }
    .scroll-col.num {
      font-variant-numeric: tabular-nums;

    /* 入圍數｜% 等：數據靠右 */
    .scroll-col.end {

    .scroll-col .v {

      white-space: nowrap;

    .scroll-col .v.stacked {

      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      white-space: nowrap;
    }
    .scroll-col .v.stacked .nm,
    .scroll-col .v.stacked .sub {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      font: inherit;
      color: inherit;
      line-height: inherit;
    }
    .scroll-col .v.stacked .sub.delta {
      font-size: 12px;
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: .01em;
    }
    .scroll-col .v.stacked .sub.delta-pos { color: #c0392b; }
    .scroll-col .v.stacked .sub.delta-neg { color: #1e8e3e; }
    /* 預計跑法：文字 + 四枚向左三角（實心位＝跑法） */
    .scroll-col .v.run-style {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;

    }
    .scroll-col .v.run-style .nm {

    .scroll-col .rs-marks {

      height: 9px;
      line-height: 0;
    }
    .scroll-col .rs-tri {

      width: 7px;
      height: 8px;

    }
    .scroll-col .rs-tri polygon {
      stroke: #2a5f8f;
      stroke-width: 1.1;
      stroke-linejoin: round;
    }
    .scroll-col .rs-tri.on polygon {
      fill: #2a5f8f;
    }
    .scroll-col .rs-tri:not(.on) polygon {
      fill: #fff;
    }
    /* 近六賽績＋班次升降：每個近績數字正下方緊跟對應升／平／降圖例 */
    .scroll-col .v.form-class {
      display: inline-flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 0;
      white-space: nowrap;
      line-height: 1.05;
    }
    .scroll-col .fc-seg {

    .scroll-col .fc-seg .fc-num {

    }
    .scroll-col .fc-sep {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 1px;
      font: inherit;
      color: inherit;
      line-height: 1.05;
      user-select: none;
    }
    .scroll-col .fc-m {
      display: block;
      width: 7px;
      height: 8px;
      flex: 0 0 auto;

    }
    .scroll-col .fc-m.up polygon {
      fill: #1e8e3e;

    .scroll-col .fc-m.down polygon {
      fill: #c0392b;

      stroke-linejoin: round;
    }
    .scroll-col .fc-m.flat rect {
      fill: #8a93a0;
    }
    /* 水位／流量：獨贏上、位置下；右對齊＋▲▼（與賠率欄同款，零占位） */
    .scroll-col .wp {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 2px;
      line-height: 1.02;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;

    .scroll-col .wp .w,

    .silk-1 { background:#e10600; } .silk-2 { background:#111; }
    .silk-3 { background:#0057b8; } .silk-4 { background:#ffd100; color:#222; }
    .silk-5 { background:#00a651; } .silk-6 { background:#e4007c; }
    .silk-7 { background:#00b5e2; color:#083044; } .silk-8 { background:#8a8d8f; }
    .silk-9 { background:#ff6a00; } .silk-10 { background:#6f2c91; }
    .silk-11 { background:#a8d08d; color:#1a3318; } .silk-12 { background:#7a1f2b; }
    .silk-13 { background:#fff; color:#111; box-shadow: inset 0 0 0 1px #999; }
    .silk-14 { background:#c5a028; color:#1a1408; }

    /* 連贏區：表內橫豎滾動；首行／首列 CSS sticky（20 匹可鎖定標號） */
    .qin-panel {
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      width: 100%;
      background: #eef1f5;
      border-top: 8px solid #eef1f5;
      padding: 0 0 10px;
      --qin-cell: 24px;
      --qin-title-w: 24px;
    }
    .qin-block {
      background: #fff;
      position: relative;
      /* 裁切邊緣回彈時 sticky 標號「漂浮」溢出 */
      overflow: hidden;
    }
    .qin-x {
      overflow: auto;
      /* 禁邊緣回彈漂浮；表內仍用 touch 慣性跟手 */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    .qin-tbl {
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
      font-variant-numeric: tabular-nums lining-nums;
      line-height: 1;
    }
    /* 明確列寬，避免角標 colspan=2 把首兩列均分導致右側留白 */
    .qin-tbl col.qin-col-rh {
      width: var(--qin-title-w);
    }
    .qin-tbl col.qin-col-c {
      width: var(--qin-cell);
    }
    .qin-tbl th,
    .qin-tbl td {
      border: 1px solid #cfd6e0;
      text-align: center;
      vertical-align: middle;
      padding: 0;
      height: var(--qin-cell);
      min-width: var(--qin-cell);
      width: var(--qin-cell);
      font-weight: 400;
      color: var(--text);
      background: #fff;
      box-sizing: border-box;
    }
    /* 角標：位置Q／正Q 左右波動開關（橫跨首列＋原「1」位） */
    .qin-tbl .qin-switch-cell {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 4;
      padding: 0;
      vertical-align: middle;
      background: #cfd5de;
      min-width: calc(var(--qin-title-w) + var(--qin-cell));
      width: calc(var(--qin-title-w) + var(--qin-cell));
      box-shadow: 0 2px 4px rgba(45, 62, 80, .10), 3px 0 6px rgba(45, 62, 80, .12);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .qin-mode-switch {
      display: block;
      width: 100%;
      height: 100%;
      min-height: var(--qin-cell);
      margin: 0;
      padding: 2px;
      border: 0;
      background: transparent;
      cursor: pointer;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .qin-sw-track {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: calc(var(--qin-cell) - 4px);
      border-radius: 3px;
      background: #b8c0cb;
      overflow: hidden;
    }
    .qin-sw-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: var(--orange);
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(45, 62, 80, .18);
      transform: translateX(0);
      transition: transform .22s cubic-bezier(.4, .0, .2, 1);
      pointer-events: none;
      z-index: 0;
    }
    .qin-tbl[data-qin-mode="qin"] .qin-sw-thumb,
    .qin-mode-switch[data-qin-side="qin"] .qin-sw-thumb {
      transform: translateX(100%);
    }
    .qin-sw-lab {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1px;
      font: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .01em;
      line-height: 1.05;
      color: #5b6575;
      white-space: nowrap;
      transition: color .18s ease;
      user-select: none;
    }
    .qin-tbl[data-qin-mode="qpl"] .qin-sw-lab[data-qin-mode="qpl"],
    .qin-tbl[data-qin-mode="qin"] .qin-sw-lab[data-qin-mode="qin"],
    .qin-mode-switch[data-qin-side="qpl"] .qin-sw-lab[data-qin-mode="qpl"],
    .qin-mode-switch[data-qin-side="qin"] .qin-sw-lab[data-qin-mode="qin"] {
      color: #fff;
      font-weight: 800;
    }
    .qin-mode-switch:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -3px;
    }
    .qin-mode-switch:active .qin-sw-thumb {
      filter: brightness(.96);
    }
    /* 首列「1」位：豎排「指數」灰底＋右側 1/3 藍底馬號，非按鈕 */
    .qin-tbl .qin-rh.qin-idx-lab {
      padding: 0;
      background: #cfd5de;
      color: #5b6575;
      cursor: default;
      user-select: none;
      overflow: hidden;
    }
    .qin-idx-inner {
      display: flex;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: var(--qin-cell);
    }
    .qin-idx-txt {
      flex: 2 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 1px 0;
      background: #cfd5de;
      color: #5b6575;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.05;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }
    .qin-idx-no {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-width: 0;
      background: #5b8fc7;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }
    .qin-tbl .qin-rh.qin-idx-lab.scratch .qin-idx-no {
      background: #9aa3af;
      color: #e8eaed;
    }
    .qin-tbl .qin-h {
      background: #5b8fc7;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
    }
    /* 首行馬號：豎滑鎖定 */
    .qin-tbl .qin-ch {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #5b8fc7;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      box-shadow: 0 2px 4px rgba(45, 62, 80, .10);
    }
    /* 首列馬號：橫滑鎖定 */
    .qin-tbl .qin-rh {
      position: sticky;
      left: 0;
      z-index: 3;
      background: #5b8fc7;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      min-width: var(--qin-title-w);
      width: var(--qin-title-w);
      box-shadow: 3px 0 6px rgba(45, 62, 80, .12);
    }
    .qin-tbl .qin-empty {
      border-color: transparent;
      background: transparent;
    }
    .qin-tbl .qin-c.hot,
    .qin-tbl .qin-c.idx-r { background: #e74c3c; color: #fff; }
    .qin-tbl .qin-c.drop20,
    .qin-tbl .qin-c.idx-g { background: #2ecc71; color: #fff; }
    .qin-tbl .qin-c.drop50,

    /* 下三角指數格：未上色時用淡底；上色規則須壓過淡底（同特異度時後寫生效） */
    .qin-tbl .qin-c.idx-cell {
      background: #eef4fa;
      color: #3d5a80;
    }
    .qin-tbl .qin-c.idx-cell.idx-r {
      background: #e74c3c;
      color: #fff;
    }
    .qin-tbl .qin-c.idx-cell.idx-g {
      background: #2ecc71;
      color: #fff;
    }
    .qin-tbl .qin-c.idx-cell.idx-b {
      background: #c4a035;
      color: #fff;
    }
    .qin-tbl .qin-c[data-qin-key] {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    /* 退出駒：保留馬號座標，賠率／指數灰顯「—」（對齊列表退出態） */
    .qin-tbl .qin-ch.scratch,
    .qin-tbl .qin-rh.scratch,
    .qin-tbl .qin-h.scratch {
      opacity: .45;
      text-decoration: line-through;
    }
    .qin-tbl .qin-c.scratch,
    .qin-tbl .qin-c.idx-cell.scratch {
      background: #f0f2f5;
      color: #9aa3b0;
      cursor: default;

    }
    .qin-tbl .qin-c.scratch[data-qin-key] {
      cursor: default;
    }
    /* 輕點座標：框外 outline 呼吸，不佔格內空間（密格如 20 匹仍可讀數字） */
    .qin-tbl .qin-c.is-qin-focus {
      position: relative;
      z-index: 5;

      const k = rowMarkKey(no);

      return next;
    }

      const no = Number(r.no) || 0;

      const wpF0 = numOrNull(r.wpFlow);
      const winW = winW0 == null ? null : clampInt(winW0 + hourIdx * 1.2 + jitter, 40, 99);

    /* 連贏示意：由獨贏／位置合成三角矩陣；日後可換成真實 QIN／QPL 盤 */

    /* 單一矩陣：上三角＝賠率，下三角＝指數；角標開關切正Q／位置Q；首列「1」位為靜態指數 */
    function renderQinTable(qin) {

            html += '<th class="qin-h' + sc + '">' + esc(rowHorse) + "</th>";
            continue;
          }
          const key = qinPairKey(rowHorse, colHorse);
          const scratched = qinPairInvolvesScratch(qin, rowHorse, colHorse);
          const od = scratched ? null : qin.oddsMap[key];

    function renderQinLegend() {

    function refreshQinPanel() {
      const panel = document.getElementById("qinPanel");
      const tbl = panel && panel.querySelector(".qin-tbl");
      if (!panel || !tbl || !el.boardMain) return;

      /* 就地改數值／按鈕態，不拆 qinX，避免 replace 瞬間撐高把整頁捲動上推 */
      const boardSt = el.board.scrollTop;
      const qinX = document.getElementById("qinX");
      const sl = qinX ? qinX.scrollLeft : 0;
      const st = qinX ? qinX.scrollTop : 0;
      const keepFocus = qinFocusKey;
      const active = document.activeElement;
      if (active && panel.contains(active) && typeof active.blur === "function") active.blur();

      const qin = buildQinPairs();
      const useQpl = qin.mode === "qpl";
      const oddsLab = useQpl ? "連贏位置" : "連贏";
      const idxLab = useQpl ? "位置指數" : "連贏指數";

      tbl.setAttribute("data-qin-mode", qin.mode || "qin");
      tbl.setAttribute("aria-label", oddsLab + "賠率（上三角）與" + idxLab + "（下三角）");

      panel.querySelectorAll("button.qin-mode-switch").forEach(function (btn) {

      });

      tbl.querySelectorAll("td.qin-c[data-qin-key]").forEach(function (td) {
        const key = td.getAttribute("data-qin-key");
        const kind = td.getAttribute("data-qin-kind");
        const parts = String(key || "").split("-");
        const a = Number(parts[0]);
        const b = Number(parts[1]);
        const scratched = qinPairInvolvesScratch(qin, a, b);
        const keptFocus = !scratched && td.classList.contains("is-qin-focus");
        if (scratched) {
          td.className = "qin-c" + (kind === "idx" ? " idx-cell" : "") + " scratch";
          td.textContent = "—";
          td.setAttribute("data-qin-scratch", "1");
          td.setAttribute("aria-disabled", "true");
          td.setAttribute("aria-label", "退出 " + key);
          td.removeAttribute("role");
          td.removeAttribute("tabindex");

        }
        td.removeAttribute("data-qin-scratch");
        td.removeAttribute("aria-disabled");
        td.setAttribute("role", "button");
        td.setAttribute("tabindex", "0");
        const od = qin.oddsMap[key];
        if (kind === "odds") {
          let cls = "qin-c";
          if (key === qin.hotKey) cls += " hot";
          else {
            const drop = qinDropClass(a, b, currentRace);
            if (drop) cls += " " + drop;
          }
          if (keptFocus) cls += " is-qin-focus";
          td.className = cls;
          td.textContent = fmtQinOdds(od);
          td.setAttribute("aria-label", oddsLab + " " + key);
        } else {
          const idx = synthQinIndex(od);
          let cls = "qin-c idx-cell";
          const ic = qinIndexClass(idx);
          if (ic) cls += " " + ic;
          if (keptFocus) cls += " is-qin-focus";
          td.className = cls;
          td.textContent = idx == null ? "—" : String(idx);
          td.setAttribute("aria-label", idxLab + " " + key);
        }
      });

      /* 表頭／對角退出態隨資料刷新（換場後結構不變時） */
      const nos = qin.nos || [];
      tbl.querySelectorAll("th.qin-ch").forEach(function (th, idx) {
        const no = nos[idx + 1];
        th.classList.toggle("scratch", qinHorseScratched(qin, no));
      });
      const idxLabTh = tbl.querySelector("th.qin-rh.qin-idx-lab");
      if (idxLabTh) {
        const no0 = nos[0];
        idxLabTh.classList.toggle("scratch", qinHorseScratched(qin, no0));
        const noEl = idxLabTh.querySelector(".qin-idx-no");
        if (noEl && no0 != null) noEl.textContent = String(no0);
      }
      tbl.querySelectorAll("th.qin-rh:not(.qin-idx-lab)").forEach(function (th, idx) {
        const no = nos[idx + 1];
        th.classList.toggle("scratch", qinHorseScratched(qin, no));
      });
      tbl.querySelectorAll("th.qin-h").forEach(function (th, idx) {
        const no = nos[idx];
        th.classList.toggle("scratch", qinHorseScratched(qin, no));
      });

      const legend = panel.querySelector(".qin-legend");
      if (legend) {
        const wrap = document.createElement("div");
        wrap.innerHTML = renderQinLegend();
        if (wrap.firstElementChild) legend.replaceWith(wrap.firstElementChild);
      }

      if (qinX) {
        qinX.scrollLeft = sl;
        qinX.scrollTop = st;
      }
      el.board.scrollTop = boardSt;
      qinFocusKey = keepFocus;
      if (keepFocus) setQinPairFocus(keepFocus, tbl);
    }
    function setQinMode(mode) {
      if (mode !== "qin" && mode !== "qpl") return;
      if (qinMode === mode) return;
      qinMode = mode;
      refreshQinPanel();
    }
    function bindQinModeSwitch() {
      const panel = document.getElementById("qinPanel");
      if (!panel || panel.dataset.modeBound === "1") return;
      panel.dataset.modeBound = "1";
      /* 整塊角標或圖例右側大號開關，任意點擊均切換（與角標聯動） */
      function toggleQinMode(ev) {
        const hit = ev.target && ev.target.closest
          ? (ev.target.closest(".qin-switch-cell") ||
             ev.target.closest("button.qin-mode-switch") ||
             ev.target.closest(".qin-legend-actions"))
          : null;
        if (!hit || !panel.contains(hit)) return;
        ev.preventDefault();
        ev.stopPropagation();
        setQinMode(qinMode === "qin" ? "qpl" : "qin");
      }
      panel.addEventListener("click", toggleQinMode);
    }
    /* 連贏格寬規矩：
       - 任何時候（含字體縮放後）首列與各數據列等寬均分
       - ≤14 匹：等分鋪滿可用寬
       - >14 匹：鎖定首行／首列，橫滑看其餘；列寬仍等寬（按 14 匹＋首列密度） */
    function fitQinTableWidths() {
      const panel = document.getElementById("qinPanel");
      const tbl = panel && panel.querySelector(".qin-tbl");
      const qinX = document.getElementById("qinX");
      if (!panel || !tbl) return;
      const n = Number(tbl.getAttribute("data-n") || 0);
      if (n < 2) return;
      const colCount = n + 1; /* 首列馬號 + n 匹 */
      const avail = Math.max(panel.clientWidth, 200);
      let cell;
      let total;
      if (n <= QIN_FIT_N) {
        cell = avail / colCount;
        total = avail;
      } else {
        cell = Math.max(1, Math.floor(avail / (QIN_FIT_N + 1)));
        total = cell * colCount;
      }
      const titleW = cell; /* 與數據列同寬 */
      panel.style.setProperty("--qin-title-w", titleW + "px");
      panel.style.setProperty("--qin-cell", cell + "px");
      tbl.style.width = total + "px";
      tbl.style.minWidth = total + "px";
      const fs = cell >= 28 ? 12 : cell >= 24 ? 11 : 10;
      tbl.style.fontSize = fs + "px";
      if (qinX) {
        /* 約鎖 14 列可視高度，超出（如 20 匹）在格內豎滑，首行 sticky 才會生效 */
        const rowsVisible = Math.min(n, QIN_FIT_N);
        qinX.style.maxHeight = (cell * (rowsVisible + 1) + 2) + "px";
      }
    }
    /* 輕點連贏格：同座標賠率／指數雙邊高亮提醒 */
    let qinFocusKey = "";
    function clearQinPairFocus(tbl) {
      const root = tbl || document.querySelector("#qinPanel .qin-tbl");
      if (!root) return;
      root.querySelectorAll(".qin-c.is-qin-focus").forEach(function (el) {
        el.classList.remove("is-qin-focus");
      });
      qinFocusKey = "";
    }
    function setQinPairFocus(key, tbl) {
      const root = tbl || document.querySelector("#qinPanel .qin-tbl");
      if (!root || !key) return;
      clearQinPairFocus(root);
      const nodes = root.querySelectorAll('.qin-c[data-qin-key="' + key + '"]');
      if (!nodes.length) return;
      nodes.forEach(function (el) { el.classList.add("is-qin-focus"); });
      qinFocusKey = key;
    }
    function bindQinPairFocus() {
      const tbl = document.querySelector("#qinPanel .qin-tbl");
      const qinX = document.getElementById("qinX");
      if (!tbl) return;
      if (qinFocusKey) setQinPairFocus(qinFocusKey, tbl);
      if (tbl.dataset.focusBound === "1") return;
      tbl.dataset.focusBound = "1";
      let tapMoved = false;
      if (qinX) {
        qinX.addEventListener("touchstart", function () { tapMoved = false; }, { passive: true });
        qinX.addEventListener("touchmove", function () { tapMoved = true; }, { passive: true });
      }
      function onActivate(cell) {
        if (!cell) return;
        if (cell.getAttribute("data-qin-scratch") === "1" || cell.classList.contains("scratch")) return;
        const key = cell.getAttribute("data-qin-key");
        if (!key) return;
        if (qinFocusKey === key) clearQinPairFocus(tbl);
        else setQinPairFocus(key, tbl);
      }
      tbl.addEventListener("click", function (ev) {
        if (tapMoved) return;
        const cell = ev.target && ev.target.closest ? ev.target.closest("td.qin-c[data-qin-key]") : null;
        if (!cell || !tbl.contains(cell)) return;
        onActivate(cell);
      });
      tbl.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        const cell = ev.target && ev.target.closest ? ev.target.closest("td.qin-c[data-qin-key]") : null;
        if (!cell || !tbl.contains(cell)) return;
        ev.preventDefault();
        onActivate(cell);
      });
    }

    /* 豎向觸邊 1:1 帶頁；松手短慣性且可被新觸摸立刻打斷；橫向觸邊只擋回彈 */
    function bindQinOverscrollGuard() {
      const qinX = document.getElementById("qinX");
      const wrap = el.board;
      if (!qinX || !wrap || qinX.dataset.overscrollBound === "1") return;
      qinX.dataset.overscrollBound = "1";

      let startX = 0;
      let startY = 0;
      let lastY = 0;
      let axis = "";
      let samples = [];
      let wrapInertiaRaf = 0;
      let inertiaVel = 0;
      const DECEl = 0.994;

      function stopWrapInertia() {
        if (!wrapInertiaRaf) return;
        cancelAnimationFrame(wrapInertiaRaf);
        wrapInertiaRaf = 0;
        inertiaVel = 0;
      }

      function pushSample(y, t) {
        samples.push({ y: y, t: t });
        while (samples.length > 1 && t - samples[0].t > 80) samples.shift();
      }

      function sampleFingerVel() {
        if (samples.length < 2) return 0;
        const a = samples[0];
        const b = samples[samples.length - 1];
        const dt = b.t - a.t;
        if (dt < 12) return 0;
        return (b.y - a.y) / dt;
      }

      function startWrapInertia(fingerVelY) {
        stopWrapInertia();
        let v = fingerVelY;
        if (v > 2.2) v = 2.2;
        else if (v < -2.2) v = -2.2;
        if (Math.abs(v) < 0.08) return;
        inertiaVel = v;
        let prev = performance.now();
        function step(now) {
          const dt = Math.min(34, Math.max(0, now - prev));
          prev = now;
          v *= Math.pow(DECEl, dt);
          inertiaVel = v;
          wrap.scrollTop -= v * dt;
          if (Math.abs(v) > 0.04) wrapInertiaRaf = requestAnimationFrame(step);
          else {
            wrapInertiaRaf = 0;
            inertiaVel = 0;
          }
        }
        wrapInertiaRaf = requestAnimationFrame(step);
      }

      /* 整頁任意新觸摸／滾輪立刻打斷慣性，避免頂掉用戶新操作 */
      wrap.addEventListener("touchstart", stopWrapInertia, { passive: true, capture: true });
      wrap.addEventListener("pointerdown", stopWrapInertia, { passive: true, capture: true });
      wrap.addEventListener("wheel", stopWrapInertia, { passive: true, capture: true });

      qinX.addEventListener("touchstart", function (ev) {
        stopWrapInertia();
        axis = "";
        samples = [];
        if (!ev.touches || !ev.touches[0]) return;
        startX = ev.touches[0].clientX;
        startY = ev.touches[0].clientY;
        lastY = startY;
        pushSample(startY, performance.now());
      }, { passive: true });

      qinX.addEventListener("touchmove", function (ev) {
        if (!ev.touches || !ev.touches[0]) return;
        const x = ev.touches[0].clientX;
        const y = ev.touches[0].clientY;
        const now = performance.now();
        const dx = x - startX;
        const dy = y - startY;
        const deltaY = y - lastY;
        lastY = y;
        pushSample(y, now);

        /* 慣性進行中一旦再拖，立刻交出控制權 */
        if (wrapInertiaRaf) stopWrapInertia();

        if (!axis) {
          if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
          axis = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
        }

        const maxL = Math.max(0, qinX.scrollWidth - qinX.clientWidth);
        const maxT = Math.max(0, qinX.scrollHeight - qinX.clientHeight);
        const sl = qinX.scrollLeft;
        const st = qinX.scrollTop;

        if (axis === "h") {
          if ((sl <= 0 && dx > 0) || (sl >= maxL - 0.5 && dx < 0)) ev.preventDefault();
          return;
        }

        const atTop = st <= 0;
        const atBottom = st >= maxT - 0.5;
        if ((atTop && deltaY > 0) || (atBottom && deltaY < 0)) {
          wrap.scrollTop -= deltaY;
          ev.preventDefault();
        }
      }, { passive: false });

      qinX.addEventListener("touchend", function () {
        const maxT = Math.max(0, qinX.scrollHeight - qinX.clientHeight);
        const st = qinX.scrollTop;
        const atTop = st <= 0;
        const atBottom = st >= maxT - 0.5;
        const vel = sampleFingerVel();
        /* 僅在手指仍觸邊松手時給很短續滑；不再把表內原生慣性自動甩到整頁 */
        if (axis === "v" && ((atTop && vel > 0.1) || (atBottom && vel < -0.1))) {
          startWrapInertia(vel * 0.85);
        }
        samples = [];
      }, { passive: true });
      qinX.addEventListener("touchcancel", function () {
        samples = [];
        stopWrapInertia();
      }, { passive: true });

      qinX.addEventListener("wheel", function (ev) {
        stopWrapInertia();
        const maxT = Math.max(0, qinX.scrollHeight - qinX.clientHeight);
        const st = qinX.scrollTop;
        const atTop = st <= 0;
        const atBottom = st >= maxT - 0.5;
        if ((atTop && ev.deltaY < 0) || (atBottom && ev.deltaY > 0)) {
          wrap.scrollTop += ev.deltaY;
          ev.preventDefault();
        }
      }, { passive: false });
    }

    /* 豎向：board-head-pin CSS sticky；橫向：board-head-x.scrollLeft 跟隨 board-x（無 transform） */
    let headScrollBound = false;
    function syncHeadScrollLeft() {
      const body = el.boardX;
      const headX = el.boardHeadX;
      if (!body || !headX) return;
      const sl = body.scrollLeft || 0;
      if (headX.scrollLeft !== sl) headX.scrollLeft = sl;
    }
    function bindHorseHeadScroll() {
      if (!el.boardX || !el.boardHeadX) return;
      if (!headScrollBound) {
        headScrollBound = true;
        el.boardX.addEventListener("scroll", syncHeadScrollLeft, { passive: true });
      }
      syncHeadScrollLeft();
    }

    function renderBoard() {
      const hot = bestOdds();
      const rows = sortedRows();
      const sl = el.boardX ? el.boardX.scrollLeft : 0;
      const st = el.board.scrollTop;
      const lockHead =
        '<div class="lock-cluster">' +
          '<div class="cell pin-id head-split' + headOn("no") + '">' +
            headBtn("no", "馬號", false) + headStatic("馬名") + sortHit("no") +
          "</div>" +
          '<div class="cell pin-odds' + headOn("draw") + '">' +
            '<div class="odds-labs">' + headStatic("獨贏") + headStatic("位置") + "</div>" +
            '<button type="button" class="draw-sort sortable' + (sortKey === "draw" ? " on" : "") +
            '" data-sort="draw" aria-sort="' +
            (sortKey === "draw" ? (sortDir > 0 ? "ascending" : "descending") : "none") +
            '"><span class="draw-lab"><span>檔</span><span>位</span></span>' +
            sortIco("draw") + "</button></div></div>";
      const scrollHeadCells = SCROLL_COLS.map((c) =>
        '<div class="cell ' + c.cls + headOn(c.key) + '">' + headBtn(c.key, c.label) + "</div>"
      ).join("");
      const head =
        '<div class="hrow head">' +
          lockHead +
          '<div class="board-head-x" id="boardHeadX">' +
            '<div class="head-scroll-inner">' + scrollHeadCells + "</div>" +
          "</div>" +
        "</div>";

      const body = rows.map((r, i) => {
        const alt = i % 2 ? " alt" : "";
        const scratch = r.scratched ? " scratched" : "";
        const mark = getRowMark(r.no);
        const markCls = mark === 1 ? " mark-1" : mark === 2 ? " mark-2" : "";
        const winHot = !r.scratched && r.win === hot.minW ? " hot" : "";
        const plaHot = !r.scratched && r.place === hot.minP ? " hot" : "";
        const odds = r.scratched || r.win == null
          ? '<div class="odds"><span class="na">—</span></div>'
          : '<div class="odds">' +
              oddsLineHtml("win", r.win, "win", winHot, r.winTick, r._winTickFresh) +
              oddsLineHtml("pla", r.place, "place", plaHot, r.placeTick, r._placeTickFresh) +
            "</div>";
        const name = '<span class="hname">' + esc(r.name) + "</span>";
        const lock =
          '<div class="lock-cluster">' +
            '<div class="cell pin-id' + colOn("no") + '" data-no="' + esc(r.no) + '" role="button" tabindex="0" aria-label="查看 ' + esc(r.name) + ' 詳情">' + silkTag(r) +
            '<span class="hno"><span>' + esc(r.no) + "</span></span>" +
            jtInitialsHtml(r) +
            name + "</div>" +
            '<div class="cell odds pin-odds' + colOn("draw") + '">' + odds +
            '<div class="draw-flag-col">' +
              renderRowFlag(r.no, mark) +
              '<span class="draw-no"><span>' + esc(r.draw) + "</span></span>" +
            "</div></div>" +
          "</div>";
        const cells = SCROLL_COLS.map((c) => {
          const openWater = c.key === "water"
            ? ' data-open="water" role="button" tabindex="0" aria-label="查看 ' + esc(r.name) + ' 水位詳情"'
            : "";
          return '<div class="cell ' + c.cls + colOn(c.key) + '"' + openWater + ">" + cellValue(c, r) + "</div>";
        }).join("");
        return '<div class="hrow' + alt + scratch + markCls + '" data-no="' + esc(r.no) + '">' + lock + cells + "</div>";
      }).join("");

      el.boardMain.innerHTML =
        '<div class="board-horses" id="boardHorses">' +
          '<div class="board-head-pin" id="boardHead">' + head + "</div>" +
          '<div class="board-x" id="boardX">' + body + "</div>" +
        "</div>" +
        renderQinPanelHtml();
      el.boardX = document.getElementById("boardX");
      el.boardHeadX = document.getElementById("boardHeadX");
      headScrollBound = false;
      fitScrollColWidths();
      fitQinTableWidths();
      if (el.boardX) el.boardX.scrollLeft = sl;
      syncHeadScrollLeft();
      el.board.scrollTop = st;

      document.querySelectorAll("#board [data-sort]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-sort");
          if (!key || key === "name" || key === "place" || key === "win" || key === "drawWinPct") return;
          if (sortKey === key) sortDir = -sortDir;
          else { sortKey = key; sortDir = 1; }
          renderBoard();
        });
      });
      bindWaterSheetOpens();
      bindHorseSheetOpens();
      bindHorseHeadScroll();
      bindRowFlags();
      bindQinOverscrollGuard();
      bindQinPairFocus();
      bindQinModeSwitch();
      if (isWaterSheetOpen()) {
        syncWaterSheetTop();
        fillWaterSheet();
      }
    }

    function applyRowMarkClass(row, mark) {
      if (!row) return;
      row.classList.remove("mark-1", "mark-2");
      if (mark === 1) row.classList.add("mark-1");
      else if (mark === 2) row.classList.add("mark-2");
    }
    function bindRowFlags() {
      const root = document.getElementById("boardX");
      if (!root || root.dataset.flagBound === "1") return;
      root.dataset.flagBound = "1";
      root.addEventListener("click", function (ev) {
        const btn = ev.target && ev.target.closest ? ev.target.closest("button.row-flag[data-no]") : null;
        if (!btn || !root.contains(btn)) return;
        ev.preventDefault();
        ev.stopPropagation();
        const no = btn.getAttribute("data-no");
        if (no == null || no === "") return;
        const mark = cycleRowMark(no);
        btn.setAttribute("data-mark", String(mark));
        btn.setAttribute("aria-pressed", mark ? "true" : "false");
        btn.setAttribute(
          "aria-label",
          mark === 1 ? "黃標，再點改綠標" : mark === 2 ? "綠標，再點取消" : "標記此馬"
        );
        const row = btn.closest(".hrow");
        applyRowMarkClass(row, mark);
      });
    }

    applyColFitRule();
    renderPills();
    renderMeta();
    renderBoard();
    /* 無實時賠率時：?demoOddsTick=1 自動演示刷新呼吸；控制台也可調 window.simulateOddsTickRefresh() */
    try {
      window.simulateOddsTickRefresh = simulateOddsTickRefresh;
      const q = new URLSearchParams(location.search || "");
      if (q.get("demoOddsTick") === "1" || q.get("demoOdds") === "1") {
        window.setTimeout(function () { simulateOddsTickRefresh(); }, 500);
        window.setInterval(function () { simulateOddsTickRefresh(); }, 4200);
      }
    } catch (e) {}
    if (el.sheetClose) {
      el.sheetClose.addEventListener("click", closeHorseSheet);
    }
    if (el.waterSheetClose) {
      el.waterSheetClose.addEventListener("click", closeWaterSheet);
    }
    window.addEventListener("resize", function () {
      if (isWaterSheetOpen()) syncWaterSheetTop();
    });
    (function bindTopbarMenu() {
      const btn = document.getElementById("navMenuBtn");
      const menu = document.getElementById("navMenu");
      const back = document.getElementById("navBack");
      if (!btn || !menu) return;
      const themeSwitch = document.getElementById("themeSwitch");
      const themeLabLight = document.getElementById("themeLabLight");
      const themeLabDark = document.getElementById("themeLabDark");
      const THEME_KEY = "j18-racecard-theme";
      function currentTheme() {
        return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      }
      function syncThemeSwitch() {
        const dark = currentTheme() === "dark";
        if (themeSwitch) {
          themeSwitch.setAttribute("aria-pressed", dark ? "true" : "false");
          themeSwitch.setAttribute("aria-label", dark ? "切換淺色模式" : "切換深色模式");
        }
        if (themeLabLight) themeLabLight.classList.toggle("is-on", !dark);
        if (themeLabDark) themeLabDark.classList.toggle("is-on", dark);
      }
      function setTheme(mode) {
        const dark = mode === "dark";
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
        else document.documentElement.removeAttribute("data-theme");
        try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (e) {}
        syncThemeSwitch();
      }
      function toggleTheme() {
        setTheme(currentTheme() === "dark" ? "light" : "dark");
      }
      syncThemeSwitch();
      if (themeSwitch) {
        themeSwitch.addEventListener("click", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          toggleTheme();
        });
      }
      /* 列表縮放：每級 +10px／100px＝+10%，最多 2 級；復原回 0 */
      const LIST_ZOOM_MAX = 2;
      const LIST_ZOOM_STEP_PX = 10;
      let listZoomLevel = 0;
      function listZoomFactor(level) {
        return 1 + (Number(level) || 0) * (LIST_ZOOM_STEP_PX / 100);
      }
      function syncZoomButtons() {
        menu.querySelectorAll("[data-zoom-step]").forEach(function (b) {
          const step = Number(b.getAttribute("data-zoom-step"));
          if (step === 0) b.disabled = listZoomLevel === 0;
          else if (step < 0) b.disabled = listZoomLevel <= 0;
          else b.disabled = listZoomLevel >= LIST_ZOOM_MAX;
        });
      }
      function applyListZoom() {
        const z = listZoomFactor(listZoomLevel);
        const targets = [
          document.getElementById("boardMain"),
          document.getElementById("waterSheetZoom")
        ];
        targets.forEach(function (node) {
          if (!node) return;
          node.style.setProperty("--list-zoom", String(z));
          /* 部分 WebKit 對 CSS 變數 zoom 支援不穩，同步寫入 */
          try { node.style.zoom = String(z); } catch (e) {}
        });
        syncZoomButtons();
        fitScrollColWidths();
        fitQinTableWidths();
        syncHeadScrollLeft();
        /* 殼不 zoom，放大後仍鎖在馬匹列表頂 */
        if (isWaterSheetOpen()) {
          requestAnimationFrame(function () {
            syncWaterSheetTop();
            requestAnimationFrame(syncWaterSheetTop);
          });
        }
      }
      function setListZoomLevel(next) {
        const n = Math.max(0, Math.min(LIST_ZOOM_MAX, Number(next) || 0));
        if (n === listZoomLevel) {
          syncZoomButtons();
          return;
        }
        listZoomLevel = n;
        applyListZoom();
      }
      function setOpen(on) {
        if (on) {
          menu.removeAttribute("hidden");
          btn.setAttribute("aria-expanded", "true");
          syncZoomButtons();
          syncThemeSwitch();
        } else {
          menu.setAttribute("hidden", "");
          btn.setAttribute("aria-expanded", "false");
        }
      }
      function isOpen() {
        return btn.getAttribute("aria-expanded") === "true";
      }
      btn.addEventListener("click", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        setOpen(!isOpen());
      });
      menu.addEventListener("click", function (ev) {
        const zoomBtn = ev.target && ev.target.closest ? ev.target.closest("[data-zoom-step]") : null;
        if (zoomBtn && menu.contains(zoomBtn)) {
          ev.preventDefault();
          ev.stopPropagation();
          const step = Number(zoomBtn.getAttribute("data-zoom-step"));
          if (step === 0) setListZoomLevel(0);
          else setListZoomLevel(listZoomLevel + step);
          return;
        }
        const item = ev.target && ev.target.closest ? ev.target.closest("button[data-nav]") : null;
        if (!item || !menu.contains(item)) return;
        ev.preventDefault();
        setOpen(false);
        /* 示意：先關閉菜單；日後可接路由／彈層 */
        const act = item.getAttribute("data-nav");
        if (act === "service") {
          const anno = document.querySelector(".anno");
          if (anno && typeof anno.scrollIntoView === "function") {
            anno.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        } else if (act === "demoOddsTick") {
          simulateOddsTickRefresh();
        }
      });
      /* 點擊菜單外任意位置（含水位彈窗）立即收回；capture 以免被 stopPropagation 擋住 */
      function closeMenuIfOutside(ev) {
        if (!isOpen()) return;
        const t = ev.target;
        if (btn.contains(t) || menu.contains(t)) return;
        setOpen(false);
      }
      document.addEventListener("pointerdown", closeMenuIfOutside, true);
      document.addEventListener("click", closeMenuIfOutside, true);
      if (back) {
        back.addEventListener("click", function () {
          setOpen(false);
          if (window.history.length > 1) window.history.back();
        });
      }
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape") {
          if (isOpen()) {
            setOpen(false);
            btn.focus();
            return;
          }
          if (isWaterSheetOpen()) {
            closeWaterSheet();
            return;
          }
          closeHorseSheet();
        }
      });
      syncZoomButtons();
      /* renderBoard 重繪後重算欄寬（縮放仍掛在 #boardMain） */
      const main = document.getElementById("boardMain");
      if (main) {
        const mo = new MutationObserver(function () {
          if (listZoomLevel > 0) {
            fitScrollColWidths();
            fitQinTableWidths();
            syncHeadScrollLeft();
          }
        });
        mo.observe(main, { childList: true });
      }
    })();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { renderBoard(); });
    }
    window.addEventListener("resize", function () {
      fitQinTableWidths();
      syncHeadScrollLeft();
    });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="noindex" />
  <title>排位 · J18</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav: #3d5a80;
      --nav-2: #334b6b;
      --page: #eef1f5;
      --text: #2c3340;
      --muted: #8a93a3;
      --blue: #5ba3d9;
      --blue-2: #3b8fd4;
      --green: #5cb85c;
      --orange: #e88b2a;
      --red: #e74c3c;
      --place: #27ae60;
      --line: #e4e7ec;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      /* 左鎖兩欄：馬號上馬名下；獨贏上位置下左、檔位豎排右 */
      --pin-id: 57px;
      --pin-odds: 56px;
      --pin-w: calc(var(--pin-id) + var(--pin-odds));
      --head-fs: 13px;
      /* 右滑列規則：最長數據到分隔線固定 2px（JS COL_FIT 同步） */
      --scroll-col-gap: 2px;
      --scroll-col-rule: 1px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      overflow: hidden;
      background: #d8dee6; color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex; flex-direction: column;
      max-width: 430px; margin: 0 auto;
      background: var(--page);
      min-height: 100%;
      box-shadow: 0 0 0 1px rgba(45,62,80,.12);
    }
    button { font-family: inherit; }

    .topbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 44px; padding: 0 10px;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff; z-index: 30;
    }
    .topbar .side { width: 64px; font-size: 15px; font-weight: 700; }
    .topbar .side.r { text-align: right; opacity: .9; }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .06em; }

    /* 頁眉下公告跑馬燈（隨列表滾動，不鎖定） */
    .anno {
      display: flex;
      align-items: stretch;
      height: 28px;
      background: #fff6d6;
      border-bottom: 1px solid #edd9a0;
      overflow: hidden;
    }
    .anno-lab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      background: #f0dfa0;
      color: #3d5a80;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    .anno-track {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 8px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 8px), transparent);
    }
    .anno-run {
      display: inline-flex;
      align-items: center;
      gap: 56px;
      white-space: nowrap;
      will-change: transform;
      animation: annoMarquee 22s linear infinite;
      color: #d32f2f;
      font-size: 13px;
      font-weight: 400;
      line-height: 1;
      padding-left: 10px;
    }
    .anno-run span { flex: 0 0 auto; }
    @keyframes annoMarquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .anno-run { animation: none; transform: none; }
    }

    .subhead {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 8px 10px 10px;
    }

    .race-pills { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .race-pills button {
      width: 32px; height: 26px; border: 0; border-radius: 6px; cursor: pointer;
      font-weight: 800; font-size: 13px; color: #fff; background: var(--green);
    }
    .race-pills button.active { background: var(--blue); }
    .race-pills button.demo { background: var(--orange); }
    .race-pills button.demo.active { background: var(--blue); }

    .meta {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-top: 8px; font-size: 12px; line-height: 1.45; color: #5b6575;
    }

    /* 表格區殼：表體 + 馬匹詳情彈層同尺寸 */
    .board-shell {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    /* 縱向：board-wrap；橫向馬匹：board-x；連贏在 board-x 外，左右滑互不干擾 */
    .board-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: clip;
      overflow-y: auto;
      overscroll-behavior: none;
      overflow-anchor: none;
      -webkit-overflow-scrolling: touch;
      background: #fff;
    }
    @supports not (overflow-x: clip) {
      .board-wrap { overflow-x: hidden; }
    }
    .board-x {
      overflow-x: auto;
      overflow-y: clip;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
      background: #fff;
    }
    @supports not (overflow-y: clip) {
      .board-x { overflow-y: hidden; }
    }
    /* 馬匹區塊：表頭在 board-x 外 CSS sticky（豎鎖原生）；
       右表頭用獨立 overflow-x + scrollLeft 跟隨 body（非 transform，減少果凍） */
    .board-horses {
      position: relative;
      background: #fff;
    }
    .board-head-pin {
      position: sticky;
      top: 0;
      z-index: 7;
      background: #eef3f8;
      overflow: hidden;
    }
    .board-head-pin .hrow.head {
      position: relative;
      top: auto;
      z-index: 7;
      width: 100%;
      min-width: 0;
    }
    .board-head-pin .lock-cluster {
      position: relative;
      left: auto;
      z-index: 8;
      background: #eef3f8;
    }
    .board-head-x {
      flex: 1 1 auto;
      min-width: 0;
      height: 47px;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      pointer-events: none;
    }
    .board-head-x::-webkit-scrollbar { display: none; }
    .board-head-x .head-scroll-inner {
      display: flex;
      align-items: stretch;
      height: 100%;
      min-width: max-content;
    }
    .board-head-pin button,
    .board-head-pin .sort-hit {
      pointer-events: auto;
    }

    .horse-sheet {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: inset 0 1px 0 rgba(45, 62, 80, .08);
      animation: horseSheetIn .22s ease-out;
    }
    .horse-sheet[hidden] { display: none !important; }
    @keyframes horseSheetIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .horse-sheet-bar {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 44px 12px 12px;
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff;
    }
    .horse-sheet-silk {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      background-color: transparent;
      background-size: contain;
      background-position: left top;
      background-repeat: no-repeat;
    }
    .horse-sheet-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      font-size: 14px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .horse-sheet-title {
      min-width: 0;
      flex: 1 1 auto;
    }
    .horse-sheet-title .nm {
      display: block;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: .02em;
      line-height: 1.15;
    }
    .horse-sheet-title .sub {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      opacity: .88;
      line-height: 1.25;
    }
    .horse-sheet-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 6px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .horse-sheet-close:active { background: rgba(255,255,255,.28); }
    .horse-sheet-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 10px 10px 16px;
      background: #f4f6f8;
    }
    .horse-sheet-odds {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .horse-sheet-odds .box {
      background: #fff;
      border: 1px solid var(--line);
      padding: 10px 8px;
      text-align: center;
    }
    .horse-sheet-odds .k {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .horse-sheet-odds .v {
      display: block;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }
    .horse-sheet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }
    .horse-sheet-grid .item {
      background: #fff;
      padding: 9px 10px;
      min-width: 0;
    }
    .horse-sheet-grid .item.wide { grid-column: 1 / -1; }
    .horse-sheet-grid .k {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
      line-height: 1.2;
    }
    .horse-sheet-grid .v {
      display: block;
      font-size: 14px;
      color: var(--text);
      font-weight: 400;
      line-height: 1.3;
      word-break: break-word;
    }
    .horse-sheet-grid .v.muted { color: var(--muted); }

    .hrow {
      display: flex;
      align-items: stretch;
      height: 47px;
      min-width: max-content;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .hrow.alt { background: #f4f6f8; }
    .hrow.scratched .hname { text-decoration: line-through; }
    .hrow.scratched .cell { opacity: .45; }

    .lock-cluster {
      position: sticky;
      left: 0;
      top: auto;
      z-index: 4;
      display: grid;
      grid-template-columns: var(--pin-id) var(--pin-odds);
      flex: 0 0 var(--pin-w);
      width: var(--pin-w);
      min-width: var(--pin-w);
      align-self: stretch;
      background: #fff;
      box-shadow: 6px 0 8px rgba(45, 62, 80, .10);
      isolation: isolate;
    }
    .hrow.alt .lock-cluster { background: #f4f6f8; }
    .hrow.head {
      position: relative;
      z-index: 6;
      height: 47px;
      background: #eef3f8;
      color: #111;
      font-size: var(--head-fs); font-weight: 400;
      text-align: center;
    }
    .hrow.head .lock-cluster {
      z-index: 8;
      background: #eef3f8;
    }

    .cell {
      display: flex; align-items: center; justify-content: center;
      padding: 0 2px;
      font-size: var(--head-fs);
      font-weight: 400;
      overflow: hidden;
    }
    .lock-cluster .cell.pin-id {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1px;
      padding: 1px 2px;
    }
    /* 資料列：彩衣左上出血，不蓋馬號／馬名 */
    .hrow:not(.head) .cell.pin-id {
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr);
      grid-template-rows: 31px minmax(0, 1fr);
      align-items: stretch;
      justify-items: stretch;
      padding: 0;
      overflow: visible;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hrow:not(.head) .cell.pin-id:active {
      background: rgba(91, 163, 217, .16);
    }
    .hno {
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      justify-self: center;
      z-index: 2;
      display: grid;
      place-items: center;
      place-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--nav);
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      margin-top: -1px;
    }
    .hno > span,
    .draw-no > span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 1em;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums lining-nums;
      transform: translateY(-0.08em);
    }
    .hrow:not(.head) .cell.pin-id .hname {
      grid-column: 1 / -1;
      grid-row: 2;
      z-index: 2;
      align-self: center;
      max-width: none;
      width: 100%;
      padding: 0 1px 0;
      margin-top: -2px;
    }
    .hrow.head .lock-cluster .cell { padding: 0 2px; }
    .hrow.head .cell.head-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: center;
      align-content: center;
      justify-items: center;
      column-gap: 1px;
      row-gap: 0;
    }
    .hrow.head .cell.head-split .odds-sort { grid-column: 1; grid-row: 1; }
    .hrow.head .cell.head-split .head-static { grid-column: 1; grid-row: 2; }
    .hrow.head .cell.head-split .sort-hit {
      grid-column: 2; grid-row: 1 / span 2;
      align-self: center;
    }
    /* 獨贏／位置左、檔位豎排右，同一格 */
    .hrow.head .cell.pin-odds {
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 1px;
      padding: 0 2px;
    }
    .odds-labs {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      line-height: 1.02;
    }
    .draw-sort {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: var(--head-fs);
      font-weight: 400;
      padding: 0;
      line-height: 1.02;
      cursor: pointer;
    }
    .draw-lab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.02;
      font-size: inherit;
      font-weight: 400;
    }
    .sortable { cursor: pointer; user-select: none; }
    .head-static {
      display: block;
      font-size: var(--head-fs); font-weight: 400; line-height: 1.02;
      color: #111; cursor: default; user-select: none;
    }
    .odds-sort {
      display: inline-flex; flex-direction: row;
      align-items: center; justify-content: center; gap: 1px;
      width: auto; max-width: 100%; border: 0; background: transparent;
      color: inherit; font: inherit; font-size: var(--head-fs); font-weight: 400;
      padding: 0; line-height: 1.02; cursor: pointer; text-align: center;
      white-space: nowrap; border-radius: 3px;
    }
    .hrow.head .lock-cluster .odds-sort { font-size: var(--head-fs); line-height: 1.02; }
    .hrow.head .scroll-col .odds-sort {
      flex-direction: row; align-items: center; justify-content: center;
      gap: 1px; width: auto; font-size: var(--head-fs); white-space: nowrap;
      line-height: 1.02;
    }
    .odds-sort .lab { display: block; line-height: 1.02; font-size: inherit; }
    .sort-hit {
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; background: transparent; padding: 0; margin: 0;
      cursor: pointer; color: inherit; line-height: 1;
    }
    .sort-ico {
      display: inline-flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1px; flex: 0 0 auto;
      line-height: 1;
    }
    .sort-ico .u, .sort-ico .d {
      display: block; font-size: 10px; font-weight: 900;
      color: #c5cad3; line-height: 1;
    }
    .sortable.on { color: #2c5f8a; }
    .sort-ico .u.on, .sort-ico .d.on { color: var(--orange); }
    .hrow.head .cell.sort-on {
      background: #e4eef8;
      box-shadow: inset 0 -2px 0 #3b8fd4;
    }
    .cell.sort-col { background: rgba(91, 163, 217, .12); }
    .hrow.alt .cell.sort-col { background: rgba(91, 163, 217, .18); }

    .silk {
      display: block;
      width: 17px; height: 17px;
      border-radius: 0;
      background-color: transparent;
    }
    .hrow:not(.head) .cell.pin-id .silk {
      grid-column: 1;
      grid-row: 1;
      width: auto;
      min-width: 0;
      min-height: 0;
      align-self: stretch;
      justify-self: stretch;
      /* 相對上一版：上移 2px */
      margin: 2px 0 0 4px;
      height: calc(100% + 1px);
      overflow: hidden;
      z-index: 1;
    }
    .silk.has-img {
      background-color: transparent;
      background-size: contain;
      background-position: left top;
      background-repeat: no-repeat;
    }
    .hname {
      display: block;
      font-size: 13px; font-weight: 400; line-height: 1.02;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text); max-width: 52px;
      text-align: center;
      letter-spacing: -.02em;
    }

    .hrow:not(.head) .cell.pin-odds {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 3px 0 2px;
    }
    .draw-no {
      display: grid;
      place-items: center;
      place-content: center;
      flex: 0 0 auto;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 1px solid #cfd6de;
      background: #fff;
      font-size: 13px;
      font-weight: 400;
      line-height: 0;
      padding: 0;
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: 0;
      color: var(--text);
      text-align: center;
    }

    .odds { display: flex; flex-direction: column; align-items: center; gap: 4px; line-height: 1.02; }
    .odds .win { font-size: 14px; font-weight: 400; color: var(--text); }
    .odds .pla { font-size: 14px; font-weight: 400; color: #7b8494; }
    .odds .win.hot, .odds .pla.hot { color: var(--red); }
    .odds .na { color: var(--muted); font-size: 14px; }

    .muted { color: var(--muted); font-weight: 400; }
    .form { letter-spacing: .02em; font-weight: 400; font-variant-numeric: tabular-nums; }
    .comment { font-size: var(--head-fs); font-weight: 400; color: #4a5563; }
    /* 右滑列：列寬隨最長內容；數據到分隔線 = --scroll-col-gap */
    .scroll-col {
      position: relative;
      flex: 0 0 auto;
      width: max-content;
      min-width: 0;
      justify-content: center;
      padding: 0 calc(var(--scroll-col-gap) + var(--scroll-col-rule)) 0 var(--scroll-col-gap);
      overflow: hidden;
    }
    .scroll-col::after {
      content: "";
      position: absolute;
      top: var(--scroll-col-gap); bottom: var(--scroll-col-gap); right: 0;
      width: var(--scroll-col-rule);
      background: #e4e7ec;
      pointer-events: none;
    }
    .scroll-col.num {
      font-variant-numeric: tabular-nums;
      font-weight: 400;
    }
    .scroll-col .v {
      display: block;
      min-width: 0;
      max-width: none;
      overflow: visible;
      text-align: center;
      font-size: var(--head-fs);
      line-height: 1.05;
      white-space: nowrap;
    }
    .scroll-col .v.stacked {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      white-space: nowrap;
    }
    .scroll-col .v.stacked .nm,
    .scroll-col .v.stacked .sub {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      font: inherit;
      color: inherit;
      line-height: inherit;
    }

    .silk-1 { background:#e10600; } .silk-2 { background:#111; }
    .silk-3 { background:#0057b8; } .silk-4 { background:#ffd100; color:#222; }
    .silk-5 { background:#00a651; } .silk-6 { background:#e4007c; }
    .silk-7 { background:#00b5e2; color:#083044; } .silk-8 { background:#8a8d8f; }
    .silk-9 { background:#ff6a00; } .silk-10 { background:#6f2c91; }
    .silk-11 { background:#a8d08d; color:#1a3318; } .silk-12 { background:#7a1f2b; }
    .silk-13 { background:#fff; color:#111; box-shadow: inset 0 0 0 1px #999; }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function silkClass(n) { return "silk silk-" + (((Number(n) - 1 + SILK_N) % SILK_N) + 1); }
    function fmt(v) {

    }
    function splitNameAllow(s) {
      const t = String(s == null ? "" : s).trim();
      const m = t.match(/^(.*?)[\s\u3000]*([(\uFF08][+\-]?\d+[)\uFF09])$/);
      if (!m || !String(m[1]).trim()) return { name: t, allow: "" };
      return { name: m[1].trim(), allow: m[2] };
    }
    function sortVal(row, key) {
      if (key === "jockey") return splitNameAllow(row.jockey).name;
      return row[key];

    function cellValue(c, r) {
      if (c.key === "jockey") {

            '</span><span class="sub">' + esc(p.allow) + "</span></span>";

    }
    function numOrNull(v) {
      if (v == null || v === "" || v === "—") return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }
    function fmtOdds(v, kind) {
      const n = numOrNull(v);
      if (n == null) return "—";
      if (kind === "place") return n.toFixed(1);
      return Number.isInteger(n) ? String(n) : String(n);
    }
    /* 示意：同檔同場同一勝率，各場略轉一檔，方便先看版面 */
    const DRAW_WIN_DEMO = [10.8, 9.9, 9.4, 8.7, 8.2, 7.8, 7.4, 7.1, 7.6, 7.3, 8.0, 7.8];
    function drawWinPct(r) {
      const n = numOrNull(r && r.drawWinPct);
      if (n != null) return n;
      const d = numOrNull(r && r.draw);
      if (d == null || d < 1) return null;
      const shift = ((currentRace - 1) * 2) % DRAW_WIN_DEMO.length;
      return DRAW_WIN_DEMO[(d - 1 + shift) % DRAW_WIN_DEMO.length];
    }
    function fmtDrawPct(v) {
      const n = numOrNull(v);
      if (n == null) return "—";
      return n.toFixed(1) + "%";
    }
    function bestDrawPct() {
      let maxP = -Infinity;
      currentRunners().forEach((r) => {
        if (r.scratched) return;
        const n = numOrNull(drawWinPct(r));
        if (n != null) maxP = Math.max(maxP, n);
      });
      return maxP;
    }
    function silkTag(r) {

    function bestOdds() {

      currentRunners().forEach((r) => {
        if (r.scratched) return;
        if (numOrNull(r.win) != null) minW = Math.min(minW, r.win);

    function sortIco(key) {

        if (an != null && bn != null) cmp = an - bn;
        else cmp = String(av == null ? "" : av).localeCompare(String(bv == null ? "" : bv), "zh-Hant");

        }

    function bindHorseSheetOpens() {

    /* 連贏示意：由獨贏／位置合成三角矩陣；日後可換成真實 QIN／QPL 盤 */
    let qinMode = "qin"; /* qin=正Q；qpl=連贏位置 */
    function qinPairKey(a, b) {
      return a < b ? a + "-" + b : b + "-" + a;
    }
    function synthQinOdds(wa, wb) {
      const a = numOrNull(wa), b = numOrNull(wb);
      if (a == null || b == null) return null;
      let v = a * b * 0.26;
      if (v >= 999) return 999;
      if (v >= 100) return Math.round(v);
      if (v >= 20) return Math.round(v * 2) / 2;
      return Math.round(v * 10) / 10;
    }
    function synthQplOdds(pa, pb) {
      const a = numOrNull(pa), b = numOrNull(pb);
      if (a == null || b == null) return null;
      let v = a * b * 0.62;
      if (v >= 999) return 999;
      if (v >= 100) return Math.round(v);
      if (v >= 20) return Math.round(v * 2) / 2;
      return Math.round(v * 10) / 10;
    }
    function fmtQinOdds(v) {
      const n = numOrNull(v);
      if (n == null) return "—";
      if (n >= 100) return String(Math.round(n));
      if (Number.isInteger(n)) return String(n);
      return n.toFixed(1);
    }
    function synthQinIndex(odds) {
      const n = numOrNull(odds);
      if (n == null) return null;
      const raw = 98 - Math.log10(Math.max(n, 1.05)) * 14;
      return Math.max(70, Math.min(92, Math.round(raw)));
    }
    function qinDropClass(a, b, raceNum) {
      const seed = qinMode === "qpl" ? 7 : 0;
      const s = (a * 17 + b * 31 + (raceNum + seed) * 13) % 23;
      if (s === 0) return "drop50";
      if (s === 1 || s === 2) return "drop20";
      return "";
    }
    function qinIndexClass(idx) {
      const n = numOrNull(idx);
      if (n == null) return "";
      if (n >= 89) return "idx-b";
      if (n >= 87) return "idx-g";
      if (n >= 85) return "idx-r";
      return "";
    }
    function buildQinPairs() {
      let runners = currentRunners()
        .filter(function (r) { return !r.scratched && numOrNull(r.no) != null; })
        .slice()
        .sort(function (a, b) { return a.no - b.no; });
      if (runners.length > QIN_MAX_N) runners = runners.slice(0, QIN_MAX_N);
      const nos = runners.map(function (r) { return r.no; });
      const byNo = {};
      runners.forEach(function (r) { byNo[r.no] = r; });
      const oddsMap = {};
      let hotKey = null;
      let hotOdds = Infinity;
      const useQpl = qinMode === "qpl";
      for (let i = 0; i < nos.length; i++) {
        for (let j = i + 1; j < nos.length; j++) {
          const a = nos[i], b = nos[j];
          const key = qinPairKey(a, b);
          const od = useQpl
            ? synthQplOdds(byNo[a].place, byNo[b].place)
            : synthQinOdds(byNo[a].win, byNo[b].win);
          oddsMap[key] = od;
          if (od != null && od < hotOdds) {
            hotOdds = od;
            hotKey = key;
          }
        }
      }
      return { nos: nos, oddsMap: oddsMap, hotKey: hotKey, mode: qinMode };
    }
    function renderQinModeBtn(mode, label) {
      const on = qinMode === mode;
      return (
        '<button type="button" class="qin-mode-btn' + (on ? " on" : "") +
          '" data-qin-mode="' + mode + '" aria-pressed="' + (on ? "true" : "false") + '">' +
          label + "</button>"
      );
    }
    /* 單一矩陣：上三角＝賠率，下三角＝指數；首行/首列的「1」位分別放正Q、位置 */
    function renderQinTable(qin) {
      const nos = qin.nos;
      const n = nos.length;
      const useQpl = qin.mode === "qpl";
      const oddsLab = useQpl ? "連贏位置" : "連贏";
      const idxLab = useQpl ? "位置指數" : "連贏指數";
      if (n < 2) {
        return '<div class="qin-block"><div class="qin-legend" style="padding:12px 10px">暫無連贏組合</div></div>';
      }
      let html =
        '<div class="qin-block">' +
          '<div class="qin-x" id="qinX">' +
            '<table class="qin-tbl" data-n="' + n + '" data-qin-mode="' + esc(qin.mode || "qin") +
            '" aria-label="' + oddsLab + '賠率（上三角）與' + idxLab + '（下三角）">' +
            '<thead><tr role="group" aria-label="連贏盤種切換">' +
            '<th class="qin-title">連贏</th>' +
            '<th class="qin-ch qin-mode-cell">' + renderQinModeBtn("qin", "正Q") + "</th>";
      for (let j = 1; j < n; j++) {
        html += '<th class="qin-ch">' + esc(nos[j]) + "</th>";
      }
      html += "</tr></thead><tbody>";
      for (let i = 0; i < n; i++) {
        const rowHorse = nos[i];
        html += "<tr>";
        if (i === 0) {
          html += '<th class="qin-rh qin-mode-cell" scope="row">' +
            renderQinModeBtn("qpl", "位置") + "</th>";
        } else {
          html += '<th class="qin-rh" scope="row">' + esc(rowHorse) + "</th>";
        }
        for (let j = 0; j < n; j++) {
          const colHorse = nos[j];
          if (i === j) {
            html += '<th class="qin-h">' + esc(rowHorse) + "</th>";
            continue;
          }
          const key = qinPairKey(rowHorse, colHorse);
          const od = qin.oddsMap[key];
          if (j > i) {
            let cls = "qin-c";
            const text = fmtQinOdds(od);
            if (key === qin.hotKey) cls += " hot";
            else {
              const drop = qinDropClass(rowHorse, colHorse, currentRace);
              if (drop) cls += " " + drop;
            }
            html += '<td class="' + cls + '" data-qin-key="' + esc(key) +
              '" data-qin-kind="odds" role="button" tabindex="0" aria-label="' + oddsLab + " " +
              esc(key) + '">' + esc(text) + "</td>";
          } else {
            const idx = synthQinIndex(od);
            let cls = "qin-c idx-cell";
            const text = idx == null ? "—" : String(idx);
            const ic = qinIndexClass(idx);
            if (ic) cls += " " + ic;
            html += '<td class="' + cls + '" data-qin-key="' + esc(key) +
              '" data-qin-kind="idx" role="button" tabindex="0" aria-label="' + idxLab + " " +
              esc(key) + '">' + esc(text) + "</td>";
          }
        }
        html += "</tr>";
      }
      html += "</tbody></table></div></div>";
      return html;
    }
    function renderQinLegend() {
      const useQpl = qinMode === "qpl";
      return (
        '<div class="qin-legend">' +
          '<div class="qin-legend-row">' +
            '<span class="lab">上三角</span>' +
            '<span class="qin-leg">' + (useQpl ? "連贏位置賠率" : "連贏賠率") + "</span>" +
            '<span class="qin-leg"><span class="qin-swatch hot">00</span>大熱</span>' +
            '<span class="qin-leg"><span class="qin-swatch drop20">00</span>降20%</span>' +
            '<span class="qin-leg"><span class="qin-swatch drop50">00</span>降50%</span>' +
          "</div>" +
          '<div class="qin-legend-row">' +
            '<span class="lab">下三角</span>' +
            '<span class="qin-leg">' + (useQpl ? "連贏位置指數" : "連贏指數") + "</span>" +
            '<span class="qin-leg"><span class="qin-swatch hot">00</span>85–86</span>' +
            '<span class="qin-leg"><span class="qin-swatch drop20">00</span>87–88</span>' +
            '<span class="qin-leg"><span class="qin-swatch drop50">00</span>89+</span>' +
          "</div>" +
        "</div>"
      );
    }
    function renderQinPanelHtml() {
      const qin = buildQinPairs();
      return (
        '<div class="qin-panel" id="qinPanel">' +
          renderQinTable(qin) +
          renderQinLegend() +
        "</div>"
      );
    }
    function refreshQinPanel() {
      const panel = document.getElementById("qinPanel");
      const tbl = panel && panel.querySelector(".qin-tbl");
      if (!panel || !tbl || !el.boardMain) return;

      /* 就地改數值／按鈕態，不拆 qinX，避免 replace 瞬間撐高把整頁捲動上推 */
      const boardSt = el.board.scrollTop;
      const qinX = document.getElementById("qinX");
      const sl = qinX ? qinX.scrollLeft : 0;
      const st = qinX ? qinX.scrollTop : 0;
      const keepFocus = qinFocusKey;
      const active = document.activeElement;
      if (active && panel.contains(active) && typeof active.blur === "function") active.blur();

      const qin = buildQinPairs();
      const useQpl = qin.mode === "qpl";
      const oddsLab = useQpl ? "連贏位置" : "連贏";
      const idxLab = useQpl ? "位置指數" : "連贏指數";

      tbl.setAttribute("data-qin-mode", qin.mode || "qin");
      tbl.setAttribute("aria-label", oddsLab + "賠率（上三角）與" + idxLab + "（下三角）");

      panel.querySelectorAll("button.qin-mode-btn[data-qin-mode]").forEach(function (btn) {
        const on = btn.getAttribute("data-qin-mode") === qinMode;
        btn.classList.toggle("on", on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
      });

      tbl.querySelectorAll("td.qin-c[data-qin-key]").forEach(function (td) {
        const key = td.getAttribute("data-qin-key");
        const kind = td.getAttribute("data-qin-kind");
        const od = qin.oddsMap[key];
        const parts = String(key || "").split("-");
        const a = Number(parts[0]);
        const b = Number(parts[1]);
        const keptFocus = td.classList.contains("is-qin-focus");
        if (kind === "odds") {
          let cls = "qin-c";
          if (key === qin.hotKey) cls += " hot";
          else {
            const drop = qinDropClass(a, b, currentRace);
            if (drop) cls += " " + drop;
          }
          if (keptFocus) cls += " is-qin-focus";
          td.className = cls;
          td.textContent = fmtQinOdds(od);
          td.setAttribute("aria-label", oddsLab + " " + key);
        } else {
          const idx = synthQinIndex(od);
          let cls = "qin-c idx-cell";
          const ic = qinIndexClass(idx);
          if (ic) cls += " " + ic;
          if (keptFocus) cls += " is-qin-focus";
          td.className = cls;
          td.textContent = idx == null ? "—" : String(idx);
          td.setAttribute("aria-label", idxLab + " " + key);
        }
      });

      const legend = panel.querySelector(".qin-legend");
      if (legend) {
        const wrap = document.createElement("div");
        wrap.innerHTML = renderQinLegend();
        if (wrap.firstElementChild) legend.replaceWith(wrap.firstElementChild);
      }

      if (qinX) {
        qinX.scrollLeft = sl;
        qinX.scrollTop = st;
      }
      el.board.scrollTop = boardSt;
      qinFocusKey = keepFocus;
      if (keepFocus) setQinPairFocus(keepFocus, tbl);
    }
    function setQinMode(mode) {
      if (mode !== "qin" && mode !== "qpl") return;
      if (qinMode === mode) return;
      qinMode = mode;
      refreshQinPanel();
    }
    function bindQinModeSwitch() {
      const panel = document.getElementById("qinPanel");
      if (!panel || panel.dataset.modeBound === "1") return;
      panel.dataset.modeBound = "1";
      panel.addEventListener("click", function (ev) {
        const btn = ev.target && ev.target.closest ? ev.target.closest("button.qin-mode-btn[data-qin-mode]") : null;
        if (!btn || !panel.contains(btn)) return;
        ev.preventDefault();
        ev.stopPropagation();
        setQinMode(btn.getAttribute("data-qin-mode"));
      });
    }
    /* 格寬鎖定 14 匹視口：≤14 鋪滿；>14 同密度橫滑，最多 20；高度約 14 列可豎滑 */
    function fitQinTableWidths() {
      const panel = document.getElementById("qinPanel");
      const tbl = panel && panel.querySelector(".qin-tbl");
      const qinX = document.getElementById("qinX");
      if (!panel || !tbl) return;
      const n = Number(tbl.getAttribute("data-n") || 0);
      if (n < 2) return;
      const titleW = 40;
      const avail = Math.max(panel.clientWidth, 200);
      const denom = Math.min(n, QIN_FIT_N);
      const cell = Math.max(18, Math.floor((avail - titleW) / denom));
      const total = titleW + n * cell;
      panel.style.setProperty("--qin-title-w", titleW + "px");
      panel.style.setProperty("--qin-cell", cell + "px");
      tbl.style.width = total + "px";
      tbl.style.minWidth = total + "px";
      const fs = cell >= 24 ? 12 : cell >= 20 ? 11 : 10;
      tbl.style.fontSize = fs + "px";
      if (qinX) {
        /* 約鎖 14 列可視高度，超出（如 20 匹）在格內豎滑，首行 sticky 才會生效 */
        const rowsVisible = Math.min(n, QIN_FIT_N);
        qinX.style.maxHeight = (cell * (rowsVisible + 1) + 2) + "px";
      }
    }
    /* 輕點連贏格：同座標賠率／指數雙邊高亮提醒 */
    let qinFocusKey = "";
    function clearQinPairFocus(tbl) {
      const root = tbl || document.querySelector("#qinPanel .qin-tbl");
      if (!root) return;
      root.querySelectorAll(".qin-c.is-qin-focus").forEach(function (el) {
        el.classList.remove("is-qin-focus");
      });
      qinFocusKey = "";
    }
    function setQinPairFocus(key, tbl) {
      const root = tbl || document.querySelector("#qinPanel .qin-tbl");
      if (!root || !key) return;
      clearQinPairFocus(root);
      const nodes = root.querySelectorAll('.qin-c[data-qin-key="' + key + '"]');
      if (!nodes.length) return;
      nodes.forEach(function (el) { el.classList.add("is-qin-focus"); });
      qinFocusKey = key;
    }
    function bindQinPairFocus() {
      const tbl = document.querySelector("#qinPanel .qin-tbl");
      const qinX = document.getElementById("qinX");
      if (!tbl) return;
      if (qinFocusKey) setQinPairFocus(qinFocusKey, tbl);
      if (tbl.dataset.focusBound === "1") return;
      tbl.dataset.focusBound = "1";
      let tapMoved = false;
      if (qinX) {
        qinX.addEventListener("touchstart", function () { tapMoved = false; }, { passive: true });
        qinX.addEventListener("touchmove", function () { tapMoved = true; }, { passive: true });
      }
      function onActivate(cell) {
        if (!cell) return;
        const key = cell.getAttribute("data-qin-key");
        if (!key) return;
        if (qinFocusKey === key) clearQinPairFocus(tbl);
        else setQinPairFocus(key, tbl);
      }
      tbl.addEventListener("click", function (ev) {
        if (tapMoved) return;
        const cell = ev.target && ev.target.closest ? ev.target.closest("td.qin-c[data-qin-key]") : null;
        if (!cell || !tbl.contains(cell)) return;
        onActivate(cell);
      });
      tbl.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        const cell = ev.target && ev.target.closest ? ev.target.closest("td.qin-c[data-qin-key]") : null;
        if (!cell || !tbl.contains(cell)) return;
        ev.preventDefault();
        onActivate(cell);
      });
    }

    /* 豎向觸邊 1:1 帶頁；松手短慣性且可被新觸摸立刻打斷；橫向觸邊只擋回彈 */
    function bindQinOverscrollGuard() {
      const qinX = document.getElementById("qinX");
      const wrap = el.board;
      if (!qinX || !wrap || qinX.dataset.overscrollBound === "1") return;
      qinX.dataset.overscrollBound = "1";

      let startX = 0;
      let startY = 0;
      let lastY = 0;
      let axis = "";
      let samples = [];
      let wrapInertiaRaf = 0;
      let inertiaVel = 0;
      const DECEl = 0.994;

      function stopWrapInertia() {
        if (!wrapInertiaRaf) return;
        cancelAnimationFrame(wrapInertiaRaf);
        wrapInertiaRaf = 0;
        inertiaVel = 0;
      }

      function pushSample(y, t) {
        samples.push({ y: y, t: t });
        while (samples.length > 1 && t - samples[0].t > 80) samples.shift();
      }

      function sampleFingerVel() {
        if (samples.length < 2) return 0;
        const a = samples[0];
        const b = samples[samples.length - 1];
        const dt = b.t - a.t;
        if (dt < 12) return 0;
        return (b.y - a.y) / dt;
      }

      function startWrapInertia(fingerVelY) {
        stopWrapInertia();
        let v = fingerVelY;
        if (v > 2.2) v = 2.2;
        else if (v < -2.2) v = -2.2;
        if (Math.abs(v) < 0.08) return;
        inertiaVel = v;
        let prev = performance.now();
        function step(now) {
          const dt = Math.min(34, Math.max(0, now - prev));
          prev = now;
          v *= Math.pow(DECEl, dt);
          inertiaVel = v;
          wrap.scrollTop -= v * dt;
          if (Math.abs(v) > 0.04) wrapInertiaRaf = requestAnimationFrame(step);
          else {
            wrapInertiaRaf = 0;
            inertiaVel = 0;
          }
        }
        wrapInertiaRaf = requestAnimationFrame(step);
      }

      /* 整頁任意新觸摸／滾輪立刻打斷慣性，避免頂掉用戶新操作 */
      wrap.addEventListener("touchstart", stopWrapInertia, { passive: true, capture: true });
      wrap.addEventListener("pointerdown", stopWrapInertia, { passive: true, capture: true });
      wrap.addEventListener("wheel", stopWrapInertia, { passive: true, capture: true });

      qinX.addEventListener("touchstart", function (ev) {
        stopWrapInertia();
        axis = "";
        samples = [];
        if (!ev.touches || !ev.touches[0]) return;
        startX = ev.touches[0].clientX;
        startY = ev.touches[0].clientY;
        lastY = startY;
        pushSample(startY, performance.now());
      }, { passive: true });

      qinX.addEventListener("touchmove", function (ev) {
        if (!ev.touches || !ev.touches[0]) return;
        const x = ev.touches[0].clientX;
        const y = ev.touches[0].clientY;
        const now = performance.now();
        const dx = x - startX;
        const dy = y - startY;
        const deltaY = y - lastY;
        lastY = y;
        pushSample(y, now);

        /* 慣性進行中一旦再拖，立刻交出控制權 */
        if (wrapInertiaRaf) stopWrapInertia();

        if (!axis) {
          if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
          axis = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
        }

        const maxL = Math.max(0, qinX.scrollWidth - qinX.clientWidth);
        const maxT = Math.max(0, qinX.scrollHeight - qinX.clientHeight);
        const sl = qinX.scrollLeft;
        const st = qinX.scrollTop;

        if (axis === "h") {
          if ((sl <= 0 && dx > 0) || (sl >= maxL - 0.5 && dx < 0)) ev.preventDefault();
          return;
        }

        const atTop = st <= 0;
        const atBottom = st >= maxT - 0.5;
        if ((atTop && deltaY > 0) || (atBottom && deltaY < 0)) {
          wrap.scrollTop -= deltaY;
          ev.preventDefault();
        }
      }, { passive: false });

      qinX.addEventListener("touchend", function () {
        const maxT = Math.max(0, qinX.scrollHeight - qinX.clientHeight);
        const st = qinX.scrollTop;
        const atTop = st <= 0;
        const atBottom = st >= maxT - 0.5;
        const vel = sampleFingerVel();
        /* 僅在手指仍觸邊松手時給很短續滑；不再把表內原生慣性自動甩到整頁 */
        if (axis === "v" && ((atTop && vel > 0.1) || (atBottom && vel < -0.1))) {
          startWrapInertia(vel * 0.85);
        }
        samples = [];
      }, { passive: true });
      qinX.addEventListener("touchcancel", function () {
        samples = [];
        stopWrapInertia();
      }, { passive: true });

      qinX.addEventListener("wheel", function (ev) {
        stopWrapInertia();
        const maxT = Math.max(0, qinX.scrollHeight - qinX.clientHeight);
        const st = qinX.scrollTop;
        const atTop = st <= 0;
        const atBottom = st >= maxT - 0.5;
        if ((atTop && ev.deltaY < 0) || (atBottom && ev.deltaY > 0)) {
          wrap.scrollTop += ev.deltaY;
          ev.preventDefault();
        }
      }, { passive: false });
    }

    /* 豎向：board-head-pin CSS sticky；橫向：board-head-x.scrollLeft 跟隨 board-x（無 transform） */
    let headScrollBound = false;
    function syncHeadScrollLeft() {
      const body = el.boardX;
      const headX = el.boardHeadX;
      if (!body || !headX) return;
      const sl = body.scrollLeft || 0;
      if (headX.scrollLeft !== sl) headX.scrollLeft = sl;
    }
    function bindHorseHeadScroll() {
      if (!el.boardX || !el.boardHeadX) return;
      if (!headScrollBound) {
        headScrollBound = true;
        el.boardX.addEventListener("scroll", syncHeadScrollLeft, { passive: true });
      }
      syncHeadScrollLeft();
    }

    function renderBoard() {
      const hot = bestOdds();
      const rows = sortedRows();
      const sl = el.boardX ? el.boardX.scrollLeft : 0;
      const st = el.board.scrollTop;
      const lockHead =
        '<div class="lock-cluster">' +
          '<div class="cell pin-id head-split' + headOn("no") + '">' +
            headBtn("no", "馬號", false) + headStatic("馬名") + sortHit("no") +
          "</div>" +
          '<div class="cell pin-odds' + headOn("draw") + '">' +
            '<div class="odds-labs">' + headStatic("獨贏") + headStatic("位置") + "</div>" +
            '<button type="button" class="draw-sort sortable' + (sortKey === "draw" ? " on" : "") +
            '" data-sort="draw" aria-sort="' +
            (sortKey === "draw" ? (sortDir > 0 ? "ascending" : "descending") : "none") +
            '"><span class="draw-lab"><span>檔</span><span>位</span></span>' +
            sortIco("draw") + "</button></div></div>";
      const scrollHeadCells = SCROLL_COLS.map((c) =>
        '<div class="cell ' + c.cls + headOn(c.key) + '">' + headBtn(c.key, c.label) + "</div>"
      ).join("");
      const head =
        '<div class="hrow head">' +
          lockHead +
          '<div class="board-head-x" id="boardHeadX">' +
            '<div class="head-scroll-inner">' + scrollHeadCells + "</div>" +
          "</div>" +
        "</div>";

      const body = rows.map((r, i) => {
        const alt = i % 2 ? " alt" : "";
        const scratch = r.scratched ? " scratched" : "";
        const winHot = !r.scratched && r.win === hot.minW ? " hot" : "";
        const plaHot = !r.scratched && r.place === hot.minP ? " hot" : "";
        const odds = r.scratched || r.win == null
          ? '<div class="odds"><span class="na">—</span></div>'
          : '<div class="odds"><span class="win' + winHot + '">' + esc(fmtOdds(r.win, "win")) +
            '</span><span class="pla' + plaHot + '">' + esc(fmtOdds(r.place, "place")) + "</span></div>";
        const name = '<span class="hname">' + esc(r.name) + "</span>";
        const lock =
          '<div class="lock-cluster">' +
            '<div class="cell pin-id' + colOn("no") + '" data-no="' + esc(r.no) + '" role="button" tabindex="0" aria-label="查看 ' + esc(r.name) + ' 詳情">' + silkTag(r) +
            '<span class="hno"><span>' + esc(r.no) + "</span></span>" + name + "</div>" +
            '<div class="cell odds pin-odds' + colOn("draw") + '">' + odds +
            '<span class="draw-no"><span>' + esc(r.draw) + "</span></span></div>" +
          "</div>";
        const cells = SCROLL_COLS.map((c) =>
          '<div class="cell ' + c.cls + colOn(c.key) + '">' + cellValue(c, r) + "</div>"
        ).join("");
        return '<div class="hrow' + alt + scratch + '">' + lock + cells + "</div>";
      }).join("");

      el.boardMain.innerHTML =
        '<div class="board-horses" id="boardHorses">' +
          '<div class="board-head-pin" id="boardHead">' + head + "</div>" +
          '<div class="board-x" id="boardX">' + body + "</div>" +
        "</div>" +
        renderQinPanelHtml();
      el.boardX = document.getElementById("boardX");
      el.boardHeadX = document.getElementById("boardHeadX");
      headScrollBound = false;
      fitScrollColWidths();
      fitQinTableWidths();
      if (el.boardX) el.boardX.scrollLeft = sl;
      syncHeadScrollLeft();
      el.board.scrollTop = st;

      document.querySelectorAll("#board [data-sort]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-sort");
          if (!key || key === "name" || key === "place" || key === "win" || key === "drawWinPct") return;
          if (sortKey === key) sortDir = -sortDir;
          else { sortKey = key; sortDir = 1; }
          renderBoard();
        });
      });
      bindHorseSheetOpens();
      bindHorseHeadScroll();
      bindQinOverscrollGuard();
      bindQinPairFocus();
      bindQinModeSwitch();
    }

    applyColFitRule();
    renderPills();
    renderMeta();
    renderBoard();
    if (el.sheetClose) {
      el.sheetClose.addEventListener("click", closeHorseSheet);
    }
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") closeHorseSheet();
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { renderBoard(); });
    }
    window.addEventListener("resize", function () {
      fitQinTableWidths();
      syncHeadScrollLeft();
    });
  })();
  </script>
</body>
</html>

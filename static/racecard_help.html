<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("j18-racecard-theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="noindex" />
  <title>使用說明 · J18</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav: #3d5a80;
      --nav-2: #334b6b;
      --page: #eef1f5;
      --card: #fff;
      --text: #2c3340;
      --muted: #6b7585;
      --line: #e4e7ec;
      --orange: #e67e22;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    html[data-theme="dark"] {
      --nav: #6a86a8;
      --nav-2: #2a3d58;
      --page: #151a21;
      --card: #1e242c;
      --text: #e8eef6;
      --muted: #a8b3c2;
      --line: rgba(210, 222, 236, .18);
      --orange: #ffb14a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top, 0px));
      background: linear-gradient(180deg, #4a6a90 0%, var(--nav-2) 100%);
      color: #fff;
      box-shadow: 0 2px 10px rgba(30, 42, 58, .18);
    }
    html[data-theme="dark"] .top {
      background: linear-gradient(180deg, #3d5574 0%, #24344a 100%);
    }
    .back {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, .14);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .back:active { background: rgba(255, 255, 255, .26); }
    .top-title {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 12px max(24px, env(safe-area-inset-bottom, 0px));
    }
    .sec {
      margin: 0 0 14px;
      padding: 12px 12px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      box-shadow: inset 3px 0 0 var(--nav);
    }
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 0;
    }
    .log-item {
      padding: 10px 10px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(61, 90, 128, .04);
    }
    html[data-theme="dark"] .log-item {
      background: rgba(255, 255, 255, .03);
    }
    .log-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }
    .log-no {
      color: var(--nav);
      font-variant-numeric: tabular-nums;
    }
    .log-ver {
      color: var(--orange);
      font-variant-numeric: tabular-nums;
    }
    .log-at {
      color: var(--muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .log-body {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text);
      white-space: pre-wrap;
    }
    .empty {
      margin-top: 12px;
      padding: 18px 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="top">
    <button type="button" class="back" id="helpBack" aria-label="返回排位">‹</button>
    <div class="top-title">使用說明</div>
  </header>
  <main class="wrap">
    <section class="sec" aria-label="功能更新日誌">
      <div class="log-list" id="changelogList" aria-live="polite"></div>
    </section>
  </main>
  <script>
    /*
      日誌規矩（頁面不展示說明文案）：
      1) 只記功能修改的終態結果，不記中途嘗試／反覆改版過程；
      2) 合併精簡、重排序號本身不算功能改動，不另開序號；
      3) 序號升序存儲，畫面由新到舊顯示。
    */
    const FEATURE_CHANGELOG = [
      {
        no: 1,
        version: "0.2.412",
        at: "2026-11-01 00:40",
        body: "新增菜單「使用說明」獨立頁，內含按序號記錄的版本更新日誌（版本／時間／修改內容）。"
      },
      {
        no: 2,
        version: "0.2.416",
        at: "2026-11-01 18:55",
        body: "點馬名開啟的馬匹詳情暫只保留彩衣、馬號、馬名；其餘內容已清空，待重新設計排版。"
      },
      {
        no: 3,
        version: "0.2.417",
        at: "2026-11-18 01:40",
        body: "水位彈窗鎖定列右側新增「最高」：上獨贏、中位置、下 WP+ 只顯示曾達到的最高折扣，不顯示貨量。"
      },
      {
        no: 4,
        version: "0.2.418",
        at: "2026-11-18 01:40",
        body: "心水標記表頭不再排序；點擊打開心水戰績彈窗。"
      },
      {
        no: 5,
        version: "0.2.419",
        at: "2026-11-18 01:50",
        body: "心水名家榜：本人收益為正且該範圍有參與、但未進前十時，末行顯示真實名次與場數、金額；非正收益或該範圍未參加則不顯示。"
      },
      {
        no: 6,
        version: "0.2.420",
        at: "2026-11-19 00:30",
        body: "名家貼士「名家綜合心水」標題改為「名家心水權重」。"
      },
      {
        no: 7,
        version: "0.2.425",
        at: "2026-11-19 02:54",
        body: "菜單最下方新增「登入」，進入登入／註冊頁：頂欄藍底，返回在左側並寫上「返回」，中間登入／註冊膠囊收窄；登入含帳號密碼、手機驗證碼、電郵驗證碼，註冊只含手機與電郵驗證碼。帳號密碼登入不顯示驗證碼。區號候選在區號框下方展開，不遮住區號。忘記密碼先提示使用手機或電郵接收驗證碼登入，再進入登入的手機驗證碼。手機驗證碼發送 60 秒倒計時，連續 3 次錯誤冷卻乘 3；電郵不套用該冷卻。"
      },
      {
        no: 8,
        version: "0.2.426",
        at: "2026-11-20 19:50",
        body: "馬匹詳情先排賠率與水位：獨贏、位置各一行，左為現價、右為現水位；其下黃為隔夜、綠為最高、紅為最低，旁有顏色圖例。馬名後可看並切換燕尾與心水標記。"
      },
      {
        no: 9,
        version: "0.2.427",
        at: "2026-11-20 19:58",
        body: "馬匹詳情的賠率與水位改成卡片：現價放大，隔夜、最高、最低收成淺色小塊，顏色圖例放在卡片頂欄。燕尾與心水改成頂欄上的圖標和膠囊。"
      },
      {
        no: 10,
        version: "0.2.428",
        at: "2026-11-20 20:05",
        body: "馬匹詳情的賠率水位卡片收矮：去掉重複的「賠率 · 水位」標題，顏色圖例改到「賠率」「水位」同一行右側。"
      },
      {
        no: 11,
        version: "0.2.429",
        at: "2026-11-20 20:32",
        body: "馬匹詳情的隔夜、最高、最低改到現價右側，由上到下排列，不再鋪在大數字下面。"
      },
      {
        no: 12,
        version: "0.2.432",
        at: "2026-11-20 21:08",
        body: "馬匹詳情的賠率與水位改成區間：現價為主，最低到最高畫成一條軸，現價是軸上的圓點，隔夜是金色刻度。顏色沿用排位頁的紅、綠、黃。"
      },
      {
        no: 13,
        version: "0.2.433",
        at: "2026-11-20 21:14",
        body: "馬匹詳情把「賠率」「水位」挪到現價左側，不再單獨占一行壓在大數字上，整塊因此收矮。"
      },
      {
        no: 14,
        version: "0.2.434",
        at: "2026-11-20 21:20",
        body: "馬匹詳情的現價後面加上與馬匹列表相同的漲跌三角。賠率推送升降時，箭頭同樣呼吸三次。"
      },
      {
        no: 15,
        version: "0.2.435",
        at: "2026-11-20 21:28",
        body: "馬匹詳情的水位現價後面也加上漲跌三角。水位推送升降時，與賠率一樣呼吸三次。"
      }
    ];

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderChangelog() {
      const root = document.getElementById("changelogList");
      if (!root) return;
      const rows = FEATURE_CHANGELOG.slice().sort(function (a, b) {
        return (Number(b.no) || 0) - (Number(a.no) || 0);
      });
      if (!rows.length) {
        root.innerHTML = '<div class="empty">暫無更新紀錄</div>';
        return;
      }
      root.innerHTML = rows.map(function (it) {
        return '<article class="log-item" data-log-no="' + esc(it.no) + '">' +
          '<div class="log-meta">' +
            '<span class="log-no">#' + esc(it.no) + "</span>" +
            '<span class="log-ver">v' + esc(it.version) + "</span>" +
            '<span class="log-at">' + esc(it.at) + "（香港時間）</span>" +
          "</div>" +
          '<p class="log-body">' + esc(it.body) + "</p>" +
        "</article>";
      }).join("");
    }

    function goBack() {
      try {
        if (window.history.length > 1 && document.referrer) {
          window.history.back();
          return;
        }
      } catch (e) {}
      window.location.href = "racecard.html";
    }

    document.getElementById("helpBack").addEventListener("click", function (ev) {
      ev.preventDefault();
      goBack();
    });
    renderChangelog();
  </script>
</body>
</html>
